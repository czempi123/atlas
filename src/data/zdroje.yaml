  - { id: sep-stoicism, druh: encyklopedie, nazev: "Stoicism", autor: "Dirk Baltzly", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/stoicism/", overeno: 2026-09-29 }
