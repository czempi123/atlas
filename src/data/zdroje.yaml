  - { id: sep-aristotle-ethics, druh: encyklopedie, nazev: "Aristotle's Ethics", autor: "Richard Kraut", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/aristotle-ethics/", overeno: 2026-10-05, poznamka: "Nauka o středu (EN 1106a26–b28). 5. 10. 2026 (celek 5, četl nástroj WebFetch): ctnost povahy je sklon vzniklý zvykem (hexis); Aristotelés nenabízí rozhodovací postup a tvrdí, že to žádná etická teorie neumí; některé city a činy jsou špatné vždy; akrasia má dva druhy, zbrklost a slabost; v jejím výkladu se Aristotelés kupodivu drží blízko Sókrata." }
  - { id: sep-aristotle, druh: encyklopedie, nazev: "Aristotle", autor: "Christopher Shields", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/aristotle/", overeno: 2026-10-05, poznamka: "Rev. 25. 8. 2020. Oddíl Life: Stageira 384, Akademie asi od sedmnácti do Platónovy smrti 347, Assos asi tři roky, Lesbos další dva roky s Theofrastem, sňatek s Pýthiadou, Hermeiovou neteří; roku 343 na Filipovu žádost do Pelly učit třináctiletého Alexandra; výuka trvala spíš jen dva nebo tři roky a ví se o ní málo; 335 návrat do Athén a škola v Lykeiu; jméno peripatetiků asi od krytého ochozu (peripatos); Herpyllis a syn Níkomachos; 323 odchod do Chalkidy, výrok o druhém hříchu proti filozofii jako často opakované vyprávění; zemřel 322 přirozenou smrtí. Oddíl o díle: snad až dvě stě spisů, dochováno asi 31; dialogy ztraceny; Cicero o zlaté řece; dochované texty jsou nejspíš zápisky k přednáškám. 5. 10. 2026 četl stránku nástroj WebFetch." }
