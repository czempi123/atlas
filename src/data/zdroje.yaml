  - id: etika-1155b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VIII, 2, 1155b29–31
    cesky: "Bylo by asi směšné přát vínu dobro. Leda si člověk přeje, aby vydrželo, aby ho měl on sám. Příteli se ale, jak se říká, má přát dobro kvůli němu."
    original: "γελοῖον γὰρ ἴσως τῷ οἴνῳ βούλεσθαι τἀγαθά, ἀλλʼ εἴπερ, σῴζεσθαι βούλεται αὐτόν, ἵνα αὐτὸς ἔχῃ· τῷ δὲ φίλῳ φασὶ δεῖν βούλεσθαι τἀγαθὰ ἐκείνου ἕνεκα"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („it would be ridiculous to wish well to a bottle of wine“)"
    zdroj: aristoteles-etika-viii
  - id: etika-1156a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VIII, 3, 1156a19–21
    cesky: "Taková přátelství se snadno rozpadají, když ti dva nezůstanou stejní: jakmile si přestanou být příjemní nebo užiteční, přestanou se mít rádi."
    original: "εὐδιάλυτοι δὴ αἱ τοιαῦταί εἰσι, μὴ διαμενόντων αὐτῶν ὁμοίων· ἐὰν γὰρ μηκέτι ἡδεῖς ἢ χρήσιμοι ὦσι, παύονται φιλοῦντες"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; řeč je o přátelstvích pro užitek a pro příjemnost"
    zdroj: aristoteles-etika-viii
  - id: etika-1156b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VIII, 3, 1156b31–32
    cesky: "Přání být přáteli vzniká rychle, přátelství ne."
    original: "βούλησις μὲν γὰρ ταχεῖα φιλίας γίνεται, φιλία δʼ οὔ"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („the wish to be friends is a quick growth, but friendship is not“)"
    zdroj: aristoteles-etika-viii
  - id: politika-1253a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 2, 1253a2–3
    cesky: "Člověk je od přírody tvor obce."
    original: "ὁ ἄνθρωπος φύσει πολιτικὸν ζῷον"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama („man is by nature a political animal“)"
    zdroj: aristoteles-politika-i
  - id: politika-1253a-buh
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 2, 1253a27–29
    cesky: "Kdo nedokáže žít ve společenství nebo je tak soběstačný, že nic nepotřebuje, není částí obce: je to buď zvíře, nebo bůh."
    original: "ὁ δὲ μὴ δυνάμενος κοινωνεῖν ἢ μηδὲν δεόμενος διʼ αὐτάρκειαν οὐθὲν μέρος πόλεως, ὥστε ἢ θηρίον ἢ θεός"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama"
    zdroj: aristoteles-politika-i
  - id: politika-1253b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 3, 1253b20–23
    cesky: "Jiní mají za to, že být pánem otroka je proti přírodě: jeden je prý otrok a druhý svobodný jen podle zákona, od přírody se ničím neliší. Proto to prý ani není spravedlivé, je to totiž násilí."
    original: "τοῖς δὲ παρὰ φύσιν τὸ δεσπόζειν (νόμῳ γὰρ τὸν μὲν δοῦλον εἶναι τὸν δʼ ἐλεύθερον, φύσει δʼ οὐθὲν διαφέρειν)· διόπερ οὐδὲ δίκαιον· βίαιον γάρ"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; Aristotelés tu uvádí názor jiných, se kterým nesouhlasí; koho míní, neříká"
    zdroj: aristoteles-politika-i
  - id: politika-1253b-clunky
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 4, 1253b33–1254a1
    cesky: "Kdyby každý nástroj dokázal na pokyn, nebo protože sám tuší, co je třeba, vykonat svou práci, kdyby člunky tkaly samy a trsátka sama hrála na kitharu, nepotřebovali by stavitelé pomocníky ani páni otroky."
    original: "εἰ γὰρ ἠδύνατο ἕκαστον τῶν ὀργάνων κελευσθὲν ἢ προαισθανόμενον ἀποτελεῖν τὸ αὑτοῦ ἔργον … οὕτως αἱ κερκίδες ἐκέρκιζον αὐταὶ καὶ τὰ πλῆκτρα ἐκιθάριζεν, οὐδὲν ἂν ἔδει οὔτε τοῖς ἀρχιτέκτοσιν ὑπηρετῶν οὔτε τοῖς δεσπόταις δούλων"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; vypuštěno přirovnání k Daidalovým sochám a Héfaistovým trojnožkám"
    zdroj: aristoteles-politika-i
  - id: politika-1255a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 5, 1255a1–3
    cesky: "Je tedy zřejmé, že někteří lidé jsou od přírody svobodní a jiní otroci, a pro ty je otroctví prospěšné i spravedlivé."
    original: "ὅτι μὲν τοίνυν εἰσὶ φύσει τινὲς οἱ μὲν ἐλεύθεροι οἱ δὲ δοῦλοι, φανερόν, οἷς καὶ συμφέρει τὸ δουλεύειν καὶ δίκαιόν ἐστιν"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; hned potom Aristotelés připouští, že odpůrci mají „v jistém smyslu“ pravdu (1255a3–4)"
    zdroj: aristoteles-politika-i
  - id: politika-1260a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: I, 13, 1260a12–14
    cesky: "Otrok schopnost rozvažovat vůbec nemá, žena ji má, ale bez rozhodující váhy, a dítě ji má, ale nehotovou."
    original: "ὁ μὲν γὰρ δοῦλος ὅλως οὐκ ἔχει τὸ βουλευτικόν, τὸ δὲ θῆλυ ἔχει μέν, ἀλλʼ ἄκυρον, ὁ δὲ παῖς ἔχει μέν, ἀλλʼ ἀτελές"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama; ἄκυρον překládá SEP „without authority“"
    zdroj: aristoteles-politika-i
  # Výroky a závěť, jak je podává Diogenés Laertios asi 550 let po Aristotelovi, a Ailiános asi 520 let po něm: tradované.
  - id: dl-v-15
    osoba: aristoteles
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: V, 15
    cesky: "Z otroků, kteří mi sloužili, ať není nikdo prodán. Ať slouží dál, a až dospějí, ať jsou propuštěni na svobodu, jak si zaslouží."
    original: "μὴ πωλεῖν δὲ τῶν παίδων μηδένα τῶν ἐμὲ θεραπευόντων, ἀλλὰ χρῆσθαι αὐτοῖς· ὅταν δʼ ἐν ἡλικίᾳ γένωνται, ἐλευθέρους ἀφεῖναι κατʼ ἀξίαν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („none of the servants who waited upon me shall be sold“); ze závěti, jak ji uvádí Diogenés Laertios"
    zdroj: dl-v
  - id: dl-v-16
