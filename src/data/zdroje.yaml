  # Celek 3 „Co mám ve svých rukou?“ (docs/podklady/celek-3-co-mam-v-rukou.md). Vlastní převody z řeckého a latinského textu.
  # προαίρεσις převádím jako „vůle“, φαντασία jako „dojem“, τὰ ἐφʼ ἡμῖν jako „co je v naší moci“.
  - id: origenes-vii-53
    osoba: epiktetos
    autor: Órigenés
    dilo: Proti Kelsovi
    misto: VII, 53
    cesky: "Neříkal jsem, že ji zlomíš?"
    original: "οὐκ ἔλεγον … ὅτι κατάσσεις;"
    preklad:
      druh: vlastni
      podle: "řecký text (P. Koetschau); tradovaný výrok, který Epiktétovi připisuje Kelsos; řecky přítomný čas („lámeš ji“)"
    zdroj: origenes-kelsos
  - id: rukojet-1
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "1"
    cesky: "Některé věci jsou v naší moci a jiné ne. V naší moci je úsudek, podnět k činu, touha a odpor: jedním slovem všechno, co je naše dílo. V naší moci není tělo, majetek, pověst a úřady: jedním slovem všechno, co naše dílo není."
    original: "τῶν ὄντων τὰ μέν ἐστιν ἐφʼ ἡμῖν, τὰ δὲ οὐκ ἐφʼ ἡμῖν. ἐφʼ ἡμῖν μὲν ὑπόληψις, ὁρμή, ὄρεξις, ἔκκλισις καὶ ἑνὶ λόγῳ ὅσα ἡμέτερα ἔργα· οὐκ ἐφʼ ἡμῖν δὲ τὸ σῶμα, ἡ κτῆσις, δόξαι, ἀρχαὶ καὶ ἑνὶ λόγῳ ὅσα οὐχ ἡμέτερα ἔργα."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-1-5
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "1"
    cesky: "Jsi dojem, a vůbec ne to, čím se zdáš být."
    original: "φαντασία εἶ καὶ οὐ πάντως τὸ φαινόμενον"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa („You are an appearance, and in no manner what you appear to be“)"
    zdroj: epiktetos-rukojet
  - id: rukojet-5
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "5"
    cesky: "Lidi neznepokojují věci, ale jejich soudy o věcech."
    original: "ταράσσει τοὺς ἀνθρώπους οὐ τὰ πράγματα, ἀλλὰ τὰ περὶ τῶν πραγμάτων δόγματα"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-9
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "9"
    cesky: "Nemoc je překážkou těla, ne vůle, pokud to vůle sama nechce. Kulhání je překážkou nohy, ne vůle."
    original: "νόσος σώματός ἐστιν ἐμπόδιον, προαιρέσεως δὲ οὔ, ἐὰν μὴ αὐτὴ θέλῃ. χώλανσις σκέλους ἐστὶν ἐμπόδιον, προαιρέσεως δὲ οὔ."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-14
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "14"
    cesky: "Kdo chce být svobodný, ať nechce nic a ničemu se nevyhýbá z toho, co je v moci druhých. Jinak z něj nutně bude otrok."
    original: "ὅστις οὖν ἐλεύθερος εἶναι βούλεται, μήτε θελέτω τι μήτε φευγέτω τι τῶν ἐπʼ ἄλλοις· εἰ δὲ μή, δουλεύειν ἀνάγκη."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-17
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "17"
    cesky: "Pamatuj, že jsi herec ve hře, jakou chce ten, kdo ji uvádí. Tvým úkolem je dobře zahrát roli, kterou jsi dostal. Vybrat ji náleží jinému."
    original: "μέμνησο, ὅτι ὑποκριτὴς εἶ δράματος, οἵου ἂν θέλῃ ὁ διδάσκαλος … σὸν γὰρ τοῦτʼ ἔστι, τὸ δοθὲν ὑποκρίνασθαι πρόσωπον καλῶς· ἐκλέξασθαι δʼ αὐτὸ ἄλλου."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa; zkráceno (vynechán výčet rolí)"
    zdroj: epiktetos-rukojet
  - id: rukojet-20
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "20"
    cesky: "Když tě někdo podráždí, věz, že tě podráždil tvůj vlastní soud."
    original: "ὅταν οὖν ἐρεθίσῃ σέ τις, ἴσθι, ὅτι ἡ σή σε ὑπόληψις ἠρέθικε"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-43
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "43"
    cesky: "Každá věc má dvě ucha: za jedno se unést dá, za druhé ne."
    original: "πᾶν πρᾶγμα δύο ἔχει λαβάς, τὴν μὲν φορητήν, τὴν δὲ ἀφόρητον"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rozpravy-i-1-23
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 1, 23
    cesky: "Nohu mi spoutáš. Mou vůli nepřemůže ani Zeus."
    original: "τὸ σκέλος μου δήσεις, τὴν προαίρεσιν δὲ οὐδʼ ὁ Ζεὺς νικῆσαι δύναται"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rozpravy
  # Slova senátora Helvidia Priska císaři Vespasianovi, jak je vypráví Epiktétos; věta před citátem to musí říct.
  - id: rozpravy-i-2-21
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 2, 21
    cesky: "Ty udělej své a já udělám své. Tvoje je zabít, moje zemřít a netřást se."
    original: "καὶ σὺ τὸ σὸν ποιήσεις κἀγὼ τὸ ἐμόν. σόν ἐστιν ἀποκτεῖναι, ἐμὸν ἀποθανεῖν μὴ τρέμοντα"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa; slova Helvidia Priska v Epiktétově vyprávění"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-i-16-20
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 16, 20
    cesky: "Co jiného mohu já, chromý stařec, než zpívat chválu bohu?"
    original: "τί γὰρ ἄλλο δύναμαι γέρων χωλὸς εἰ μὴ ὑμνεῖν τὸν θεόν;"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-i-18-15
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
