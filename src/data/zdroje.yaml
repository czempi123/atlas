  # Celek 2 „Jak mám žít?“ (docs/podklady/celek-2-jak-zit.md): řecké a latinské texty z PerseusDL a First1KGreek.
  - { id: dl-x-1, druh: pramen, nazev: "Životy filozofů X, 1–26", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Epikúros: Samos, v 18 letech do Athén, Kolofón (1); k filozofii ve 14 letech, učitelé a Hésiodův chaos (2); otrok Mys (3, 10); pomluvy (3–8), obhajoba (9–10); přátelé žijí v zahradě, 80 min (10); voda a trocha vína, majetek nedávají dohromady, jak žádala Pýthagorova zásada „přátelé mají všechno společné“ (κοινὰ τὰ φίλων), chléb a voda, hrnek sýra (11); narozen 341, škola od 32 let, zemřel 271/270 v 72 letech (14–15); závěť a propuštění otroků (16–21); Metrodóros, Polyainos, Hermarchos, Leonteus a Themista (22–25); asi 300 svitků (26)." }
  - { id: hesiodos-theogonia, druh: pramen, nazev: "Theogonia 116", autor: Hésiodos, dilo: "Theogonia, řecky (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0020/tlg001/tlg0020.tlg001.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Jako úplně první vznikl Chaos (ἦ τοι μὲν πρώτιστα Χάος γένετʼ); k Epikúrově otázce učitelům (Diogenés Laertios X, 2)." }
  - { id: dl-x-117, druh: pramen, nazev: "Životy filozofů X, 117–121", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Moudrý podle Epikúra a jeho školy: nebude se účastnit politiky, nebude žít jako kynik ani žebrat (119, podle spisu O způsobech života I a II); přátelství kvůli potřebám, ale někdo musí začít jako při setí; v chudobě si vydělá moudrostí (120)." }
  - { id: dl-x-122, druh: pramen, nazev: "Dopis Menoikeovi (Životy filozofů X, 122–135)", autor: Epikúros, dilo: "u Diogena Laertia, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Dělení tužeb (127); cílem je nemít bolest ani strach, bouře duše (128); ne každou slast volíme (129); soběstačnost, přepych si nejvíc užije, kdo ho nepotřebuje (130); ječná placka (μᾶζα) a voda, slast není prostopášnost (131); rozumnost a ctnosti (132). 8. 10. 2026 (celek 6): smrt se nás netýká, všechno dobré a zlé je ve vnímání, „zvykej si“ (124); dokud jsme my, není smrt; co netrápí přítomné, trápí naprázdno očekávané (125); moudrý život neodmítá a nežití se nebojí, z času sklízí nejpříjemnější, ne nejdelší; posměšek tomu, kdo říká, že nejlepší je se nenarodit (126–127; do studentského textu ne)." }
  - { id: dl-x-136, druh: pramen, nazev: "Životy filozofů X, 136–138", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Klidová slast (ataraxia, aponia) a slast v pohybu (radost, veselí), citát ze spisu O volbě (136); rozdíl od kyrénaiků (136–137)." }
  - { id: dl-x-139, druh: pramen, nazev: "Hlavní myšlenky (Životy filozofů X, 139–154)", autor: Epikúros, dilo: "Kyriai doxai u Diogena Laertia, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "KD 3 strop slasti (139); KD 15 bohatství přírody, KD 18 slast se jen obměňuje (144); KD 26–28 nenutné touhy, přátelství (148); KD 29 trojí dělení tužeb se scholiem (149). 3. 10. 2026 (celek 4): KD 34–35, nespravedlnost a strach z odhalení (151). 8. 10. 2026 (celek 6): KD 2 smrt se nás netýká (139); KD 4 velká bolest je krátká (140); KD 19–21 omezený čas pojme stejně slasti jako nekonečný (145–146)." }
  - { id: gnomologium-vaticanum, druh: pramen, nazev: "Vatikánské výroky", autor: Epikúros, dilo: "Gnomologium Vaticanum Epicureum, vyd. P. von der Mühll (Teubner 1922), First1KGreek", url: "https://github.com/OpenGreekAndLatin/First1KGreek/blob/master/data/tlg0537/tlg014/tlg0537.tlg014.1st1K-grc1.xml", overeno: 2026-10-01, poznamka: "VS 23 přátelství (rukopis ἀρετή, vydavatel αἱρετή); VS 25 chudoba a bohatství; VS 33 hlas těla (jméno Dia doplněk); VS 52 přátelství tančí kolem světa; VS 68 komu je málo, co stačí. 8. 10. 2026 (celek 6): VS 14 rodíme se jednou a život se promarní odkládáním; VS 31 kvůli smrti bydlíme ve městě bez hradeb; VS 38 malý je, kdo má mnoho důvodů odejít ze života (do studentského textu ne); VS 55 neštěstí léčit vděčností za to, co bylo; VS 66 soucit s přáteli péčí, ne nářkem." }
  - { id: seneca-epistulae, druh: pramen, nazev: "Dopisy Luciliovi 18 a 21", autor: Seneca, dilo: "Epistulae morales, lat. R. M. Gummere (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1017/phi015/phi1017.phi015.perseus-lat2.xml", overeno: 2026-10-01, poznamka: "Epikúros měl dny skrovného jídla, méně než as, Metrodóros celý (18, 9, podle dopisu Polyainovi z roku archonta Charína); nápis na zahradách, správce, polenta a voda (21, 10; rukopisy se v místě nápisu rozcházejí); žaludek je skromný věřitel (21, 11)." }
  - { id: seneca-vita-beata, druh: pramen, nazev: "O blaženém životě", autor: Seneca, dilo: "De vita beata (The Latin Library)", url: "https://www.thelatinlibrary.com/sen/sen.vita.shtml", overeno: 2026-10-01, poznamka: "Blažený život je v souladu s přírodou, dary štěstěny užívá, neslouží jim (3, 3); Epikúrova slast je střízlivá, škola má neprávem špatnou pověst (12, 4 – 13, 2); výčitka pokrytectví (17, 1–2); moudrý bohatství neodmítá (23, 3), bohatství není dobro, ale je užitečné (24, 5); u moudrého slouží, u hlupáka vládne (26, 1)." }
  - { id: tacitus-annales, druh: pramen, nazev: "Letopisy XIII, 42 a XIV, 53–54", autor: Tacitus, dilo: "Annales, lat. C. D. Fisher (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1351/phi005/phi1351.phi005.perseus-lat1.xml", overeno: 2026-10-01, poznamka: "Suillius vyčítá Senekovi 300 milionů sesterciů za čtyři roky u dvora (XIII, 42); Seneca prosí Nerona, ať si majetek vezme zpět (XIV, 53–54, stylizovaná řeč)." }
  - { id: cicero-nd-i-93, druh: pramen, nazev: "O povaze bohů I, 93", autor: Cicero, dilo: "De natura deorum, lat. O. Plasberg (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi050/phi0474.phi050.perseus-lat2.xml", overeno: 2026-10-01, poznamka: "Akademik Cotta posměšně: i Leontion se odvážila psát proti Theofrastovi, sice vytříbenou attičtinou." }
  - { id: dl-vi-20, druh: pramen, nazev: "Životy filozofů VI, 20–38", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Sinópé, otec směnárník Hikesios, aféra s mincemi ve více verzích, věštba (20–21); Antisthenés (21); myš (22); pithos v Métróu, horký písek a zasněžené sochy (23); prodej Xeniadovi podle Menippa (29–31); Alexandr: kdybych nebyl Alexandrem (32); dítě, pohárek a miska (37); nestíněj mi, osudu odvahu, zvyku přírodu (38). 3. 10. 2026 (celek 4): Platónovy přednášky nazýval ztrátou času (24); olivy ze Syrákús a Platónovy koberce (25–26)." }
  - { id: dl-vi-41, druh: pramen, nazev: "Životy filozofů VI, 40–63", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Platónova definice člověka, oškubaný kohout přinesený do školy, „tohle je Platónův člověk“, k definici přidáno „s plochými nehty“ (40); lampa za dne, hledám člověka (41); snadný život skrytý za medovými koláčky (44); vyhnanství ho udělalo filozofem, prosí sochu o almužnu (49); Sókratés, který se zbláznil (54); jí na agoře (58); jsem Diogenés, pes (60); připraven na každý osud, občan světa (63)." }
  - { id: dl-vi-69, druh: pramen, nazev: "Životy filozofů VI, 69–75", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-01, poznamka: "Otevřená řeč, vše veřejně (69); cvičení těla i duše, pohrdání slastí je nejslastnější, zvyk proti přírodě, Héraklés a svoboda (70–71; podle Hickse vložka z jiného pramene); piráti, Kréta, Xeniadés, Korinth (74); odmítne výkupné (75)." }
