    preklad:
      druh: vlastni
      podle: "řecká věta z řecké Wikisource a anglický překlad E. M. Edghilla („if these last did not exist, it would be impossible for anything else to exist“); první podstata je tento člověk, tento kůň (2a11–14); Bekkerovo číslování neověřeno ve vydání"
    zdroj: aristoteles-kategorie
  - id: meteorologika-iii-4
    osoba: aristoteles
    autor: Aristotelés
    dilo: Meteorologika
    misto: III, 4
    cesky: "Je tedy zřejmé, že duha je odraz pohledu ke slunci. Proto také vždycky vzniká naproti němu."
    original: "Ὅτι μὲν οὖν ἀνάκλασις ἡ ἶρις τῆς ὄψεως πρὸς τὸν ἥλιόν ἐστι, φανερόν· διὸ καὶ ἐξ ἐναντίας ἀεὶ γίνεται"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bekker, vydání 1837) a anglický překlad E. W. Webstera („the rainbow is a reflection of sight to the sun“); Bekkerovo číslování v otevřeném vydání není, proto jen kniha a kapitola"
    zdroj: aristoteles-meteorologika
  - id: politika-1261b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Politika
    misto: II, 3, 1261b33–34
    cesky: "O to, co je společné největšímu počtu lidí, se pečuje nejméně."
    original: "ἥκιστα γὰρ ἐπιμελείας τυγχάνει τὸ πλείστων κοινόν"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Rackhama"
    zdroj: aristoteles-politika-ii
  - id: parmenides-b8
    osoba: parmenides
    autor: Parmenidés
    dilo: O přírodě
    misto: zlomek B8, 9–10
    cesky: "A kdyby to začalo z ničeho, co by to přimělo vzniknout později, a ne dřív?"
    original: "τί δʼ ἄν μιν καὶ χρέος ὦρσεν ὕστερον ἢ πρόσθεν, τοῦ μηδενὸς ἀρξάμενον, φῦν;"
    preklad:
      druh: vlastni
      podle: "řecký text (Diels–Kranz 28 B8, dochováno u Simplikia) a anglický překlad J. Burneta („if it came from nothing, what need could have made it arise later rather than sooner?“); v básni mluví bohyně"
    zdroj: parmenides-b8
  - id: dl-ix-72-demokritos
    osoba: demokritos
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: IX, 72
    cesky: "Chladné je podle zvyku, teplé je podle zvyku. Ve skutečnosti jsou atomy a prázdno."
    original: "νόμῳ ψυχρόν, νόμῳ θερμόν, ἐτεῇ δὲ ἄτομα καὶ κενόν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; delší znění téhož výroku je zlomek DK 68 B9 (SEP „Democritus“)"
    zdroj: dl-ix-34
  - id: antidosis-271
    osoba: isokrates
    autor: Isokratés
    dilo: Antidosis
    misto: "271"
    cesky: "Lidé nemají v povaze dosáhnout vědění, se kterým bychom věděli, co dělat a co říkat. Za moudré proto pokládám ty, kdo svým míněním většinou trefí to nejlepší."
    original: "ἐπειδὴ γὰρ οὐκ ἔνεστιν ἐν τῇ φύσει τῇ τῶν ἀνθρώπων ἐπιστήμην λαβεῖν ἣν ἔχοντες ἂν εἰδεῖμεν ὅ τι πρακτέον ἢ λεκτέον ἐστίν, ἐκ τῶν λοιπῶν σοφοὺς μὲν νομίζω τοὺς ταῖς δόξαις ἐπιτυγχάνειν ὡς ἐπὶ τὸ πολὺ τοῦ βελτίστου δυναμένους"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad G. Norlina; zkráceno o druhou půli věty (kdo je filozof)"
    zdroj: isokrates-antidosis
  - id: helena-5
    osoba: isokrates
    autor: Isokratés
    dilo: Helena
    misto: "5"
    cesky: "Je mnohem lepší mít rozumné mínění o užitečných věcech než přesné vědění o neužitečných."
    original: "πολὺ κρεῖττόν ἐστι περὶ τῶν χρησίμων ἐπιεικῶς δοξάζειν ἢ περὶ τῶν ἀχρήστων ἀκριβῶς ἐπίστασθαι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad L. Van Hooka („likely conjecture about useful things is far preferable to exact knowledge of the useless“)"
    zdroj: isokrates-helena
  - id: kd-34
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 34 (Diogenés Laertios X, 151)
    cesky: "Nespravedlnost není zlo sama o sobě. Zlem je strach z podezření, že člověk neunikne těm, kdo mají takové věci trestat."
    original: "ἡ ἀδικία οὐ καθʼ ἑαυτὴν κακόν, ἀλλʼ ἐν τῷ κατὰ τὴν ὑποψίαν φόβῳ, εἰ μὴ λήσει τοὺς ὑπὲρ τῶν τοιούτων ἐφεστηκότας κολαστάς"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse"
    zdroj: dl-x-139

