  - { id: historia-augusta-marcus, druh: pramen, nazev: "Historia Augusta, Marcus Antoninus", dilo: "Scriptores Historiae Augustae, lat. D. Magie (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi2331/phi004/phi2331.phi004.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Pozdní sbírka životopisů, jen jako tradice. Narozen 26. dubna v Římě (1, 5); ve dvanácti filozofský plášť (2, 6); adopce a úlek (5, 1–6); povodeň Tibery (8, 4–5); mor a pohřby chudých (13, 3–6); dražba císařského majetku (17, 4–5; 21, 9); smrt syna Vera (21, 3–5); Cassius (24–26); smrt (28)." }
  - { id: aristoteles-etika-stesti, druh: pramen, nazev: "Etika Nikomachova I, 8–10; IV, 5; VII, 13", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Blaženost potřebuje i vnější dobra (1099a31–b8); šťastný není chameleon, velké rány blaženost tísní, ale prosvítá v nich krása, švec a kůže, Priamos (1100b4–1101a8); kdo se nezlobí, když má, je považován za hlupáka, snášet urážky je otrocké (1125b31–1126a8); člověk lámaný kolem šťastný není (1153b17–21)." }
  - { id: aristoteles-etika-iii, druh: pramen, nazev: "Etika Nikomachova III, 1 a 5", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Nedobrovolné je, co se děje z donucení nebo z nevědomosti; náklad hozený do moře za bouře (1109b30–1110a19); dobrovolné má počátek v člověku, který zná okolnosti (1111a22–24); co je na nás konat, je na nás i nekonat (1113b6–14); povahu si děláme svými činy, kámen (1114a3–21); jsme spolupůvodci svých vlastností (1114b22–23)." }
  - { id: cicero-de-fato-perseus, druh: pramen, nazev: "O osudu 22–31 a 39–43", autor: Cicero, dilo: "De fato, lat. C. F. W. Müller (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi054/phi0474.phi054.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Epikúrova odchylka atomů proti nutnosti osudu, Démokritos nutnost přijal (22–23); Karneadés: epikurejci odchylku nepotřebují, pohyb vůle nemá vnější příčinu (23–25); líný argument a Chrýsippova odpověď (28–30); Karneadův argument proti osudu (31); Chrýsippos jako rozhodčí (39); válec a káča (41–43)." }
  - { id: cicero-de-finibus, druh: pramen, nazev: "O nejvyšším dobru a zlu III, 22 a 50–51; IV, 20 a 72", autor: Cicero, dilo: "De finibus bonorum et malorum, lat. Th. Schiche (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi048/phi0474.phi048.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Stoik Cato: lučištník má udělat všechno, aby mířil přesně, zásah je „k vybrání, ne k usilování“ (III, 22); věci, kterým se dává přednost (III, 50–51); Cicero proti stoikům: se staršími se shodují věcí, liší se slovy (IV, 72)." }
  - { id: cicero-tusculanae, druh: pramen, nazev: "Tuskulské hovory V, 24–25", autor: Cicero, dilo: "Tusculanae disputationes, lat. M. Pohlenz (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi049/phi0474.phi049.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Theofrastos napadán všemi školami za větu „životu vládne štěstěna, ne moudrost“ a za to, že mučený podle něj nemůže být blažený." }
  - { id: lucretius-ii, druh: pramen, nazev: "O přírodě II, 216–293", autor: Lucretius, dilo: "De rerum natura, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0550/phi001/phi0550.phi001.perseus-lat1.xml", overeno: 2026-10-02, poznamka: "Atomy se v neurčitý čas a na neurčitém místě nepatrně odchylují (216–224); odchylka trhá „úmluvy osudu“, odtud svobodná vůle (251–293)." }
  - { id: iep-epictetus, druh: encyklopedie, nazev: "Epictetus", autor: "Keith H. Seddon", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/epictetu/", overeno: 2026-10-02, poznamka: "Narozen asi 55 v Hierapoli; u Musonia ještě jako otrok; vykázán „asi 89“; Arriános asi 86–160; Kelsos a Suda o noze." }
  - { id: iep-marcus, druh: encyklopedie, nazev: "Marcus Aurelius", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/marcus/", overeno: 2026-10-02, poznamka: "Adopce 138, císařem 161, sám od 169; Hovory jako osobní zápisník, nejspíš z tažení asi 171–175; Epiktétovy tři oblasti cvičení; pohled z hlediska kosmu (IX, 32)." }
  - { id: sep-freedom-ancient, druh: encyklopedie, nazev: "Ancient Theories of Freedom and Determinism", autor: "Tim O'Keefe", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/freedom-ancient/", overeno: 2026-10-02, poznamka: "Aristotelés tezi determinismu neformuluje; odchylka atomů v dochovaných Epikúrových textech není; stoikové spojují osud a odpovědnost (válec, spoluosudové věci); Karneadés kritizuje obě strany; podle M. Fredeho se pojem svobodné vůle poprvé objevuje u Epiktéta." }
  - { id: britannica-celsus, druh: encyklopedie, nazev: "Celsus", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Celsus", overeno: 2026-10-02, poznamka: "Pravdivé slovo napsal asi roku 178." }
  - { id: britannica-contra-celsum, druh: encyklopedie, nazev: "Contra Celsum", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/topic/Contra-Celsum", overeno: 2026-10-02, poznamka: "Órigenés psal nejspíš roku 248." }
  - { id: britannica-carnuntum, druh: encyklopedie, nazev: "Carnuntum", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/place/Carnuntum", overeno: 2026-10-02, poznamka: "U dnešní obce Petronell-Carnuntum, 32 km východně od Vídně, na Dunaji; Marcus tu psal druhou knihu Hovorů za tažení proti Markomanům (172–174)." }
  - { id: gross-1998, druh: monografie, nazev: "Antecedent- and response-focused emotion regulation: divergent consequences for experience, expression, and physiology", autor: "James J. Gross", dilo: "Journal of Personality and Social Psychology 74 (1998), 224–237", url: "https://pubmed.ncbi.nlm.nih.gov/9457784/", overeno: 2026-10-02, poznamka: "120 účastníků, film vyvolávající odpor; přehodnocení i potlačení snížily projevy, přehodnocení snížilo i prožívaný odpor, potlačení zvýšilo aktivaci sympatiku. Čten jen souhrn (PubMed); jméno autora nástroj nezobrazil, ověřit." }
  - { id: met-marcus-jezdec, druh: data, nazev: "Equestrian Statue of Marcus Aurelius (59.570.282)", autor: "Marco Dente", dilo: "The Metropolitan Museum of Art, New York", url: "https://www.metmuseum.org/art/collection/search/343595", overeno: 2026-10-02, poznamka: "Rytina, 1515–1527; nápis na podstavci: socha z bronzu stojí v Římě před Lateránem. Public Domain, Open Access CC0 (API muzea: isPublicDomain true)." }
  - { id: whe-epiktetos-1715, druh: data, nazev: "Epictetus (rytina z roku 1715)", dilo: "World History Encyclopedia", url: "https://www.worldhistory.org/image/3388/epictetus/", overeno: 2026-10-02, poznamka: "Úvodní list knihy Epicteti Enchiridion Latinis versibus adumbratum (E. Ivie, Oxford 1715; vydání doloženo katalogem Eton College, B13574). V desce podpis kreslíře („… delin.“) a rytce („MB. sculp.“), pod obrazem řecké dvojverší o otroku Epiktétovi. Stránka uvádí Public Domain (a omylem rok 1751)." }
  # Celek 4 „Je to, co vidím, celá skutečnost?“ (docs/podklady/celek-4-co-je-skutecne.md): řecké texty z PerseusDL, není-li uvedeno jinak.
  - { id: platon-ustava-perseus, druh: pramen, nazev: "Ústava II, IV–VII a X", autor: Platón, dilo: "Respublica, řecky J. Burnet, angl. P. Shorey (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg030/tlg0059.tlg030.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Mluví Sókratés, vypráví celý rozhovor; Glaukón a Adeimantos jsou Platónovi bratři. Glaukón obnovuje Thrasymachovu řeč a sám jí nevěří (357a–358d); původ spravedlnosti jako úmluva slabých (358e–359b); Gygův prsten: předek Lýda Gýga, pastýř, bronzový kůň, prsten, král (359c–360b), dva prsteny (360b–d), vyostření (360e–361d); cenzura básníků (377b–c, 398a); ušlechtilá lež a kovy (414b–415c); spravedlnost je dělat to své (433a–b); tři části duše a Leontios (439d–441a); spravedlnost jako pořádek v duši (441d–444a); strážkyně (451d–457b); společné ženy a děti strážců (457c–d, 461d); řízené sňatky, zmanipulované losy, děti horších skryjí na tajném místě (459c–460c); filozofové králi (473c–474a); dobro samo Sókratés říct odmítne (506b–e); slunce (507b–509c); úsečka, čtverec sám (509d–511e); jeskyně (514a–517a), výklad a „bůh ví, jestli je to pravda“ (517a–c), dvojí zakalení očí (518a–b), vzdělání jako otočení duše (518b–d), povinný návrat (519c–520e), vládnout mají ti, kdo o to nestojí (520d–521a); láska k Homérovi, muže nelze ctít víc než pravdu (595b–c); idea stolu a lehátka (596a–b); starý spor filozofie a básnictví (607b); Gýgův prsten (612b)." }
  - { id: platon-faidon-perseus, druh: pramen, nazev: "Faidón 59b, 74a–75b, 91b–c a 100b–e", autor: Platón, dilo: "Phaedo, řecky J. Burnet, angl. H. N. Fowler (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg004/tlg0059.tlg004.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Výčet přítomných v den popravy, „Platón, myslím, stonal“ (59b; mluví Faidón); stejné klacky a kameny a stejné samo (74a–75b); málo dbejte na Sókrata, mnohem víc na pravdu (91c); krásné věci jsou krásné krásou, nejbezpečnější odpověď (100b–e)." }
  - { id: platon-parmenides, druh: pramen, nazev: "Parmenidés 127a–135d", autor: Platón, dilo: "Parmenides, řecky J. Burnet, angl. H. N. Fowler (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg009/tlg0059.tlg009.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Rámec: Parmenidovi asi 65, Zénónovi asi 40, Sókratés velmi mladý (127a–c). Mladý Sókratés hájí ideje (128e–130a). Námitky: čeho jsou ideje, vlas, bláto, špína, „utíkám“ (130b–e); celek a část, den a plachta (131a–e); regres velikosti, tzv. třetí člověk (132a–b); ideje jako myšlenky (132b–c); vzory a podobnost (132d–133a); největší potíž, pán a otrok (133b–134e). Bez idejí zanikne možnost rozhovoru (135b–c); Sókratés začal definovat příliš brzy (135c–d)." }
  - { id: platon-sedmy-list, druh: pramen, nazev: "Sedmý list (pravost sporná)", autor: "dochováno pod Platónovým jménem", dilo: "Epistulae VII, řecky J. Burnet, angl. R. G. Bury (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg036/tlg0059.tlg036.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "První příchod do Syrákús „asi ve čtyřiceti“ (324a); mládí, vláda Třiceti, příbuzní zvou do vlády, Sókratés odmítne zatknout občana, Sókratova smrt, filozofové a vládci (324b–326b); Itálie a Sicílie, Dión (326b–327b); druhá cesta, „abych si nepřipadal jako pouhé slovo“, Dión vyhnán asi po třech měsících, „prosby tyranů jsou smíšené s nutností“ (327c–329e); třetí cesta, triéra, dopisy od Archyty (338a–339e); žádný spis o těchto věcech, kruh (341b–342c); mezi žoldnéři, Archytova loď, Lamiskos, Olympie (349e–350e). O prodeji do otroctví list mlčí. Pravost: viz podkladový list." }
  - { id: platon-timaios, druh: pramen, nazev: "Tímaios 51b–52a", autor: Platón, dilo: "Timaeus, řecky J. Burnet, angl. R. G. Bury (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg031/tlg0059.tlg031.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Mluví Tímaios. Jsou-li rozum a pravdivé mínění dvojí, ideje jsou; jedno vzniká poučením, druhé přemlouváním, jedno se přemluvit nedá, druhé ano (51d–e)." }
  - { id: platon-sofistes, druh: pramen, nazev: "Sofistés 245e–247c", autor: Platón, dilo: "Sophista, řecky J. Burnet, angl. H. N. Fowler (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg007/tlg0059.tlg007.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Mluví host z Eleje s Theaitétem. Boj obrů o to, co je: jedni uznávají jen to, čeho se dá dotknout, druzí hájí netělesné ideje (246a–c). Koho míní, neříká." }
  - { id: dl-iii, druh: pramen, nazev: "Životy filozofů III, 1–9, 18–26 a 35–47", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Platón: rod, Kritiás a Charmidés (1); narození podle Apollodóra, smrt na svatbě podle Hermippa (2); věk podle Neantha, Aigína podle Favorina (3); bratři, zápas u Aristóna z Argu, jméno Aristoklés podle Alexandra, Isthmické hry podle Dikaiarcha (4); básně, labuť, spálené tragédie (5); od dvaceti u Sókrata, Megara podle Hermodóra, Kyréné, Itálie, Egypt (6); Akadémie (7); tři cesty na Sicílii, prodej na Aigíně, Annikeris, dvě verze (18–21); Archytův dopis (21–22); „co toho ten mladík o mně nalhal“ (35); jmenuje se jen ve Faidónu a v Obraně, Aristotelés jediný doposlouchal Faidóna, Zákony na voskových tabulkách (37); smrt, vši podle Myroniana (40); hrob v Akademii, závěť (41–43); náhrobní nápisy (43–45); žáci, dvě ženy (46)." }
  - { id: dl-ix-34, druh: pramen, nazev: "Životy filozofů IX, 34–36, 40, 43–45 a 72", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Démokritos: Abdéra, Leukippos (34); Platón ho nikde nejmenuje, podle Aristoxena chtěl jeho spisy spálit (40); počátky jsou atomy a prázdno, vše ostatní se jen má za jsoucí, nic nevzniká z ničeho (44); vlastnosti podle zvyku, podle přírody atomy a prázdno (45); „podle zvyku chladné, podle zvyku teplé, ve skutečnosti atomy a prázdno“ (72)." }
  - { id: aristoteles-metafyzika-ideje, druh: pramen, nazev: "Metafyzika I, 1; I, 6; I, 9; XIII, 4 a 9", autor: Aristotelés, dilo: "Metaphysica, řecky W. D. Ross, angl. H. Tredennick (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg025/tlg0086.tlg025.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Všichni lidé touží vědět, láska ke smyslům (980a21–27). Platón, Kratylos a Hérakleitos, Sókratovy definice, ideje (987a29–b10). Kritika idejí: zdvojení, „dokazujeme“ v první osobě (990a34–b11), třetí člověk (990b17), k čemu ideje věcem jsou, vzory jako básnické metafory (991a8–22), podstata neoddělená od věci (991b1–3). Sókratés obecné neodděloval, oni je oddělili a nazvali idejemi (1078b12–32). Bez obecného není vědění, potíže působí oddělení (1086b2–7)." }
  - { id: aristoteles-etika-i-6, druh: pramen, nazev: "Etika Nikomachova I, 6", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Ideje zavedli přátelé; obojí je milé, ale svatou povinností je dát přednost pravdě (1096a11–17; Platóna nejmenuje). Dobro se říká mnoha způsoby (1096a17–b29). Dobro samo by člověk nemohl uskutečnit (1096b32–35). Tkadlec, tesař a lékař: léčí se tento člověk (1097a8–13)." }
  - { id: aristoteles-politika-ii, druh: pramen, nazev: "Politika II, 1 a 3", autor: Aristotelés, dilo: "Politica, řecky W. D. Ross, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg035/tlg0086.tlg035.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "„V Platónově Ústavě; tam totiž Sókratés říká…“ (1261a6). O společné se pečuje nejméně; každý by měl tisíc synů (1261b32–40)." }
  - { id: aristoteles-kategorie, druh: pramen, nazev: "Kategorie 5", autor: Aristotelés, dilo: "Categoriae, angl. E. M. Edghill (MIT Internet Classics Archive); řecká věta z řecké Wikisource", url: "http://classics.mit.edu/Aristotle/categories.1.1.html", overeno: 2026-10-03, poznamka: "První podstata je to, co se nevypovídá o podmětu ani není v podmětu: tento člověk, tento kůň; kdyby nebylo prvních podstat, nemohlo by být nic jiného. V PerseusDL dílo není; Bekkerovo číslování (2a11–14, 2b5–6) jsem v otevřeném vydání neviděl." }
  - { id: aristoteles-meteorologika, druh: pramen, nazev: "Meteorologika III, 2 a 4", autor: Aristotelés, dilo: "Meteorologica, řecky I. Bekker (vydání 1837, First1KGreek), angl. E. W. Webster (MIT Internet Classics Archive)", url: "https://classics.mit.edu/Aristotle/meteorology.3.iii.html", overeno: 2026-10-04, poznamka: "Duha je odraz pohledu ke slunci, proto vzniká vždy naproti němu (III, 4). Drobné kapky jsou zrcadla, ve kterých se neukáže tvar, jen barva; duha netvoří celý kruh ani víc než půlkruh; měsíční duhu potkali za víc než padesát let jen dvakrát (III, 2). Duha vzniká i od vesel zvednutých z moře a když někdo proti slunci rozstříkne jemné kapky (III, 4). Aristotelés nechává pohled vycházet z oka; dnešní výklad je lom a odraz světla v kapkách (britannica-rainbow). Anglicky čteny kapitoly 2 a 4, řecky jen uvedené věty; Bekkerovo číslování v otevřeném vydání není." }
  - { id: britannica-rainbow, druh: encyklopedie, nazev: "Rainbow", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/science/rainbow-atmospheric-phenomenon", overeno: 2026-10-04, poznamka: "Duha vzniká lomem a vnitřním odrazem světla v kapkách; je vidět naproti Slunci; nejjasnější paprsky tvoří kužel s vrcholem v oku pozorovatele a poloměrem asi 42°. Že každý pozorovatel vidí duhu jinde a že se k ní nedá dojít, z toho plyne; výslovně to článek neříká." }
  - { id: plutarchos-dion, druh: pramen, nazev: "Dión 5 a 20", autor: Plútarchos, dilo: "Dion, řecky a angl. B. Perrin (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0007/tlg060/tlg0007.tlg060.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Platón a Dionýsios starší, Pollis, prodej na Aigíně („říká se“; kap. 5). Archytova loď; Platónova odpověď při loučení; Plútarchos dodává, že Platónova vlastní slova s tím docela nesouhlasí (kap. 20)." }
  - { id: isokrates-antidosis, druh: pramen, nazev: "Antidosis 261–271", autor: Isokratés, dilo: "Antidosis, řecky a angl. G. Norlin (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0010/tlg019/tlg0010.tlg019.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Učitelé sporů, astronomie a geometrie žákům prospívají méně, než slibují; je to cvičení mysli, ne filozofie (261–266); staří sofisté a jejich spekulace (268–269); lidé nemají v povaze dosáhnout vědění, moudrý je, kdo míněním většinou trefí nejlepší (271). Platóna ani Akademii nejmenuje." }
  - { id: isokrates-helena, druh: pramen, nazev: "Helena 1 a 5", autor: Isokratés, dilo: "Helena, řecky a angl. L. Van Hook (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0010/tlg009/tlg0010.tlg009.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Někteří tvrdí, že odvaha, moudrost a spravedlnost jsou totéž vědění (1); lepší rozumné mínění o užitečném než přesné vědění o neužitečném (5). Nikoho nejmenuje." }
  - { id: herodotos-i-8, druh: pramen, nazev: "Dějiny I, 8–12", autor: Hérodotos, dilo: "Historiae, angl. A. D. Godley (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0016/tlg001/tlg0016.tlg001.perseus-eng2.xml", overeno: 2026-10-03, poznamka: "Jiný příběh o Gýgovi, bez prstenu: Kandaulés, královna, vražda krále." }
  - { id: cicero-de-senectute, druh: pramen, nazev: "O stáří 13", autor: Cicero, dilo: "Cato Maior de senectute, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi051/phi0474.phi051.perseus-lat2.xml", overeno: 2026-10-03, poznamka: "Platón zemřel v jedenaosmdesátém roce při psaní („uno et octogesimo anno scribens est mortuus“)." }
  - { id: parmenides-b8, druh: pramen, nazev: "Zlomek B8 (DK 28 B8), verše 1–10 a 38–41", autor: Parmenidés, dilo: "O přírodě, dochováno u Simplikia; řecký text a angl. překlad J. Burneta (lexundria.com)", url: "https://lexundria.com/parm_frag/8/grk", overeno: 2026-10-03, poznamka: "Co je, je nezrozené a nezanikající, celé, nehybné a bez konce (3–4); nebylo ani nebude, je teď celé najednou (5–6); z nejsoucího vzniknout nemohlo, proč později, a ne dřív (7–10); vznik, zánik a změna jsou jména smrtelníků (38–41, podle Burnetova překladu)." }
  - { id: iep-plato, druh: encyklopedie, nazev: "Plato", autor: "Thomas Brickhouse, Nicholas D. Smith", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/plato/", overeno: 2026-10-03, poznamka: "Narozen 428/427, zemřel 348/347 v osmdesáti nebo jedenaosmdesáti; rodiče Aristón a Periktioné, starší bratři Glaukón a Adeimantos, sestra Pótóné, nevlastní otec Pyrilampés; strýc Charmidés mezi Třiceti; jméno Aristoklés „zřejmě“; první cesta na Sicílii asi ve čtyřiceti, Dión; další dvě cesty za Dionýsiem II.; Akademie; pohřben v Akademii." }
  - { id: iep-academy, druh: encyklopedie, nazev: "Plato: The Academy", autor: "Lewis Trelawny-Cassity", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/plato-academy/", overeno: 2026-10-03, poznamka: "Založení se klade mezi roky 387 a 383; Platón se tam s druhými scházel už koncem 90. let; háj za hradbami; dvě žačky (Lastheneia, Axiothea); Aristotelés 367–347; Speusippos scholarchou do 339; Platón pohřben v Akademii. Nápis o geometrii neuvádí." }
  - { id: nails-plato, druh: monografie, nazev: "The Life of Plato of Athens", autor: "Debra Nails", dilo: "A Companion to Plato (Blackwell 2006), kap. 1; ukázka nakladatele", url: "https://catalogimages.wiley.com/images/db/pdf/9781405191111.excerpt.pdf", overeno: 2026-10-03, poznamka: "Narození klade do roku 424/423, tradiční datum má za konstrukci; Kritiás a Charmidés padli 403; Megara asi v osmadvaceti; první cesta „skoro ve čtyřiceti“, Archytás, Dión; prodej do otroctví jen „v Diogenově podání“; Akademie založena po návratu ze Sicílie roku 383, bez školného; Aristotelés 367; druhá cesta 366, třetí 361; Dión 357–354; smrt 347, hrob v Akademii; Sedmý list: i odpůrci pravosti uznávají autora blízkého Platónovi. O jménu Aristoklés a o nápisu mlčí." }
  - { id: sep-plato-parmenides, druh: encyklopedie, nazev: "Plato's Parmenides", autor: "Samuel Rickless", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/plato-parmenides/", overeno: 2026-10-03, poznamka: "Rev. 13. 3. 2026. Setkání je skoro jistě smyšlené; šest námitek proti idejím (130a–134e); 135b–c; badatelé se neshodnou, zda je Platón pokládal za smrtelné." }
  - { id: sep-plato-metaphysics, druh: encyklopedie, nazev: "Plato's Middle Period Metaphysics and Epistemology", autor: "Allan Silverman", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/plato-metaphysics/", overeno: 2026-10-03, poznamka: "Důvody pro ideje (věci jsou F i ne-F; vědění potřebuje stálý předmět; jedno nad mnohým); čtyři úseky úsečky (eikasia, pistis, dianoia, nous); rozpomínání v Menónu a Faidónu." }
  - { id: denyer-2016, druh: monografie, nazev: "The Seventh Letter: A Discussion of Myles Burnyeat and Michael Frede, The Pseudo-Platonic Seventh Letter", autor: "Nicholas Denyer", dilo: "Oxford Studies in Ancient Philosophy (2016); abstrakt v repozitáři University of Cambridge", url: "https://www.repository.cam.ac.uk/items/3f260bf9-479b-4c58-9215-15ca34429a48", overeno: 2026-10-03, poznamka: "Burnyeat a Frede (2015): list je podvržený a jeho autor je Platónovi příliš vzdálený, než aby spolehlivě svědčil; Denyer závěr přijímá. Čten jen abstrakt." }
  - { id: guthrie-platon-jmeno, druh: monografie, nazev: "A History of Greek Philosophy IV: Plato, the Man and His Dialogues, Earlier Period (život)", autor: "W. K. C. Guthrie", dilo: "Cambridge University Press 1975; výňatek na ellopos.net", url: "https://www.ellopos.net/Elpenor/greek-texts/ancient-greece/guthrie-plato.asp?pg=26", overeno: 2026-10-03, poznamka: "Původní jméno Aristoklés po dědovi; Platón bylo běžné jméno, v Athénách 31 dokladů; odkaz na J. A. Notopoula (Classical Philology 1939). Čtena jen tato poznámka." }
  - { id: bohacek-2015, druh: monografie, nazev: "Přítel Aristotelés", autor: "Kryštof Boháček", dilo: "Aither 7 (2015), č. 13, s. 34–45", url: "https://aither.upol.cz/artkey/ath-201501-0004_pritel-aristoteles.php", overeno: 2026-10-03, poznamka: "Rčení Amicus Plato, sed magis amica veritas poprvé u Rogera Bacona (Opus maius I, 5), rozšířil Cervantes (Don Quijote II, 1615); předobrazy u Platóna (Faidón 91c, Ústava 595c); dějiny rčení: L. Tarán (1984). Cituje Křížův překlad Etiky Nikomachovy 1096a." }
  - { id: bmcr-hermippos, druh: monografie, nazev: "Recenze: J. Bollansée, Hermippos of Smyrna and his Biographical Writings (1999)", autor: "Daniel Gershenson", dilo: "Bryn Mawr Classical Review 2000.07.28", url: "https://bmcr.brynmawr.edu/?p=21918", overeno: 2026-10-03, poznamka: "Hermippos působil v Alexandrii v 2. polovině 3. století př. n. l.; mnohé jeho životopisy jsou vymyšlené příběhy o smrtích slavných." }
  - { id: britannica-alexander-polyhistor, druh: encyklopedie, nazev: "Alexander Polyhistor", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Alexander-Polyhistor", overeno: 2026-10-03, poznamka: "Asi 105–35 př. n. l." }
  - { id: britannica-dicaearchus, druh: encyklopedie, nazev: "Dicaearchus", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Dicaearchus", overeno: 2026-10-03, poznamka: "Činný kolem 320 př. n. l., Aristotelův žák." }
  - { id: britannica-diogenes-laertius, druh: encyklopedie, nazev: "Diogenes Laërtius", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Diogenes-Laertius", overeno: 2026-10-03, poznamka: "Činný ve 3. století n. l.; nejdůležitější dochovaný druhotný pramen, vedle cenných údajů i klepy." }
  - { id: smithsonian-papyrus-2024, druh: data, nazev: "This Newly Deciphered Papyrus Scroll Reveals the Location of Plato's Grave (novinová zpráva)", dilo: "Smithsonian Magazine, duben 2024", url: "https://www.smithsonianmag.com/smart-news/platos-elusive-grave-located-after-bionic-eye-penetrates-2000-year-old-papyrus-180984221/", overeno: 2026-10-03, poznamka: "Nově přečtené části Filodémových Dějin Akademie (G. Ranocchia, Univerzita v Pise, CNR): hrob v zahradě u svatyně Múz v Akademii; prodej do otroctví prý už roku 404 nebo 399. Jen zpráva, vydání textu jsem neviděl." }
  - { id: nyhan-2023, druh: monografie, nazev: "Like-minded sources on Facebook are prevalent but not polarizing", autor: "Brendan Nyhan a kol.", dilo: "Nature 620 (2023), 137–144", url: "https://www.nature.com/articles/s41586-023-06297-w", overeno: 2026-10-03, poznamka: "Čten plný text (otevřený přístup). Pokus 24. 9. – 23. 12. 2020 mezi 23 377 souhlasícími dospělými uživateli Facebooku v USA: podíl obsahu od stejně smýšlejících zdrojů snížen z 53,7 % na 36,2 %, obsah z opačné strany vzrostl z 20,7 % na 27,9 %; žádný měřitelný účinek na osm předem určených měřítek postojů. Prostřední uživatel: 50,4 % od stejně smýšlejících, 14,7 % z opačné strany; 20,6 % uživatelů má přes 75 %; občanský obsah a zprávy mediány 6,9 % a 6,7 %. Meze: tři měsíce, volby, jen USA a Facebook. Akademičtí autoři neplaceni, poslední slovo o analýze, předregistrace." }
  - { id: osome-eletter-2024, druh: data, nazev: "Science eLetter: Social media algorithms can curb misinformation, but do they? (shrnutí)", dilo: "Observatory on Social Media, Indiana University", url: "https://osome.iu.edu/research/blog/science-eletter-social-media-algorithms-can-curb-misinformation-but-do-they", overeno: 2026-10-03, poznamka: "Výhrada k sesterské studii (Guess a kol., Science 2023): Meta od listopadu 2020 do března 2021 dočasně zpřísnila algoritmus, pokus běžel v té době. Čteno jen shrnutí autorské skupiny." }
  - { id: nga-saenredam-jeskyne, druh: data, nazev: "Plato's Cave (1983.61.1)", autor: "Jan Saenredam podle Cornelise Cornelisze van Haarlem", dilo: "National Gallery of Art, Washington", url: "https://www.nga.gov/artworks/62542-platos-cave", overeno: 2026-10-03, poznamka: "Mědirytina, 1604, vydal Hendrik Hondius; list 33,7 × 45 cm; Ailsa Mellon Bruce Fund. Muzeum: „free and in the public domain“. Nápis nahoře: Jan 3, 19 a ANTRUM PLATONICUM. Dole dvanáct latinských veršů, signatury „C. C. Harlemensis Inv.“, „Saenredam Sculpsit“, „Henr. Hondius excudit“, „1604“ a věnování: rytinu dal nakreslit a vyrýt H. L. Spiegel a věnoval ji Pieteru Paawovi, profesoru lékařství v Leidenu (čteno z listu 4. 10. 2026). Soubor stažen 4. 10. 2026 přes IIIF muzea (1280 × 959 px)." }
  - { id: smk-platon-odlitek, druh: data, nazev: "Platon (427–347 f.Kr.), græsk filosof (KAS2111)", dilo: "Statens Museum for Kunst, Den Kongelige Afstøbningssamling, Kodaň", url: "https://open.smk.dk/artwork/image/KAS2111", overeno: 2026-10-03, poznamka: "Sádrový odlitek mramorové hlavy z Ny Carlsberg Glyptotek, římské kopie řeckého originálu z doby kolem 350 př. n. l.; do sbírky získán 1947 (rok výroby odlitku muzeum neuvádí); výška 49 cm; Public Domain. Údaje z API muzea. Soubor stažen 4. 10. 2026 přes IIIF muzea (1280 × 1280 px); snímek má černé pozadí." }

citaty:
  - id: obrana-38a
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 38a
    cesky: "Život, který nezkoumáme, nestojí za to, aby ho člověk žil."
    original: "ὁ δὲ ἀνεξέταστος βίος οὐ βιωτὸς ἀνθρώπῳ"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad B. Jowetta („the unexamined life is not worth living“)"
    zdroj: platon-obrana
  - id: obrana-21d
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 21d
    cesky: "Tenhle člověk si myslí, že něco ví, a neví. Já nevím, ale ani si nemyslím, že vím."
    original: "οὗτος μὲν οἴεταί τι εἰδέναι οὐκ εἰδώς, ἐγὼ δέ, ὥσπερ οὖν οὐκ οἶδα, οὐδὲ οἴομαι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad B. Jowetta („he knows nothing, and thinks that he knows; I neither know nor think that I know“)"
    zdroj: platon-obrana

  - id: dl-vi-53-diogenes
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 53
    cesky: "Stůl a pohár vidím, Platóne. Stolovost a pohárovost ale nikde."
    original: "τράπεζαν μὲν καὶ κύαθον ὁρῶ· τραπεζότητα δὲ καὶ κυαθότητα οὐδαμῶς"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („Table and cup I see; but your tablehood and cuphood, Plato, I can nowise see“)"
    zdroj: dl-vi-53
  - id: dl-vi-53-platon
    osoba: platon
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 53
    cesky: "Oči, kterými se vidí stůl a pohár, máš. Rozum, kterým se vidí stolovost a pohárovost, nemáš."
    original: "οἷς μὲν γὰρ κύαθος καὶ τράπεζα θεωρεῖται, ὀφθαλμοὺς ἔχεις· ᾧ δὲ τραπεζότης καὶ κυαθότης βλέπεται, νοῦν οὐκ ἔχεις"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („you have the eyes to see the visible table and cup; but not the understanding by which ideal tablehood and cuphood are discerned“)"
    zdroj: dl-vi-53

  # Celek 1 „Jak poznám, co je pravda?“ (docs/podklady/celek-1-pravda.md). Převody jsou vlastní z řeckého textu.
  - id: obrana-36a
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 36a
    cesky: "Kdyby jen třicet hlasů padlo opačně, byl bych osvobozen."
    original: "εἰ τριάκοντα μόναι μετέπεσον τῶν ψήφων, ἀπεπεφεύγη ἄν"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera („if only thirty votes had been cast the other way, I should have been acquitted“)"
    zdroj: platon-obrana
  - id: obrana-36d
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 36d–e
    cesky: "On vám dává pocit, že jste šťastní. Já vás šťastnými dělám."
    original: "ὁ μὲν γὰρ ὑμᾶς ποιεῖ εὐδαίμονας δοκεῖν εἶναι, ἐγὼ δὲ εἶναι"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera („he makes you seem to be happy, whereas I make you happy in reality“); „on“ je vítěz z Olympie"
    zdroj: platon-obrana
  - id: kriton-49c
    osoba: sokrates
    autor: Platón
    dilo: Kritón
    misto: 49c
    cesky: "Nesmíme oplácet křivdu křivdou ani nikomu ubližovat, ať nám udělal cokoli."
    original: "οὔτε ἄρα ἀνταδικεῖν δεῖ οὔτε κακῶς ποιεῖν οὐδένα ἀνθρώπων, οὐδʼ ἂν ὁτιοῦν πάσχῃ ὑπʼ αὐτῶν"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera („we ought neither to requite wrong with wrong nor to do evil to anyone, no matter what he may have done to us“)"
    zdroj: platon-kriton
  - id: faidon-118a
    osoba: sokrates
    autor: Platón
    dilo: Faidón
    misto: 118a
    cesky: "Kritóne, dlužíme Asklépiovi kohouta. Splaťte ho, nezapomeňte."
    original: "ὦ Κρίτων, τῷ Ἀσκληπιῷ ὀφείλομεν ἀλεκτρυόνα· ἀλλὰ ἀπόδοτε καὶ μὴ ἀμελήσητε"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera („Crito, we owe a cock to Aesculapius. Pay it and do not neglect it“)"
    zdroj: platon-faidon
  - id: theaitetos-152a
    osoba: protagoras
    autor: Platón
    dilo: Theaitétos
    misto: 152a (DK 80 B1)
    cesky: "Člověk je měřítkem všech věcí: těch, které jsou, že jsou, a těch, které nejsou, že nejsou."
    original: "πάντων χρημάτων μέτρον ἄνθρωπον εἶναι, τῶν μὲν ὄντων ὡς ἔστι, τῶν δὲ μὴ ὄντων ὡς οὐκ ἔστιν"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; totéž znění u Diogena Laertia IX, 51"
    zdroj: platon-theaitetos
  - id: dl-ix-51
    osoba: protagoras
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: IX, 51 (DK 80 B4)
    cesky: "O bozích nemohu vědět, ani že jsou, ani že nejsou. Mnoho věcí tomu brání: nejasnost té věci i krátkost lidského života."
    original: "περὶ μὲν θεῶν οὐκ ἔχω εἰδέναι οὔθʼ ὡς εἰσίν, οὔθʼ ὡς οὐκ εἰσίν· πολλὰ γὰρ τὰ κωλύοντα εἰδέναι, ἥ τʼ ἀδηλότης καὶ βραχὺς ὢν ὁ βίος τοῦ ἀνθρώπου"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; delší znění u Eusebia („ani jakou mají podobu“) v atlasu nepoužito"
    zdroj: dl-ix-50
  - id: dl-ix-22-parmenides
    osoba: parmenides
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: IX, 22 (DK 28 B7, 3–5)
    cesky: "Ať tě zvyk nenutí jít touto cestou a řídit se slepým okem, hučícím uchem a jazykem. Rozhodni rozumem."
    original: "μηδέ σʼ ἔθος πολύπειρον ὁδὸν κατὰ τήνδε βιάσθω νωμᾶν ἄσκοπον ὄμμα καὶ ἠχήεσσαν ἀκουὴν καὶ γλῶσσαν, κρῖναι δὲ λόγῳ πολύδηριν ἔλεγχον"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; zkráceno (vynecháno „zkušený v mnohém“ a „spornou zkoušku“)"
    zdroj: dl-ix-22
  - id: metafyzika-1011b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Metafyzika
    misto: IV, 7, 1011b26–27
    cesky: "Říct o tom, co je, že není, nebo o tom, co není, že je, je nepravda. Říct o tom, co je, že je, a o tom, co není, že není, je pravda."
    original: "τὸ μὲν γὰρ λέγειν τὸ ὂν μὴ εἶναι ἢ τὸ μὴ ὂν εἶναι ψεῦδος, τὸ δὲ τὸ ὂν εἶναι καὶ τὸ μὴ ὂν μὴ εἶναι ἀληθές"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Tredennicka"
    zdroj: aristoteles-metafyzika
  - id: menon-98a
    osoba: sokrates
    autor: Platón
    dilo: Menón
    misto: 98a
    cesky: "Pravdivé názory nemají velkou cenu, dokud je člověk nepřiváže úvahou o důvodu. Pak se stanou věděním."
    original: "οὐ πολλοῦ ἄξιαί εἰσιν, ἕως ἄν τις αὐτὰς δήσῃ αἰτίας λογισμῷ … ἐπειδὰν δὲ δεθῶσιν, πρῶτον μὲν ἐπιστῆμαι γίγνονται"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad W. R. M. Lamba; zkráceno"
    zdroj: platon-menon

  # Celek 2 „Jak mám žít?“ (docs/podklady/celek-2-jak-zit.md). Převody jsou vlastní z řeckého a latinského textu.
  - id: dl-x-11-syr
    osoba: epikuros
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: X, 11
    cesky: "Pošli mi hrnek sýra, ať si můžu dopřát hostinu, kdykoli budu chtít."
    original: "πέμψον μοι τυροῦ κυθριδίου, ἵνʼ ὅταν βούλωμαι πολυτελεύσασθαι δύνωμαι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („Send me a little pot of cheese, that, when I like, I may fare sumptuously“); úryvek z Epikúrova dopisu"
    zdroj: dl-x-1
  - id: menoikeus-130
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 130 (Diogenés Laertios X, 130)
    cesky: "Soběstačnost je velké dobro. Ne proto, abychom vždycky žili s málem, ale abychom si s málem vystačili, když víc nemáme. Přepych si nejvíc užijí ti, kdo ho nejméně potřebují."
    original: "τὴν αὐτάρκειαν δὲ ἀγαθὸν μέγα νομίζομεν, οὐχ ἵνα πάντως τοῖς ὀλίγοις χρώμεθα, ἀλλʼ ὅπως ἐὰν μὴ ἔχωμεν τὰ πολλά, τοῖς ὀλίγοις ἀρκώμεθα, πεπεισμένοι γνησίως ὅτι ἥδιστα πολυτελείας ἀπολαύουσιν οἱ ἥκιστα ταύτης δεόμενοι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; rozděleno do tří vět, vynecháno „upřímně přesvědčeni“"
    zdroj: dl-x-122
  - id: menoikeus-131-maza
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 131 (Diogenés Laertios X, 131)
    cesky: "Ječná placka a voda dají tu nejvyšší slast, když je jí ten, kdo je potřebuje."
    original: "μᾶζα καὶ ὕδωρ τὴν ἀκροτάτην ἀποδίδωσιν ἡδονήν, ἐπειδὰν ἐνδέων τις αὐτὰ προσενέγκηται"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („bread and water“); μᾶζα je ječná placka, ne pšeničný chléb"
    zdroj: dl-x-122
  - id: menoikeus-131-slast
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 131 (Diogenés Laertios X, 131)
    cesky: "Když říkáme, že cílem je slast, nemyslíme slasti prostopášníků ani ty, které spočívají v požitku, jak si někteří myslí z nevědomosti, z nesouhlasu nebo ze zlé vůle. Myslíme tím nemít bolest v těle a zmatek v duši."
    original: "ὅταν οὖν λέγωμεν ἡδονὴν τέλος ὑπάρχειν, οὐ τὰς τῶν ἀσώτων ἡδονὰς καὶ τὰς ἐν ἀπολαύσει κειμένας λέγομεν, ὥς τινες ἀγνοοῦντες καὶ οὐχ ὁμολογοῦντες ἢ κακῶς ἐκδεχόμενοι νομίζουσιν, ἀλλὰ τὸ μήτε ἀλγεῖν κατὰ σῶμα μήτε ταράττεσθαι κατὰ ψυχήν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse"
    zdroj: dl-x-122
  - id: menoikeus-132
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 132 (Diogenés Laertios X, 132)
    cesky: "Nedá se žít příjemně, aniž by člověk žil rozumně, čestně a spravedlivě. A nedá se žít rozumně, čestně a spravedlivě, aniž by žil příjemně."
    original: "οὐκ ἔστιν ἡδέως ζῆν ἄνευ τοῦ φρονίμως καὶ καλῶς καὶ δικαίως, οὐδὲ φρονίμως καὶ καλῶς καὶ δικαίως ἄνευ τοῦ ἡδέως"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; καλῶς = krásně, čestně; totéž říká Hlavní myšlenka 5"
    zdroj: dl-x-122
  - id: kd-15
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 15 (Diogenés Laertios X, 144)
    cesky: "Bohatství, které žádá příroda, má své meze a snadno se získá. Bohatství, které žádají prázdné představy, se ztrácí do nekonečna."
    original: "ὁ τῆς φύσεως πλοῦτος καὶ ὥρισται καὶ εὐπόριστός ἐστιν· ὁ δὲ τῶν κενῶν δοξῶν εἰς ἄπειρον ἐκπίπτει"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („Nature's wealth at once has its bounds and is easy to procure; but the wealth of vain fancies recedes to an infinite distance“)"
    zdroj: dl-x-139
  - id: kd-27
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 27 (Diogenés Laertios X, 148)
    cesky: "Ze všeho, co moudrost chystá pro šťastný celý život, je zdaleka nejdůležitější získat přátele."
    original: "ὧν ἡ σοφία παρασκευάζεται εἰς τὴν τοῦ ὅλου βίου μακαριότητα, πολὺ μέγιστόν ἐστιν ἡ τῆς φιλίας κτῆσις"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse"
    zdroj: dl-x-139
  - id: vs-52
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "52"
    cesky: "Přátelství tančí kolem celého světa a všem nám ohlašuje: probuďte se ke štěstí!"
    original: "ἡ φιλία περιχορεύει τὴν οἰκουμένην κηρύττουσα δὴ πᾶσιν ἡμῖν ἐγείρεσθαι ἐπὶ τὸν μακαρισμόν"
    preklad:
      druh: vlastni
      podle: "řecký text (P. von der Mühll) a anglický překlad v SEP „Epicurus“ („Friendship goes dancing round the world, announcing to all of us to wake up to happiness“)"
    zdroj: gnomologium-vaticanum
  - id: vs-33
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "33"
    cesky: "Tělo volá: nehladovět, nežíznit, nemrznout. Kdo to má a doufá, že to mít bude, mohl by se o štěstí přít i se samotným Diem."
    original: "σαρκὸς φωνὴ τὸ μὴ πεινῆν, τὸ μὴ διψῆν, τὸ μὴ ῥιγοῦν· ταῦτα γὰρ ἔχων τις καὶ ἐλπίζων ἕξειν κἂν 〈Διὶ〉 ὑπὲρ εὐδαιμονίας μαχέσαιτο"
    preklad:
      druh: vlastni
      podle: "řecký text (P. von der Mühll); jméno Dia je doplněk vydavatelů, rukopis má mezeru"
    zdroj: gnomologium-vaticanum
  - id: vs-68
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "68"
    cesky: "Komu je málo to, co stačí, tomu nestačí nic."
    original: "οὐδὲν ἱκανὸν ᾧ ὀλίγον τὸ ἱκανόν"
    preklad:
      druh: vlastni
      podle: "řecký text (P. von der Mühll); doslova „nic není dost tomu, komu je dost málo“"
    zdroj: gnomologium-vaticanum
  - id: dl-x-119
    osoba: epikuros
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: X, 119
    cesky: "Moudrý nebude žít jako kynik ani žebrat."
    original: "οὐδὲ κυνιεῖν, ὡς ἐν τῇ δευτέρᾳ Περὶ βίων· οὐδὲ πτωχεύσειν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („nor will he turn Cynic … nor will he be a mendicant“); nepřímá řeč podle 2. knihy Epikúrova spisu O způsobech života, zkráceno"
    zdroj: dl-x-117
  - id: seneca-ep-21-10
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 21, 10
    cesky: "Hoste, tady ti bude dobře, tady je nejvyšším dobrem slast."
    original: "Hospes, hic bene manebis, hic summum bonum voluptas est."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); nápis na Epikúrových zahradách, jak ho uvádí Seneca"
    zdroj: seneca-epistulae
  - id: seneca-ep-18-9
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 18, 9
    cesky: "Epikúros, ten učitel slasti, měl určité dny, kdy hlad jen skrovně tišil. Chtěl vidět, jestli mu něco chybí do plné a dokonalé slasti."
    original: "Certos habebat dies ille magister voluptatis Epicurus, quibus maligne famem extingueret, visurus, an aliquid deesset ex plena et consummata voluptate"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); zkráceno"
    zdroj: seneca-epistulae
  - id: vita-beata-13
    osoba: seneca
    autor: Seneca
    dilo: O blaženém životě
    misto: 13, 1
    cesky: "Myslím si, že Epikúros učí věci svaté a správné, a když se k nim přiblížíš, dokonce přísné."
    original: "in ea quidem ipse sententia sum … sancta Epicurum et recta praecipere et si propius accesseris tristia"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); tristia = vážné, přísné; vynecháno „řeknu to proti vůli našich“"
    zdroj: seneca-vita-beata
  - id: vita-beata-26
    osoba: seneca
    autor: Seneca
    dilo: O blaženém životě
    misto: 26, 1
    cesky: "U moudrého slouží bohatství jemu, u hlupáka bohatství vládne."
    original: "diuitiae enim apud sapientem uirum in seruitute sunt, apud stultum in imperio"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); doslova „u moudrého muže je bohatství v otroctví, u hlupáka u vlády“"
    zdroj: seneca-vita-beata
  - id: dl-vi-37
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 37
    cesky: "Dítě mě porazilo ve skromnosti."
    original: "παιδίον με νενίκηκεν εὐτελείᾳ"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („A child has beaten me in plainness of living“)"
    zdroj: dl-vi-20
  - id: dl-vi-44
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 44
    cesky: "Bohové dali lidem snadný život. Lidé ho ale nevidí, protože hledají medové koláčky, vonné masti a podobné věci."
    original: "τὸν τῶν ἀνθρώπων βίον ῥᾴδιον ὑπὸ τῶν θεῶν δεδόσθαι, ἀποκεκρύφθαι δʼ αὐτῶν ζητούντων μελίπηκτα καὶ μύρα καὶ τὰ παραπλήσια"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; v originále nepřímá řeč („často volal, že…“)"
    zdroj: dl-vi-41
  - id: dl-vi-104
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 104
    cesky: "Bohům je vlastní nic nepotřebovat. Těm, kdo se bohům podobají, potřebovat málo."
    original: "θεῶν μὲν ἴδιον εἶναι μηδενὸς δεῖσθαι, τῶν δὲ θεοῖς ὁμοίων τὸ ὀλίγων χρῄζειν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; v přehledu kynické nauky jako Diogenova slova, nepřímá řeč"
    zdroj: dl-vi-104
  - id: dl-vi-71
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 71
    cesky: "Samo pohrdání slastí je nejslastnější, když se v něm člověk vycvičí."
    original: "αὐτὴ τῆς ἡδονῆς ἡ καταφρόνησις ἡδυτάτη προμελετηθεῖσα"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; z oddílu VI, 70–73, který je podle Hickse vložkou z jiného pramene"
    zdroj: dl-vi-69
  - id: dl-vi-41
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 41
    cesky: "Hledám člověka."
    original: "ἄνθρωπον ζητῶ"
    preklad:
      druh: vlastni
      podle: "řecký text; za bílého dne s rozsvícenou lampou; „poctivého člověka“ v řečtině není"
    zdroj: dl-vi-41
  - id: dl-vi-63
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 63
    cesky: "Jsem občan světa."
    original: "κοσμοπολίτης"
    preklad:
      druh: vlastni
      podle: "řecký text; odpověď na otázku, odkud je, řecky jediné slovo"
    zdroj: dl-vi-41
  - id: plutarchos-alexandr-14
    osoba: diogenes
    autor: Plútarchos
    dilo: Alexandr
    misto: "14"
    cesky: "Ustup mi trochu ze slunce."
    original: "μικρὸν … ἀπὸ τοῦ ἡλίου μετάστηθι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad B. Perrin („stand a little out of my sun“); Diogenés Laertios VI, 38 má „nestíněj mi“"
    zdroj: plutarchos-alexandr
  - id: etika-1098a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: I, 7, 1098a18–20
    cesky: "Jedna vlaštovka jaro nedělá, ani jeden den. A tak ani jeden den nebo krátký čas neudělá člověka blaženým a šťastným."
    original: "μία γὰρ χελιδὼν ἔαρ οὐ ποιεῖ, οὐδὲ μία ἡμέρα· οὕτω δὲ οὐδὲ μακάριον καὶ εὐδαίμονα μία ἡμέρα οὐδʼ ὀλίγος χρόνος"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika
  - id: etika-1155a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VIII, 1, 1155a5–6
    cesky: "Bez přátel by nikdo nechtěl žít, i kdyby měl všechna ostatní dobra."
    original: "ἄνευ γὰρ φίλων οὐδεὶς ἕλοιτʼ ἂν ζῆν, ἔχων τὰ λοιπὰ ἀγαθὰ πάντα"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika
  - id: dl-vi-40
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 40
    cesky: "Tohle je Platónův člověk."
    original: "οὗτός ἐστιν ὁ Πλάτωνος ἄνθρωπος"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („Here is Plato's man“); Diogenés přinesl oškubaného kohouta do Platónovy školy"
    zdroj: dl-vi-41

