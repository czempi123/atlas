  - { id: dio-72, druh: pramen, nazev: "Římské dějiny 72", autor: Cassius Dio, dilo: "Roman History, angl. E. Cary (LacusCurtius)", url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cassius_Dio/72*.html", overeno: 2026-10-02, poznamka: "Cassiova vzpoura, hlava pohřbena, papíry zničeny nepřečtené (27–28); smrt 17. března (33); hodnocení vlády, „ze zlatého království do železného a rezavého“ (34–36). Kniha se dochovala ve výtahu; čteno jen anglicky." }
  - { id: hieronymus-kronika, druh: pramen, nazev: "Kronika, léta Domitianovy vlády", autor: Hieronymus, dilo: "Chronicon, angl. překlad (tertullian.org)", url: "https://www.tertullian.org/fathers/jerome_chronicle_03_part2.htm", overeno: 2026-10-02, poznamka: "K roku 95: Domitianus znovu vyhání ediktem filozofy a astrology z Říma." }
  - { id: suda-epiktetos, druh: pramen, nazev: "Suda, heslo Epiktétos (epsilon 2424)", dilo: "Suda On Line, angl. překlad", url: "https://www.cs.uky.edu/~raphael/sol/sol-html/", overeno: 2026-10-02, poznamka: "Otrok Epafrodita; ochrnul na nohu „z revmatu“; žil v Níkopoli; prý až do vlády Marca Antonina (vydavatelé hesla to mají za sporné)." }
  - { id: long-epictetus-1877, druh: monografie, nazev: "Epictetus (úvod k překladu)", autor: "George Long", dilo: "The Discourses of Epictetus; with the Encheiridion and Fragments (1877), Wikisource", url: "https://en.wikisource.org/wiki/The_Discourses_of_Epictetus;_with_the_Encheiridion_and_Fragments/Epictetus", overeno: 2026-10-02, poznamka: "Simplikios: Epiktétos byl slabého těla a chromý od mládí, neoženil se, ve stáří se ujal dítěte; Rozprav bylo osm knih, dochovaly se čtyři. Simplikia samotného jsem nečetl." }
  - { id: historia-augusta-marcus, druh: pramen, nazev: "Historia Augusta, Marcus Antoninus", dilo: "Scriptores Historiae Augustae, lat. D. Magie (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi2331/phi004/phi2331.phi004.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Pozdní sbírka životopisů, jen jako tradice. Narozen 26. dubna v Římě (1, 5); ve dvanácti filozofský plášť (2, 6); adopce a úlek (5, 1–6); povodeň Tibery (8, 4–5); mor a pohřby chudých (13, 3–6); dražba císařského majetku (17, 4–5; 21, 9); smrt syna Vera (21, 3–5); Cassius (24–26); smrt (28)." }
  - { id: aristoteles-etika-stesti, druh: pramen, nazev: "Etika Nikomachova I, 8–10; IV, 5; VII, 13", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Blaženost potřebuje i vnější dobra (1099a31–b8); šťastný není chameleon, velké rány blaženost tísní, ale prosvítá v nich krása, švec a kůže, Priamos (1100b4–1101a8); kdo se nezlobí, když má, je považován za hlupáka, snášet urážky je otrocké (1125b31–1126a8); člověk lámaný kolem šťastný není (1153b17–21)." }
  - { id: aristoteles-etika-iii, druh: pramen, nazev: "Etika Nikomachova III, 1 a 5", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Nedobrovolné je, co se děje z donucení nebo z nevědomosti; náklad hozený do moře za bouře (1109b30–1110a19); dobrovolné má počátek v člověku, který zná okolnosti (1111a22–24); co je na nás konat, je na nás i nekonat (1113b6–14); povahu si děláme svými činy, kámen (1114a3–21); jsme spolupůvodci svých vlastností (1114b22–23)." }
  - { id: cicero-de-fato-perseus, druh: pramen, nazev: "O osudu 22–31 a 39–43", autor: Cicero, dilo: "De fato, lat. C. F. W. Müller (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi054/phi0474.phi054.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Epikúrova odchylka atomů proti nutnosti osudu, Démokritos nutnost přijal (22–23); Karneadés: epikurejci odchylku nepotřebují, pohyb vůle nemá vnější příčinu (23–25); líný argument a Chrýsippova odpověď (28–30); Karneadův argument proti osudu (31); Chrýsippos jako rozhodčí (39); válec a káča (41–43)." }
  - { id: cicero-de-finibus, druh: pramen, nazev: "O nejvyšším dobru a zlu III, 22 a 50–51; IV, 20 a 72", autor: Cicero, dilo: "De finibus bonorum et malorum, lat. Th. Schiche (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi048/phi0474.phi048.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Stoik Cato: lučištník má udělat všechno, aby mířil přesně, zásah je „k vybrání, ne k usilování“ (III, 22); věci, kterým se dává přednost (III, 50–51); Cicero proti stoikům: se staršími se shodují věcí, liší se slovy (IV, 72)." }
  - { id: cicero-tusculanae, druh: pramen, nazev: "Tuskulské hovory V, 24–25", autor: Cicero, dilo: "Tusculanae disputationes, lat. M. Pohlenz (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi049/phi0474.phi049.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Theofrastos napadán všemi školami za větu „životu vládne štěstěna, ne moudrost“ a za to, že mučený podle něj nemůže být blažený." }
  - { id: lucretius-ii, druh: pramen, nazev: "O přírodě II, 216–293", autor: Lucretius, dilo: "De rerum natura, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0550/phi001/phi0550.phi001.perseus-lat1.xml", overeno: 2026-10-02, poznamka: "Atomy se v neurčitý čas a na neurčitém místě nepatrně odchylují (216–224); odchylka trhá „úmluvy osudu“, odtud svobodná vůle (251–293)." }
  - { id: iep-epictetus, druh: encyklopedie, nazev: "Epictetus", autor: "Keith H. Seddon", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/epictetu/", overeno: 2026-10-02, poznamka: "Narozen asi 55 v Hierapoli; u Musonia ještě jako otrok; vykázán „asi 89“; Arriános asi 86–160; Kelsos a Suda o noze." }
  - { id: iep-marcus, druh: encyklopedie, nazev: "Marcus Aurelius", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/marcus/", overeno: 2026-10-02, poznamka: "Adopce 138, císařem 161, sám od 169; Hovory jako osobní zápisník, nejspíš z tažení asi 171–175; Epiktétovy tři oblasti cvičení; pohled z hlediska kosmu (IX, 32)." }
  - { id: sep-freedom-ancient, druh: encyklopedie, nazev: "Ancient Theories of Freedom and Determinism", autor: "Tim O'Keefe", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/freedom-ancient/", overeno: 2026-10-02, poznamka: "Aristotelés tezi determinismu neformuluje; odchylka atomů v dochovaných Epikúrových textech není; stoikové spojují osud a odpovědnost (válec, spoluosudové věci); Karneadés kritizuje obě strany; podle M. Fredeho se pojem svobodné vůle poprvé objevuje u Epiktéta." }
  - { id: britannica-celsus, druh: encyklopedie, nazev: "Celsus", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Celsus", overeno: 2026-10-02, poznamka: "Pravdivé slovo napsal asi roku 178." }
  - { id: britannica-contra-celsum, druh: encyklopedie, nazev: "Contra Celsum", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/topic/Contra-Celsum", overeno: 2026-10-02, poznamka: "Órigenés psal nejspíš roku 248." }
  - { id: britannica-carnuntum, druh: encyklopedie, nazev: "Carnuntum", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/place/Carnuntum", overeno: 2026-10-02, poznamka: "U dnešní obce Petronell-Carnuntum, 32 km východně od Vídně, na Dunaji; Marcus tu psal druhou knihu Hovorů za tažení proti Markomanům (172–174)." }
  - { id: gross-1998, druh: monografie, nazev: "Antecedent- and response-focused emotion regulation: divergent consequences for experience, expression, and physiology", autor: "James J. Gross", dilo: "Journal of Personality and Social Psychology 74 (1998), 224–237", url: "https://pubmed.ncbi.nlm.nih.gov/9457784/", overeno: 2026-10-02, poznamka: "120 účastníků, film vyvolávající odpor; přehodnocení i potlačení snížily projevy, přehodnocení snížilo i prožívaný odpor, potlačení zvýšilo aktivaci sympatiku. Čten jen souhrn (PubMed); jméno autora nástroj nezobrazil, ověřit." }
  - { id: met-marcus-jezdec, druh: data, nazev: "Equestrian Statue of Marcus Aurelius (59.570.282)", autor: "Marco Dente", dilo: "The Metropolitan Museum of Art, New York", url: "https://www.metmuseum.org/art/collection/search/343595", overeno: 2026-10-02, poznamka: "Rytina, 1515–1527; nápis na podstavci: socha z bronzu stojí v Římě před Lateránem. Public Domain, Open Access CC0 (API muzea: isPublicDomain true)." }
  - { id: whe-epiktetos-1715, druh: data, nazev: "Epictetus (rytina z roku 1715)", dilo: "World History Encyclopedia", url: "https://www.worldhistory.org/image/3388/epictetus/", overeno: 2026-10-02, poznamka: "Úvodní list knihy Epicteti Enchiridion Latinis versibus adumbratum (E. Ivie, Oxford 1715; vydání doloženo katalogem Eton College, B13574). V desce podpis kreslíře („… delin.“) a rytce („MB. sculp.“), pod obrazem řecké dvojverší o otroku Epiktétovi. Stránka uvádí Public Domain (a omylem rok 1751)." }
  # Celek 4 „Je to, co vidím, celá skutečnost?“ (docs/podklady/celek-4-co-je-skutecne.md): řecké texty z PerseusDL, není-li uvedeno jinak.
  - { id: platon-ustava-perseus, druh: pramen, nazev: "Ústava II, IV–VII a X", autor: Platón, dilo: "Respublica, řecky J. Burnet, angl. P. Shorey (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg030/tlg0059.tlg030.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Mluví Sókratés, vypráví celý rozhovor; Glaukón a Adeimantos jsou Platónovi bratři. Glaukón obnovuje Thrasymachovu řeč a sám jí nevěří (357a–358d); původ spravedlnosti jako úmluva slabých (358e–359b); Gygův prsten: předek Lýda Gýga, pastýř, bronzový kůň, prsten, král (359c–360b), dva prsteny (360b–d), vyostření (360e–361d); cenzura básníků (377b–c, 398a); ušlechtilá lež a kovy (414b–415c); spravedlnost je dělat to své (433a–b); tři části duše a Leontios (439d–441a); spravedlnost jako pořádek v duši (441d–444a); strážkyně (451d–457b); společné ženy a děti strážců (457c–d, 461d); řízené sňatky, zmanipulované losy, děti horších skryjí na tajném místě (459c–460c); filozofové králi (473c–474a); dobro samo Sókratés říct odmítne (506b–e); slunce (507b–509c); úsečka, čtverec sám (509d–511e); jeskyně (514a–517a), výklad a „bůh ví, jestli je to pravda“ (517a–c), dvojí zakalení očí (518a–b), vzdělání jako otočení duše (518b–d), povinný návrat (519c–520e), vládnout mají ti, kdo o to nestojí (520d–521a); láska k Homérovi, muže nelze ctít víc než pravdu (595b–c); idea stolu a lehátka (596a–b); starý spor filozofie a básnictví (607b); Gýgův prsten (612b)." }
  - { id: platon-faidon-perseus, druh: pramen, nazev: "Faidón 59b, 74a–75b, 91b–c a 100b–e", autor: Platón, dilo: "Phaedo, řecky J. Burnet, angl. H. N. Fowler (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg004/tlg0059.tlg004.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Výčet přítomných v den popravy, „Platón, myslím, stonal“ (59b; mluví Faidón); stejné klacky a kameny a stejné samo (74a–75b); málo dbejte na Sókrata, mnohem víc na pravdu (91c); krásné věci jsou krásné krásou, nejbezpečnější odpověď (100b–e). 8. 10. 2026 (celek 6): filozofovat je chystat se na smrt (64a, 67e; do studentského textu ne); je-li duše nesmrtelná, potřebuje péči pro všechen čas (107c); věřit tomu je „krásné riziko“ (114d)." }
  - { id: platon-parmenides, druh: pramen, nazev: "Parmenidés 127a–135d", autor: Platón, dilo: "Parmenides, řecky J. Burnet, angl. H. N. Fowler (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg009/tlg0059.tlg009.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Rámec: Parmenidovi asi 65, Zénónovi asi 40, Sókratés velmi mladý (127a–c). Mladý Sókratés hájí ideje (128e–130a). Námitky: čeho jsou ideje, vlas, bláto, špína, „utíkám“ (130b–e); celek a část, den a plachta (131a–e); regres velikosti, tzv. třetí člověk (132a–b); ideje jako myšlenky (132b–c); vzory a podobnost (132d–133a); největší potíž, pán a otrok (133b–134e). Bez idejí zanikne možnost rozhovoru (135b–c); Sókratés začal definovat příliš brzy (135c–d)." }
  - { id: platon-sedmy-list, druh: pramen, nazev: "Sedmý list (pravost sporná)", autor: "dochováno pod Platónovým jménem", dilo: "Epistulae VII, řecky J. Burnet, angl. R. G. Bury (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg036/tlg0059.tlg036.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "První příchod do Syrákús „asi ve čtyřiceti“ (324a); mládí, vláda Třiceti, příbuzní zvou do vlády, Sókratés odmítne zatknout občana, Sókratova smrt, filozofové a vládci (324b–326b); Itálie a Sicílie, Dión (326b–327b); druhá cesta, „abych si nepřipadal jako pouhé slovo“, Dión vyhnán asi po třech měsících, „prosby tyranů jsou smíšené s nutností“ (327c–329e); třetí cesta, triéra, dopisy od Archyty (338a–339e); žádný spis o těchto věcech, kruh (341b–342c); mezi žoldnéři, Archytova loď, Lamiskos, Olympie (349e–350e). O prodeji do otroctví list mlčí. Pravost: viz podkladový list." }
  - { id: platon-timaios, druh: pramen, nazev: "Tímaios 51b–52a", autor: Platón, dilo: "Timaeus, řecky J. Burnet, angl. R. G. Bury (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg031/tlg0059.tlg031.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Mluví Tímaios. Jsou-li rozum a pravdivé mínění dvojí, ideje jsou; jedno vzniká poučením, druhé přemlouváním, jedno se přemluvit nedá, druhé ano (51d–e)." }
  - { id: platon-sofistes, druh: pramen, nazev: "Sofistés 245e–247c", autor: Platón, dilo: "Sophista, řecky J. Burnet, angl. H. N. Fowler (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg007/tlg0059.tlg007.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Mluví host z Eleje s Theaitétem. Boj obrů o to, co je: jedni uznávají jen to, čeho se dá dotknout, druzí hájí netělesné ideje (246a–c). Koho míní, neříká." }
  - { id: dl-iii, druh: pramen, nazev: "Životy filozofů III, 1–9, 18–26 a 35–47", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Platón: rod, Kritiás a Charmidés (1); narození podle Apollodóra, smrt na svatbě podle Hermippa (2); věk podle Neantha, Aigína podle Favorina (3); bratři, zápas u Aristóna z Argu, jméno Aristoklés podle Alexandra, Isthmické hry podle Dikaiarcha (4); básně, labuť, spálené tragédie (5); od dvaceti u Sókrata, Megara podle Hermodóra, Kyréné, Itálie, Egypt (6); Akadémie (7); tři cesty na Sicílii, prodej na Aigíně, Annikeris, dvě verze (18–21); Archytův dopis (21–22); „co toho ten mladík o mně nalhal“ (35); jmenuje se jen ve Faidónu a v Obraně, Aristotelés jediný doposlouchal Faidóna, Zákony na voskových tabulkách (37); smrt, vši podle Myroniana (40); hrob v Akademii, závěť (41–43); náhrobní nápisy (43–45); žáci, dvě ženy (46)." }
  - { id: dl-ix-34, druh: pramen, nazev: "Životy filozofů IX, 34–36, 40, 43–45 a 72", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Démokritos: Abdéra, Leukippos (34); Platón ho nikde nejmenuje, podle Aristoxena chtěl jeho spisy spálit (40); počátky jsou atomy a prázdno, vše ostatní se jen má za jsoucí, nic nevzniká z ničeho (44); vlastnosti podle zvyku, podle přírody atomy a prázdno (45); „podle zvyku chladné, podle zvyku teplé, ve skutečnosti atomy a prázdno“ (72)." }
  - { id: aristoteles-metafyzika-ideje, druh: pramen, nazev: "Metafyzika I, 1; I, 6; I, 9; XIII, 4 a 9", autor: Aristotelés, dilo: "Metaphysica, řecky W. D. Ross, angl. H. Tredennick (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg025/tlg0086.tlg025.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Všichni lidé touží vědět, láska ke smyslům (980a21–27). Platón, Kratylos a Hérakleitos, Sókratovy definice, ideje (987a29–b10). Kritika idejí: zdvojení, „dokazujeme“ v první osobě (990a34–b11), třetí člověk (990b17), k čemu ideje věcem jsou, vzory jako básnické metafory (991a8–22), podstata neoddělená od věci (991b1–3). Sókratés obecné neodděloval, oni je oddělili a nazvali idejemi (1078b12–32). Bez obecného není vědění, potíže působí oddělení (1086b2–7). 5. 10. 2026 (celek 5): umění vzniká z mnoha zkušeností; v jednání zkušený často předčí toho, kdo má jen výklad; lékař neuzdravuje člověka, ale Kalliu nebo Sókrata; moudřejší je přesto ten, kdo zná příčinu (981a1–30). V XIII, 4 stojí o důkazech idejí neosobní „dokazuje se“ (1079a4–5), v I, 9 „dokazujeme“." }
  - { id: aristoteles-etika-i-6, druh: pramen, nazev: "Etika Nikomachova I, 6", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Ideje zavedli přátelé; obojí je milé, ale svatou povinností je dát přednost pravdě (1096a11–17; Platóna nejmenuje). Dobro se říká mnoha způsoby (1096a17–b29). Dobro samo by člověk nemohl uskutečnit (1096b32–35). Tkadlec, tesař a lékař: léčí se tento člověk (1097a8–13)." }
  - { id: aristoteles-politika-ii, druh: pramen, nazev: "Politika II, 1 a 3", autor: Aristotelés, dilo: "Politica, řecky W. D. Ross, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg035/tlg0086.tlg035.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "„V Platónově Ústavě; tam totiž Sókratés říká…“ (1261a6). O společné se pečuje nejméně; každý by měl tisíc synů (1261b32–40)." }
  - { id: aristoteles-kategorie, druh: pramen, nazev: "Kategorie 5", autor: Aristotelés, dilo: "Categoriae, angl. E. M. Edghill (MIT Internet Classics Archive); řecká věta z řecké Wikisource", url: "http://classics.mit.edu/Aristotle/categories.1.1.html", overeno: 2026-10-03, poznamka: "První podstata je to, co se nevypovídá o podmětu ani není v podmětu: tento člověk, tento kůň; kdyby nebylo prvních podstat, nemohlo by být nic jiného. V PerseusDL dílo není; Bekkerovo číslování (2a11–14, 2b5–6) jsem v otevřeném vydání neviděl. 5. 10. 2026 (celek 5): řecký text 5. kapitoly ověřen ve vydání I. Bekkera z roku 1837 (First1KGreek, tlg0086.tlg006), které řádky nemá; čísla 2a11 a 2b6 potvrzuje SEP „Aristotle's Categories“ (sep-aristotle-categories)." }
  - { id: aristoteles-meteorologika, druh: pramen, nazev: "Meteorologika III, 2 a 4", autor: Aristotelés, dilo: "Meteorologica, řecky I. Bekker (vydání 1837, First1KGreek), angl. E. W. Webster (MIT Internet Classics Archive)", url: "https://classics.mit.edu/Aristotle/meteorology.3.iii.html", overeno: 2026-10-04, poznamka: "Duha je odraz pohledu ke slunci, proto vzniká vždy naproti němu (III, 4). Drobné kapky jsou zrcadla, ve kterých se neukáže tvar, jen barva; duha netvoří celý kruh ani víc než půlkruh; měsíční duhu potkali za víc než padesát let jen dvakrát (III, 2). Duha vzniká i od vesel zvednutých z moře a když někdo proti slunci rozstříkne jemné kapky (III, 4). Aristotelés nechává pohled vycházet z oka; dnešní výklad je lom a odraz světla v kapkách (britannica-rainbow). Anglicky čteny kapitoly 2 a 4, řecky jen uvedené věty; Bekkerovo číslování v otevřeném vydání není." }
  - { id: britannica-rainbow, druh: encyklopedie, nazev: "Rainbow", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/science/rainbow-atmospheric-phenomenon", overeno: 2026-10-04, poznamka: "Duha vzniká lomem a vnitřním odrazem světla v kapkách; je vidět naproti Slunci; nejjasnější paprsky tvoří kužel s vrcholem v oku pozorovatele a poloměrem asi 42°. Že každý pozorovatel vidí duhu jinde a že se k ní nedá dojít, z toho plyne; výslovně to článek neříká." }
  - { id: plutarchos-dion, druh: pramen, nazev: "Dión 5 a 20", autor: Plútarchos, dilo: "Dion, řecky a angl. B. Perrin (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0007/tlg060/tlg0007.tlg060.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Platón a Dionýsios starší, Pollis, prodej na Aigíně („říká se“; kap. 5). Archytova loď; Platónova odpověď při loučení; Plútarchos dodává, že Platónova vlastní slova s tím docela nesouhlasí (kap. 20)." }
  - { id: isokrates-antidosis, druh: pramen, nazev: "Antidosis 261–271", autor: Isokratés, dilo: "Antidosis, řecky a angl. G. Norlin (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0010/tlg019/tlg0010.tlg019.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Učitelé sporů, astronomie a geometrie žákům prospívají méně, než slibují; je to cvičení mysli, ne filozofie (261–266); staří sofisté a jejich spekulace (268–269); lidé nemají v povaze dosáhnout vědění, moudrý je, kdo míněním většinou trefí nejlepší (271). Platóna ani Akademii nejmenuje." }
  - { id: isokrates-helena, druh: pramen, nazev: "Helena 1 a 5", autor: Isokratés, dilo: "Helena, řecky a angl. L. Van Hook (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0010/tlg009/tlg0010.tlg009.perseus-grc2.xml", overeno: 2026-10-03, poznamka: "Někteří tvrdí, že odvaha, moudrost a spravedlnost jsou totéž vědění (1); lepší rozumné mínění o užitečném než přesné vědění o neužitečném (5). Nikoho nejmenuje." }
  - { id: herodotos-i-8, druh: pramen, nazev: "Dějiny I, 8–12", autor: Hérodotos, dilo: "Historiae, angl. A. D. Godley (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0016/tlg001/tlg0016.tlg001.perseus-eng2.xml", overeno: 2026-10-03, poznamka: "Jiný příběh o Gýgovi, bez prstenu: Kandaulés, královna, vražda krále." }
  - { id: cicero-de-senectute, druh: pramen, nazev: "O stáří 13", autor: Cicero, dilo: "Cato Maior de senectute, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi051/phi0474.phi051.perseus-lat2.xml", overeno: 2026-10-03, poznamka: "Platón zemřel v jedenaosmdesátém roce při psaní („uno et octogesimo anno scribens est mortuus“)." }
  - { id: parmenides-b8, druh: pramen, nazev: "Zlomek B8 (DK 28 B8), verše 1–10 a 38–41", autor: Parmenidés, dilo: "O přírodě, dochováno u Simplikia; řecký text a angl. překlad J. Burneta (lexundria.com)", url: "https://lexundria.com/parm_frag/8/grk", overeno: 2026-10-03, poznamka: "Co je, je nezrozené a nezanikající, celé, nehybné a bez konce (3–4); nebylo ani nebude, je teď celé najednou (5–6); z nejsoucího vzniknout nemohlo, proč později, a ne dřív (7–10); vznik, zánik a změna jsou jména smrtelníků (38–41, podle Burnetova překladu)." }
  - { id: iep-plato, druh: encyklopedie, nazev: "Plato", autor: "Thomas Brickhouse, Nicholas D. Smith", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/plato/", overeno: 2026-10-03, poznamka: "Narozen 428/427, zemřel 348/347 v osmdesáti nebo jedenaosmdesáti; rodiče Aristón a Periktioné, starší bratři Glaukón a Adeimantos, sestra Pótóné, nevlastní otec Pyrilampés; strýc Charmidés mezi Třiceti; jméno Aristoklés „zřejmě“; první cesta na Sicílii asi ve čtyřiceti, Dión; další dvě cesty za Dionýsiem II.; Akademie; pohřben v Akademii." }
  - { id: iep-academy, druh: encyklopedie, nazev: "Plato: The Academy", autor: "Lewis Trelawny-Cassity", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/plato-academy/", overeno: 2026-10-03, poznamka: "Založení se klade mezi roky 387 a 383; Platón se tam s druhými scházel už koncem 90. let; háj za hradbami; dvě žačky (Lastheneia, Axiothea); Aristotelés 367–347; Speusippos scholarchou do 339; Platón pohřben v Akademii. Nápis o geometrii neuvádí." }
  - { id: nails-plato, druh: monografie, nazev: "The Life of Plato of Athens", autor: "Debra Nails", dilo: "A Companion to Plato (Blackwell 2006), kap. 1; ukázka nakladatele", url: "https://catalogimages.wiley.com/images/db/pdf/9781405191111.excerpt.pdf", overeno: 2026-10-03, poznamka: "Narození klade do roku 424/423, tradiční datum má za konstrukci; Kritiás a Charmidés padli 403; Megara asi v osmadvaceti; první cesta „skoro ve čtyřiceti“, Archytás, Dión; prodej do otroctví jen „v Diogenově podání“; Akademie založena po návratu ze Sicílie roku 383, bez školného; Aristotelés 367; druhá cesta 366, třetí 361; Dión 357–354; smrt 347, hrob v Akademii; Sedmý list: i odpůrci pravosti uznávají autora blízkého Platónovi. O jménu Aristoklés a o nápisu mlčí." }
  - { id: sep-plato-parmenides, druh: encyklopedie, nazev: "Plato's Parmenides", autor: "Samuel Rickless", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/plato-parmenides/", overeno: 2026-10-03, poznamka: "Rev. 13. 3. 2026. Setkání je skoro jistě smyšlené; šest námitek proti idejím (130a–134e); 135b–c; badatelé se neshodnou, zda je Platón pokládal za smrtelné." }
  - { id: sep-plato-metaphysics, druh: encyklopedie, nazev: "Plato's Middle Period Metaphysics and Epistemology", autor: "Allan Silverman", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/plato-metaphysics/", overeno: 2026-10-03, poznamka: "Důvody pro ideje (věci jsou F i ne-F; vědění potřebuje stálý předmět; jedno nad mnohým); čtyři úseky úsečky (eikasia, pistis, dianoia, nous); rozpomínání v Menónu a Faidónu." }
  - { id: denyer-2016, druh: monografie, nazev: "The Seventh Letter: A Discussion of Myles Burnyeat and Michael Frede, The Pseudo-Platonic Seventh Letter", autor: "Nicholas Denyer", dilo: "Oxford Studies in Ancient Philosophy (2016); abstrakt v repozitáři University of Cambridge", url: "https://www.repository.cam.ac.uk/items/3f260bf9-479b-4c58-9215-15ca34429a48", overeno: 2026-10-03, poznamka: "Burnyeat a Frede (2015): list je podvržený a jeho autor je Platónovi příliš vzdálený, než aby spolehlivě svědčil; Denyer závěr přijímá. Čten jen abstrakt." }
  - { id: guthrie-platon-jmeno, druh: monografie, nazev: "A History of Greek Philosophy IV: Plato, the Man and His Dialogues, Earlier Period (život)", autor: "W. K. C. Guthrie", dilo: "Cambridge University Press 1975; výňatek na ellopos.net", url: "https://www.ellopos.net/Elpenor/greek-texts/ancient-greece/guthrie-plato.asp?pg=26", overeno: 2026-10-03, poznamka: "Původní jméno Aristoklés po dědovi; Platón bylo běžné jméno, v Athénách 31 dokladů; odkaz na J. A. Notopoula (Classical Philology 1939). Čtena jen tato poznámka." }
  - { id: bohacek-2015, druh: monografie, nazev: "Přítel Aristotelés", autor: "Kryštof Boháček", dilo: "Aither 7 (2015), č. 13, s. 34–45", url: "https://aither.upol.cz/artkey/ath-201501-0004_pritel-aristoteles.php", overeno: 2026-10-03, poznamka: "Rčení Amicus Plato, sed magis amica veritas poprvé u Rogera Bacona (Opus maius I, 5), rozšířil Cervantes (Don Quijote II, 1615); předobrazy u Platóna (Faidón 91c, Ústava 595c); dějiny rčení: L. Tarán (1984). Cituje Křížův překlad Etiky Nikomachovy 1096a." }
  - { id: bmcr-hermippos, druh: monografie, nazev: "Recenze: J. Bollansée, Hermippos of Smyrna and his Biographical Writings (1999)", autor: "Daniel Gershenson", dilo: "Bryn Mawr Classical Review 2000.07.28", url: "https://bmcr.brynmawr.edu/?p=21918", overeno: 2026-10-03, poznamka: "Hermippos působil v Alexandrii v 2. polovině 3. století př. n. l.; mnohé jeho životopisy jsou vymyšlené příběhy o smrtích slavných." }
  - { id: britannica-alexander-polyhistor, druh: encyklopedie, nazev: "Alexander Polyhistor", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Alexander-Polyhistor", overeno: 2026-10-03, poznamka: "Asi 105–35 př. n. l." }
  - { id: britannica-dicaearchus, druh: encyklopedie, nazev: "Dicaearchus", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Dicaearchus", overeno: 2026-10-03, poznamka: "Činný kolem 320 př. n. l., Aristotelův žák." }
  - { id: britannica-diogenes-laertius, druh: encyklopedie, nazev: "Diogenes Laërtius", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Diogenes-Laertius", overeno: 2026-10-03, poznamka: "Činný ve 3. století n. l.; nejdůležitější dochovaný druhotný pramen, vedle cenných údajů i klepy." }
  - { id: smithsonian-papyrus-2024, druh: data, nazev: "This Newly Deciphered Papyrus Scroll Reveals the Location of Plato's Grave (novinová zpráva)", dilo: "Smithsonian Magazine, duben 2024", url: "https://www.smithsonianmag.com/smart-news/platos-elusive-grave-located-after-bionic-eye-penetrates-2000-year-old-papyrus-180984221/", overeno: 2026-10-03, poznamka: "Nově přečtené části Filodémových Dějin Akademie (G. Ranocchia, Univerzita v Pise, CNR): hrob v zahradě u svatyně Múz v Akademii; prodej do otroctví prý už roku 404 nebo 399. Jen zpráva, vydání textu jsem neviděl." }
  - { id: nyhan-2023, druh: monografie, nazev: "Like-minded sources on Facebook are prevalent but not polarizing", autor: "Brendan Nyhan a kol.", dilo: "Nature 620 (2023), 137–144", url: "https://www.nature.com/articles/s41586-023-06297-w", overeno: 2026-10-03, poznamka: "Čten plný text (otevřený přístup). Pokus 24. 9. – 23. 12. 2020 mezi 23 377 souhlasícími dospělými uživateli Facebooku v USA: podíl obsahu od stejně smýšlejících zdrojů snížen z 53,7 % na 36,2 %, obsah z opačné strany vzrostl z 20,7 % na 27,9 %; žádný měřitelný účinek na osm předem určených měřítek postojů. Prostřední uživatel: 50,4 % od stejně smýšlejících, 14,7 % z opačné strany; 20,6 % uživatelů má přes 75 %; občanský obsah a zprávy mediány 6,9 % a 6,7 %. Meze: tři měsíce, volby, jen USA a Facebook. Akademičtí autoři neplaceni, poslední slovo o analýze, předregistrace." }
  - { id: osome-eletter-2024, druh: data, nazev: "Science eLetter: Social media algorithms can curb misinformation, but do they? (shrnutí)", dilo: "Observatory on Social Media, Indiana University", url: "https://osome.iu.edu/research/blog/science-eletter-social-media-algorithms-can-curb-misinformation-but-do-they", overeno: 2026-10-03, poznamka: "Výhrada k sesterské studii (Guess a kol., Science 2023): Meta od listopadu 2020 do března 2021 dočasně zpřísnila algoritmus, pokus běžel v té době. Čteno jen shrnutí autorské skupiny." }
  - { id: nga-saenredam-jeskyne, druh: data, nazev: "Plato's Cave (1983.61.1)", autor: "Jan Saenredam podle Cornelise Cornelisze van Haarlem", dilo: "National Gallery of Art, Washington", url: "https://www.nga.gov/artworks/62542-platos-cave", overeno: 2026-10-03, poznamka: "Mědirytina, 1604, vydal Hendrik Hondius; list 33,7 × 45 cm; Ailsa Mellon Bruce Fund. Muzeum: „free and in the public domain“. Nápis nahoře: Jan 3, 19 a ANTRUM PLATONICUM. Dole dvanáct latinských veršů, signatury „C. C. Harlemensis Inv.“, „Saenredam Sculpsit“, „Henr. Hondius excudit“, „1604“ a věnování: rytinu dal nakreslit a vyrýt H. L. Spiegel a věnoval ji Pieteru Paawovi, profesoru lékařství v Leidenu (čteno z listu 4. 10. 2026). Soubor stažen 4. 10. 2026 přes IIIF muzea (1280 × 959 px)." }
  - { id: smk-platon-odlitek, druh: data, nazev: "Platon (427–347 f.Kr.), græsk filosof (KAS2111)", dilo: "Statens Museum for Kunst, Den Kongelige Afstøbningssamling, Kodaň", url: "https://open.smk.dk/artwork/image/KAS2111", overeno: 2026-10-03, poznamka: "Sádrový odlitek mramorové hlavy z Ny Carlsberg Glyptotek, římské kopie řeckého originálu z doby kolem 350 př. n. l.; do sbírky získán 1947 (rok výroby odlitku muzeum neuvádí); výška 49 cm; Public Domain. Údaje z API muzea. Soubor stažen 4. 10. 2026 přes IIIF muzea (1280 × 1280 px); snímek má černé pozadí." }
  # Celek 5 „Stačí vědět, co je správné?“ (docs/podklady/celek-5-staci-vedet.md): řecké texty z PerseusDL a First1KGreek, není-li uvedeno jinak.
  - { id: aristoteles-etika-ii, druh: pramen, nazev: "Etika Nikomachova I, 3; II, 1–2, 4 a 6–9; X, 9", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Mladý člověk není vhodný posluchač výkladů o obci; nezáleží na věku, ale na tom, kdo žije podle vášně (1095a2–11). Ctnost povahy vzniká ze zvyku, ne od přírody: kámen, stavitelé a kitharisté (1103a14–b2); zákonodárci; ze stavění jsou dobří i špatní stavitelé (1103b2–25); nezkoumáme, abychom věděli, ale abychom se stali dobrými (1103b26–29); o jednání se dá mluvit jen v obrysech, jako v lékařství a kormidelnictví (1104a1–10). Spravedlivý není ten, kdo jen udělá spravedlivou věc: tři podmínky; nemocní, kteří lékaře poslouchají a nedělají, co nařídil (1105a17–b18). Ctnost oka a koně (1106a15–24); střed věci a střed vzhledem k nám, Milón (1106a26–b7); kdy, nad čím, vůči komu, kvůli čemu a jak (1106b16–23); definice ctnosti (1106b36–1107a2); co střed nemá: škodolibost, závist, krádež, vražda (1107a8–17). Odvaze je blíž smělost než zbabělost (1108b30–1109a12). Rozhněvat se umí každý (1109a24–30); táhnout se na opačnou stranu, rovnání dřeva (1109b1–7); nedá se to vymezit slovy, rozhoduje vnímání (1109b14–26). U ctnosti nestačí vědět; řeči samy nestačí; půda a semeno; zákony a výchova (1179a33–1180a24)." }
  - { id: aristoteles-etika-vii, druh: pramen, nazev: "Etika Nikomachova VII, 1–10", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Sókratés jmenován: vědění vláčené jako otrok; výklad odporuje tomu, co vidíme; je třeba zkoumat, o jakou nevědomost jde (1145b21–31). Vědět se říká dvojím způsobem; spící, šílený a opilý; verše Empedokleovy; kdo se právě naučil, řadí slova, ale neví, musí to srůst a chce to čas; herci (1146b31–1147a24). Vychází to, co hledal Sókratés: vědění v pravém smyslu se nevláčí (1147b9–17). Stavy z nemoci a ze zvyku od dětství nejsou neovládnutí ani špatnost (1148b15–1149a20; mezi příklady i místa dnes urážlivá, viz podkladový list, Citlivá místa). Hněv rozum poslouchá, ale přeslechne: ukvapení sluhové, psi (1149a24–b3). Dva druhy: zbrklost a slabost; lechtání (1150b19–28). Kdo se neovládne, lituje; je vyléčitelný; špatnost o sobě neví, neovládnutí ví (1150b29–36). Rozumný není ten, kdo jen ví; „napůl špatný“; obec, která má dobré zákony a neřídí se jimi; zvyk se mění snáz než přirozenost (1152a6–33)." }
  - { id: aristoteles-etika-viii, druh: pramen, nazev: "Etika Nikomachova VIII, 2–4 a 11", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Milujeme dobré, příjemné, nebo užitečné; vínu dobro nepřejeme; přátelství je vzájemná náklonnost, o které oba vědí (1155b17–1156a5). Tři druhy přátelství; pro užitek a pro příjemnost se rozpadají, když důvod pomine; staří a mladí (1156a6–b6). Dokonalé přátelství dobrých; je vzácné, chce čas, přísloví o soli; přání být přáteli vzniká rychle, přátelství ne (1156b7–32). Jen dobří jsou přáteli kvůli sobě samým; i ostatním se říká přátelé podle podobnosti (1157a14–33). K otrokovi jako otrokovi přátelství není, jako k člověku ano (1161a32–b8)." }
  - { id: platon-protagoras-vedeni, druh: pramen, nazev: "Prótagorás 352a–358e", autor: Platón, dilo: "Protagoras, řecky J. Burnet, angl. W. R. M. Lamb (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0059/tlg022/tlg0059.tlg022.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Mluví Sókratés, který rozhovor vypráví; odpovídá Prótagorás a nakonec i Prodikos a Hippiás. Většina si myslí, že vědění je vláčeno jako otrok; Sókratés a Prótagorás se shodnou, že vědění vládne (352b–d); většina jim nevěří (352d–e). Rozbor „podlehnout slasti“ s domnělou většinou: zlé je to, co končí bolestí; jiné měřítko než slast a bolest neumějí jmenovat (353c–355a). Zblízka se věci zdají větší; umění měřit (356c–357b). „Podlehnout slasti“ je nevědomost (357c–e). Všichni tři sofisté přitakají; je-li příjemné dobrem, nikdo nedělá horší, když zná lepší; podléhat sám sobě je nevědomost; nikdo nejde dobrovolně za zlem (358a–d)." }
  - { id: plutarchos-alexandr-vychova, druh: pramen, nazev: "Alexandr 5, 7–9, 16, 50–55, 74 a 77", autor: Plútarchos, dilo: "Vitae parallelae, řecky a angl. B. Perrin (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0007/tlg047/tlg0007.tlg047.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Vychovatelé Leónidás a Lýsimachos (5). Filip vidí, že syna nejde nutit, ale dá se vést rozumem; pošle pro Aristotela, odměnou obnoví Stageiru, kterou sám zničil; háj nymf u Miezy, kamenné lavice a stinné chodníky se ukazují dodnes; „zdá se“ (ἔοικε), že přijal nauku o povaze a o obci i hlubší výklady; dopis o zveřejněných přednáškách (7). Láska k lékařství; Íliada upravená Aristotelem pod polštářem s dýkou (podle Onésikrita); Aristotela zprvu miloval ne méně než otce, později k němu choval podezření (8). V šestnácti regentem; hostina, na které se na něj opilý Filip vrhne s mečem a upadne (9). Kleitos mu u Gráníku zachrání život (16). Zabití Kleita: jablko, stráž odnese meč, kopí u dveří; hněv ho hned opustí; noc a den nářku (50–52). Anaxarchos: co král udělá, je spravedlivé (52). Kallisthenés, Aristotelův příbuzný; odmítne se klanět; dopis Antipatrovi míří na Aristotela; tři verze smrti (53–55). „Sofismata Aristotelových žáků“ (74). Pověst o jedu od Aristotela, podle většiny smyšlená (77)." }
  - { id: arrianos-anabaze-iv, druh: pramen, nazev: "Anabasis IV, 8–10 a 14", autor: Arriános, dilo: "Anabasis Alexandri, řecky A. G. Roos (PerseusDL); anglický překlad v repozitáři není", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0074/tlg001/tlg0074.tlg001.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Čteno jen řecky. Kleitos, opilý, vyčítá Alexandrovi, že ho u Gráníku zachránil; kopí, nebo sarissa; podle Aristobúla Kleita odvedli a vrátil se (8, 4–9). Arriánův soud: Alexandr podlehl dvěma zlům, hněvu a opilosti; hned poznal, že spáchal hrozný čin; Kleitova sestra Laniké ho odkojila; tři dny bez jídla; nehájil se, uznal, že chyboval (9, 1–6). Anaxarchos a Arriánův soud o něm (9, 7–8). Kallisthenés z Olynthu, který poslouchal Aristotela (10, 1). Ptolemaios a Aristobúlos se o jeho smrti neshodnou (14, 3)." }
  - { id: dl-v, druh: pramen, nazev: "Životy filozofů V, 1–28", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Otec Níkomachos, lékař a přítel krále Amynta (podle Hermippa); vzhled podle Tímothea (1). Odešel prý ještě za Platónova života; jméno peripatetik podle Hermippa od procházek v Lykeiu, podle jiných od procházek s Alexandrem (2). Hermeiás, Pýthias ve třech verzích, Stageira obnovená na prosbu u Alexandra (3–4). Kallisthenés; třináct let v čele školy; žaloba pro bezbožnost od Eurymedonta, nebo Démofila (podle Favorina) kvůli hymnu na Hermeia (5–6). Smrt akonitem v sedmdesáti podle Euméla; Diogenés opravuje na šedesát tři (6). Hymnus na ctnost (7–8). Obhajoba a verš o fících (9). Chronologie podle Apollodóra: narozen Ol. 99, 1; v sedmnácti k Platónovi, dvacet let; Mytiléna Ol. 108, 4; tři roky u Hermeia; k Filipovi Ol. 109, 2, Alexandrovi je patnáct; Athény Ol. 111, 2; třináct let v Lykeiu; Chalkis Ol. 114, 3; zemřel nemocí asi v šedesáti třech (9–10). Závěť (11–16). Výroky (17–21). Soupis spisů začíná dialogy; listy Alexandrovi; celkem 445 270 řádků (22–27)." }
  - { id: ailianos-vh, druh: pramen, nazev: "Pestré příběhy III, 19 a 36; IV, 9; IX, 23; XII, 54; XIV, 1", autor: Ailiános, dilo: "Varia historia, řecky R. Hercher (Teubner 1866; PerseusDL); anglický překlad v repozitáři není", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0545/tlg002/tlg0545.tlg002.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Čteno jen řecky. Aristotelés prý obtěžoval starého Platóna otázkami (III, 19; nepřátelské vyprávění). Při odchodu z Athén: hruška na hrušce, fík na fíku; nechce, aby se Athéňané provinili proti filozofii podruhé (III, 36). Platón mu říkal Hříbě (IV, 9). Lékaři: nejdřív mi řekni příčinu (IX, 23). List Alexandrovi o hněvu (XII, 54). List Antipatrovi o odebraných poctách v Delfách (XIV, 1)." }
  - { id: strabon-xiii, druh: pramen, nazev: "Zeměpis XIII, 1, 54 a 57; XIII, 2, 4", autor: Strabón, dilo: "Geographica, řecky A. Meineke, angl. H. L. Jones (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0099/tlg001/tlg0099.tlg001.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Čteno anglicky. Aristotelova knihovna: Theofrastos, Néleus ze Sképse, dědicové ji zakopou před pergamskými králi, vlhkost a moli, Apellikón z Teu, Sulla, Tyrannión (1, 54). Assos: Hermeiás, eunuch a otrok bankéře, poslouchal Platóna i Aristotela; pozval Aristotela i Xenokrata; Aristotelovi dal dceru svého bratra; Memnón ho vylákal a poslal králi (1, 57). Theofrastos z Eresu; jméno mu dal Aristotelés (2, 4)." }
  - { id: plutarchos-sulla, druh: pramen, nazev: "Sulla 26", autor: Plútarchos, dilo: "Vitae parallelae, řecky a angl. B. Perrin (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0007/tlg033/tlg0007.tlg033.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Čteno anglicky. Sulla odveze z Athén Apellikónovu knihovnu s většinou spisů Aristotela a Theofrasta; Tyrannión je uspořádal, Andronikos z Rhodu vydal a sestavil soupisy („říká se“)." }
  - { id: plutarchos-de-fortuna, druh: pramen, nazev: "O Alexandrově štěstí nebo zdatnosti I, 4 a 6", autor: Plútarchos, dilo: "De Alexandri Magni fortuna aut virtute, řecky a angl. F. C. Babbitt (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0007/tlg087/tlg0007.tlg087.perseus-grc3.xml", overeno: 2026-10-05, poznamka: "Řečnická skladba. Od Aristotela si Alexandr odnesl víc než od otce (327e–328a). Aristotelés mu radil, ať je Řekům vůdcem a barbarům pánem a jedná s nimi jako se zvířaty nebo rostlinami; Alexandr se tím neřídil (329b)." }
  - { id: aristoteles-politika-i, druh: pramen, nazev: "Politika I, 2–7 a 13; VII, 10", autor: Aristotelés, dilo: "Politica, řecky W. D. Ross, angl. H. Rackham (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg035/tlg0086.tlg035.perseus-grc2.xml", overeno: 2026-10-05, poznamka: "Obec je od přírody a člověk je od přírody tvor obce; řeč, dobré a zlé; zvíře, nebo bůh; bez zákona nejhorší z živočichů (1252b27–1253a39). Někteří mají otroctví za násilí proti přírodě (1253b20–23). Otrok jako oduševnělý nástroj; kdyby člunky tkaly samy (1253b23–1254a17). Muž od přírody lepší, žena horší; otrok od přírody; příroda chce odlišit i těla, často se to nepovede (1254b13–39). Závěr: někteří jsou otroci od přírody a je to pro ně spravedlivé (1255a1–3); odpůrci mají v něčem pravdu: otroctví podle zákona a z války (1255a3–b15). Otrok rozvahu nemá, žena ji má bez rozhodující váhy, dítě nehotovou; ctnost ženy není táž jako ctnost muže, „jak si myslel Sókratés“ (1260a9–24). Je lépe slíbit všem otrokům svobodu za odměnu (1330a31–33)." }
  - { id: aristoteles-zivocichove, druh: pramen, nazev: "Zkoumání živočichů II, 3; V, 12, 15 a 19; VI, 3 a 12; VIII, 2 a 20", autor: Aristotelés, dilo: "Historia animalium, řecky I. Bekker (vydání 1837, First1KGreek); vydání nemá Bekkerovo číslování", url: "https://github.com/OpenGreekAndLatin/First1KGreek/blob/master/data/tlg0086/tlg014/tlg0086.tlg014.1st1K-grc1.xml", overeno: 2026-10-05, poznamka: "Čteno jen řecky. Laguna u Pyrrhy na Lesbu: ježovky (V, 12), hvězdice (V, 15), hřebenatky, které jednou vymizely kvůli nástroji rybářů a suchu (VIII, 20). Kuře ve vejci: po třech dnech srdce jako krvavá tečka, která se hýbe; desátý den je vidět celé (VI, 3). Delfín a velryby rodí živá mláďata, dýchají vzduch, mají plíce a mléko; delfín ve spánku chrápe; rybáři jim zařezávají ocas, aby poznali věk (VI, 12). Delfína nejde snadno zařadit mezi vodní ani suchozemské (VIII, 2). Muži mají víc zubů než ženy, stejně u ovcí, koz a prasat; „u ostatních to ještě nebylo pozorováno“ (II, 3). Živočichové prý vznikají i ve sněhu a v ohni; mlok oheň uhasí, „jak se říká“ (V, 19)." }
  - { id: aristoteles-casti-zivocichu, druh: pramen, nazev: "O částech živočichů I, 5", autor: Aristotelés, dilo: "De partibus animalium, řecky B. Langkavel (Teubner 1868, First1KGreek)", url: "https://github.com/OpenGreekAndLatin/First1KGreek/blob/master/data/tlg0086/tlg030/tlg0086.tlg030.1st1K-grc1.xml", overeno: 2026-10-05, poznamka: "Čteno jen řecky; anglická věta pro srovnání ze SEP „Aristotle's Biology“. O nebeských věcech víme málo, o rostlinách a živočiších hodně, protože s nimi žijeme; nemáme se štítit zkoumání méně vznešených živočichů; Hérakleitos u pece: i tady jsou bohové; i lidské tělo je z krve, masa a kostí. Bekkerovy řádky (645a15–23) ve vydání nejsou." }
  - { id: aristoteles-fyzika, druh: pramen, nazev: "Fyzika II, 3 a 8", autor: Aristotelés, dilo: "Physica, řecky W. D. Ross (First1KGreek)", url: "https://github.com/OpenGreekAndLatin/First1KGreek/blob/master/data/tlg0086/tlg031/tlg0086.tlg031.1st1K-grc1.xml", overeno: 2026-10-05, poznamka: "Čteno jen řecky. Věc známe, až pochopíme, proč je; čtyři způsoby, jak se říká příčina: z čeho (bronz sochy), tvar a vzor, odkud je počátek změny (rádce, otec), účel (procházka kvůli zdraví). Řádky 194b16–195a3 podle SEP „Aristotle on Causality“; ve vydání číslování není. II, 8: námitka, kterou Aristotelés sám vysloví a odmítne: Zeus neprší, aby rostlo obilí, ale z nutnosti; zuby mohly vyrůst vhodně náhodou; co se složilo vhodně, přežilo, ostatní zahynulo (s odkazem na Empedoklea); odpověď: co je od přírody, děje se vždy nebo většinou stejně, a to náhoda nedělá (běžně citováno jako 198b16–199a8)." }
  - { id: aristoteles-analytiky, druh: pramen, nazev: "První analytiky I, 1", autor: Aristotelés, dilo: "Analytica priora, řecky W. D. Ross (First1KGreek)", url: "https://github.com/OpenGreekAndLatin/First1KGreek/blob/master/data/tlg0086/tlg001/tlg0086.tlg001.1st1K-grc2.xml", overeno: 2026-10-05, poznamka: "Čteno jen řecky. Definice úsudku (sylogismu): řeč, ve které z toho, co se stanoví, nutně plyne něco jiného (24b18–20 podle běžného citování; ve vydání číslování není)." }
  - { id: sep-aristotle-politics, druh: encyklopedie, nazev: "Aristotle's Political Theory", autor: "Fred Miller", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/aristotle-politics/", overeno: 2026-10-05, poznamka: "Rev. 1. 7. 2022. O přirozených otrocích tvrdí Aristotelés bez dokladu, že jim chybí rozvaha; ženy ji mají „bez autority“; jeho důvody jsou tak slabé, že je někteří vykladači mají za ironii, pro antického Řeka ale samozřejmé být nemusely. Stránku četl nástroj WebFetch." }
  - { id: sep-aristotle-causality, druh: encyklopedie, nazev: "Aristotle on Causality", autor: "Andrea Falcon", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/aristotle-causality/", overeno: 2026-10-05, poznamka: "Rev. 7. 3. 2023. Čtyři příčiny jako odpovědi na otázku proč (Fyzika II, 3, 194b16–195a3; Metafyzika V, 2); bronzová socha; účel v přírodě nepotřebuje přání ani záměr; Empedoklés a zuby. Stránku četl nástroj WebFetch." }
  - { id: sep-aristotle-biology, druh: encyklopedie, nazev: "Aristotle's Biology", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/aristotle-biology/", overeno: 2026-10-05, poznamka: "Citát z O částech živočichů I, 5 o zkoumání méně cenných živočichů a o Hérakleitovi („i tady jsou bohové“). Autora a datum revize hlásil nástroj WebFetch (M. Leunissen, 19. 4. 2026); neověřoval jsem je." }
  - { id: sep-aristotle-categories, druh: encyklopedie, nazev: "Aristotle's Categories", autor: "Paul Studtmann", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/aristotle-categories/", overeno: 2026-10-05, poznamka: "Rev. 2. 2. 2021. První podstaty: jednotlivý člověk a kůň (1a20, 2a11); závislost všeho ostatního na nich (2a34–2b6); kdyby nebylo prvních podstat, nebylo by nic dalšího (2b6). Stránku četl nástroj WebFetch." }
  - { id: lally-2010, druh: monografie, nazev: "How are habits formed: Modelling habit formation in the real world", autor: "Phillippa Lally, Cornelia H. M. van Jaarsveld, Henry W. W. Potts, Jane Wardle", dilo: "European Journal of Social Psychology 40 (2010), 998–1009; plný text v repozitáři ISPA", url: "https://repositorio.ispa.pt/handle/10400.12/3364", overeno: 2026-10-05, poznamka: "Plný text četl nástroj WebFetch z PDF v repozitáři; čísla souhlasí s abstraktem a se shrnutím z roku 2012 (gardner-2012). 96 dobrovolníků (30 mužů, 66 žen, většinou postgraduální studenti, průměr 27 let, 30 liber za dokončení) si vybralo jedno jídlo, pití nebo pohyb a dělalo ho 12 týdnů (84 dní) jednou denně ve stejné situaci; každý den vyplnili sedm položek dotazníku o tom, jak samozřejmě jim to jde (0–42 bodů). Dost údajů dalo 82 lidí; křivka se dala proložit u 62, dobře u 39. U těch 39 trvalo 18 až 254 dní, než dosáhli 95 % svého stropu; medián 66 dní. Hodnoty nad 84 dní jsou dopočítané z křivky. Jeden vynechaný den dal o něco nižší skóre druhý den, trvalou ztrátu ne. Měřil se pocit samozřejmosti podle vlastní výpovědi, ne návyk sám." }
  - { id: gardner-2012, druh: monografie, nazev: "Making health habitual: the psychology of ‘habit-formation’ and general practice", autor: "Benjamin Gardner, Phillippa Lally, Jane Wardle", dilo: "British Journal of General Practice 62 (2012), 664–666", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3505409/", overeno: 2026-10-05, poznamka: "Shrnutí studie lally-2010 (P. Lally a J. Wardle jsou spoluautorky obou textů): plató po průměrně 66 dnech; občasné vynechání proces vážně nenaruší; jednoduché úkony (sklenice vody) se zautomatizují rychleji než složité (50 sedů-lehů). Pověra o 21 dnech vznikla podle nich z vyprávění o pacientech po plastické operaci (M. Maltz, Psycho-Cybernetics, 1960). Stránku četl nástroj WebFetch." }
  - { id: ucl-21-dni, druh: data, nazev: "Busting the 21 days habit formation myth", autor: "Benjamin Gardner, Susanne Meisel", dilo: "blog Health Behaviour Research Centre, University College London, 29. 6. 2012", url: "https://blogs.ucl.ac.uk/bsh/2012/06/29/busting-the-21-days-habit-formation-myth/", overeno: 2026-10-05, poznamka: "Maltz v knize z roku 1960 psal o „nejméně asi 21 dnech“, než se změní obraz, který o sobě člověk má (pacienti po operaci obličeje, fantomová končetina, nový dům); o návycích nepsal. Maltzovu knihu jsem neotevřel. Stránku četl nástroj WebFetch." }
  - { id: gollwitzer-1997, druh: monografie, nazev: "Implementation intentions and effective goal pursuit", autor: "Peter M. Gollwitzer, Veronika Brandstätter", dilo: "Journal of Personality and Social Psychology 73 (1997), 186–199; kopie na webu Stanford SPARQ", url: "https://sparq.stanford.edu/sites/g/files/sbiybj19021/files/media/file/gollwitzer_brandstatter_1997_-_implementation_intentions_effective_goal_pursuit.pdf", overeno: 2026-10-05, poznamka: "Plný text četl nástroj WebFetch; počty účastníků ve druhé studii vyšly ze čtení nejasně. Studie 2: studenti univerzity v Mnichově měli během dvou svátečních dnů napsat zprávu o tom, jak strávili Štědrý večer, a hned ji poslat. Polovina si předem určila, kdy a kde si k psaní sedne. Včas ji poslalo 71 % z nich proti 32 % ostatních. Studie 1: těžké úkoly na vánoční prázdniny splnilo 62 % těch, kdo si určili kdy a kde, a 22 % ostatních; u lehkých úkolů rozdíl nebyl." }
  - { id: aphthonios-chreia, druh: pramen, nazev: "Progymnasmata 3 (chreia)", autor: Afthonios, dilo: "Progymnasmata, angl. M. Heath (pracovní překlad na webu)", url: "https://free.openeclass.org/modules/document/file.php/HUM2035/E388%20Aphthonius%20Progymnasmata.pdf", overeno: 2026-10-05, poznamka: "Řečnická učebnice ze 4. století n. l. rozvádí výrok „Kořen vzdělání je hořký, plody sladké“ a připisuje ho Isokratovi. Stránku četl nástroj WebFetch." }
  - { id: wikiquote-aristotle, druh: data, nazev: "Aristotle (Wikiquote), oddíl Misattributed", dilo: "Wikiquote; jen rozcestník", url: "https://en.wikiquote.org/wiki/Aristotle", overeno: 2026-10-05, poznamka: "Věta „We are what we repeatedly do. Excellence, then, is not an act but a habit“ je z knihy W. Duranta The Story of Philosophy (1926), kap. II, oddíl o etice: je to Durantovo shrnutí, ne Aristotelova slova. Durantovu knihu jsem neotevřel (Gutenberg nástroj odmítl). Stránku četl nástroj WebFetch." }
  - { id: britannica-cleitus, druh: encyklopedie, nazev: "Cleitus", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Cleitus", overeno: 2026-10-05, poznamka: "Velitel části jízdy; Alexandr ho zabil v opilecké hádce v Marakandě (Samarkand) koncem roku 328 př. n. l. a hluboce toho litoval. Stránku četl nástroj WebFetch." }
  - { id: smk-aristoteles-odlitek, druh: data, nazev: "Aristoteles (384–322 f.Kr.), græsk filosof (KAS825)", dilo: "Statens Museum for Kunst, Den Kongelige Afstøbningssamling, Kodaň", url: "https://open.smk.dk/artwork/image/KAS825", overeno: 2026-10-05, poznamka: "Údaje z API muzea (četl nástroj WebFetch): sádrový odlitek hlavy, výška 43 cm, formírna Vídeň č. 8, do sbírky získán 1899; originál je mramorová hlava v Kunsthistorisches Museum ve Vídni, předloha se klade na konec 4. století př. n. l. a připisuje Lýsippovi. Volné dílo (Public Domain Mark). Snímek 2499 × 3165 px. Soubor zatím nestažen." }
  - { id: met-rembrandt-aristoteles, druh: data, nazev: "Aristotle with a Bust of Homer (61.198)", autor: "Rembrandt van Rijn", dilo: "The Metropolitan Museum of Art, New York", url: "https://www.metmuseum.org/art/collection/search/437394", overeno: 2026-10-05, poznamka: "Olej na plátně, 1653, 143,5 × 136,5 cm; namalováno pro sicilského šlechtice Antonia Ruffa. Podle muzea má Aristotelés na zlatém řetězu medailon s podobou Alexandra. API muzea: isPublicDomain true (Open Access, CC0). Soubor zatím nestažen." }
  - { id: met-skrinka-aristoteles, druh: data, nazev: "Box with Romance Scenes (17.190.173a, b; 1988.16)", dilo: "The Metropolitan Museum of Art, New York", url: "https://www.metmuseum.org/art/collection/search/464125", overeno: 2026-10-05, poznamka: "Skříňka ze slonoviny, Paříž, asi 1310–1330. Přední deska (1988.16) má podle muzea čtyři výjevy: Aristotelés učí Alexandra, Fyllis jede na Aristotelovi, lev trhá Thisbin plášť, Pýramova smrt. API muzea: isPublicDomain true. Který snímek ukazuje přední desku, jsem neviděl. Soubor zatím nestažen." }
  - { id: met-aquamanile-fyllis, druh: data, nazev: "Aquamanile in the Form of Aristotle and Phyllis (1975.1.1416)", dilo: "The Metropolitan Museum of Art, New York, Robert Lehman Collection", url: "https://www.metmuseum.org/art/collection/search/459202", overeno: 2026-10-05, poznamka: "Bronzová nádoba na vodu, jižní Nizozemí, konec 14. nebo počátek 15. století. Muzeum vypráví středověkou pověst: Aristotelés, učitel Alexandra, se nechal ponížit svůdnou Fyllidou. API muzea: isPublicDomain true. Soubor zatím nestažen." }
  - { id: walters-skrinka-aristoteles, druh: data, nazev: "Box Front with Scenes of Alexander and Pyramus (71.196)", dilo: "The Walters Art Museum, Baltimore", url: "https://art.thewalters.org/object/71.196/", overeno: 2026-10-05, poznamka: "Deska ze slonoviny, Paříž, 1330–1350, 9,4 × 20,2 cm. Podle muzea: Aristotelés učí Alexandra; Fyllis jede na Aristotelovi a Alexandr přihlíží; Pýramos a Thisbé. Licence CC0. Stránku četl nástroj WebFetch; soubor nástrojům muzeum nevydá." }
  # Celek 6 „Proč se bát smrti?“ (docs/podklady/celek-6-proc-se-bat-smrti.md): latinské texty z PerseusDL a The Latin Library, řecké z PerseusDL
  # a First1KGreek, není-li uvedeno jinak. Čteno 8. 10. 2026 v plném znění; encyklopedie četl nástroj WebFetch (viz úvod podkladového listu).
  - { id: iep-seneca, druh: encyklopedie, nazev: "Lucius Annaeus Seneca", autor: "Robert Wagoner", dilo: Internet Encyclopedia of Philosophy, url: "https://iep.utm.edu/seneca/", overeno: 2026-10-08, poznamka: "Četl nástroj WebFetch. Nejčastější odhad narození 4 př. n. l.; do Říma přišel velmi brzy, asi do pěti let; učitelé Attalos a Fabianus; kvůli chatrnému zdraví „se má za to“, že strávil několik let v Egyptě; roku 41 odsouzen senátem pro cizoložství s Julií Livillou a Claudiem vypovězen na Korsiku do roku 49; po návratu Neronův vychovatel, později s Burrem rádce a pisatel projevů; o výši jeho majetku je mimo Suilliovo obvinění málo nezávislých dokladů; 124 dopisů ve 20 knihách, nejspíš nejsou všechny; osm tragédií; korespondence s apoštolem Pavlem je podvrh, dlouho pokládaný za pravý." }
  - { id: sep-death, druh: encyklopedie, nazev: "Death", autor: "Steven Luper", dilo: Stanford Encyclopedia of Philosophy, url: "https://plato.stanford.edu/entries/death/", overeno: 2026-10-08, poznamka: "Četl nástroj WebFetch (rev. 28. 7. 2026). Epikúrův argument je nejsilnější, když „smrt“ znamená být mrtvý, ne umírat; bolestné umírání může být zlé i podle něj. Námitka ztráty (deprivationism, comparativism): smrt je zlá tím, o jaká dobra nás připraví; mezi první zastánce řadí T. Nagela (Death, 1970). K Lucretiovu zrcadlu: Nagel odpovídá, že člověk nemohl vzniknout výrazně dřív, než vznikl; heslo tu odpověď pokládá za spornou. Otázka, kdy je smrt pro zemřelého zlá, zůstává otevřená. Nagelův článek jsem nečetl." }
  - { id: seneca-epistulae-smrt, druh: pramen, nazev: "Dopisy Luciliovi 1, 4, 12, 24, 26, 30, 54, 61, 63, 66, 77, 78, 92, 99 a 104", autor: Seneca, dilo: "Epistulae morales, lat. R. M. Gummere (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1017/phi015/phi1017.phi015.perseus-lat2.xml", overeno: 2026-10-08, poznamka: "Čas je to jediné, co je naše; umíráme každý den (1, 2–3). Smrt buď nedojde, nebo přejde (4, 3); příklady dobrovolné smrti se způsobem (4, 4: do studentského textu ne). Stará vila, platany, vrátný Felicio (12, 1–3). Smrt nás buď stráví, nebo svlékne (24, 18); umíráme každý den, vodní hodiny, Luciliův verš (24, 19–21; myšlenku připisuje Luciliovi); Epikúros kárá i ty, kdo po smrti touží (24, 22–23); „libido moriendi“ (24, 25). Řeč je odvážná i u bojácných, rozhodne až konec (26, 5–6). Aufidius Bassus: starý nemocný muž mluví o smrti klidně a drží se Epikúra; slova nepomáhala, dokud je neřekl někdo, kdo je smrti blízko; nebojíme se smrti, ale myšlenky na ni (30). Záchvat dušnosti, „meditatio mortis“, smrt je nebýt, lampa (54). Dost žít není věc let (61, 4). Smrt přítele Flacca; slzy ano, bez míry ne; sám oplakával Serena bez míry (63, 1 a 14); vzpomínka na mrtvé přátele (63, 4–7). Epikúrův poslední den (66, 47; 92, 25). Dopis 77: Marcellinus (obhajoba dobrovolné smrti, do studentského textu ne); „ne jak dlouho, ale jak dobře“ (77, 20). Nemoc v mládí: chtěl skoncovat se životem, zůstal kvůli otci, „někdy je statečné i žít“; pomohli přátelé a filozofie (78, 1–4). Tvrdý dopis otci, kterému zemřel malý syn (99, 1–2); nepohnout se nad pohřbem svých je nelidskost, ne ctnost (99, 15); co bylo, je naše (99, 4); Métrodórův výrok o slasti v zármutku (99, 25). Paulina; kvůli blízkým se má člověk držet života (104, 1–5); Sókratés: cestuješ sám se sebou (104, 7)." }
  - { id: seneca-epistulae-zivot, druh: pramen, nazev: "Dopisy Luciliovi 6, 7, 8, 21, 28, 38, 40, 47, 67, 75, 106, 107 a 108", autor: Seneca, dilo: "Epistulae morales, lat. R. M. Gummere (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1017/phi015/phi1017.phi015.perseus-lat2.xml", overeno: 2026-10-08, poznamka: "Přátelství; Kleanthés by Zénóna nepochopil, kdyby ho jen slyšel: žil s ním (6, 6). Dav a polední hry; „lidé se učí, když učí“ (7, 3 a 8); Epikúrův výrok příteli (7, 11). Píše pro ty, kdo přijdou po něm (8, 2–3). Epikúros slibuje Ídomeneovi slávu z dopisů, Seneca totéž Luciliovi (21, 3–5). „Musíš změnit mysl, ne oblohu“; Sókratés (28, 1–2). Dopis jako rozhovor (38, 1; 40, 1; 67, 2; 75, 1); ať řeč ladí se životem (75, 4). Otroci jsou lidé; pravidlo (47, 11); sám popírá, že volá po osvobození (47, 18); zneužívání otroka u stolu (47, 7: do studentského textu ne). „Non vitae sed scholae discimus“ (106, 12). Kleanthovy verše o osudu v Senekově převodu (107, 10–11). Attalos, Sótión, rok bez masa, otec, který „nenáviděl filozofii“, tvrdá matrace; „z filozofie se stala filologie“ (108, 13–23)." }
  - { id: seneca-de-ira, druh: pramen, nazev: "O hněvu I, 1 a 9; II, 22 a 28–29; III, 12–13 a 36", autor: Seneca, dilo: "De ira (The Latin Library)", url: "https://www.thelatinlibrary.com/sen/sen.ira3.shtml", overeno: 2026-10-08, poznamka: "Věnováno bratru Novatovi. Hněv jako krátké šílenství, „jak říkali někteří moudří“ (I, 1, 2). Aristotelova věta, že hněv je potřeba jako voják, ne jako vůdce, a Senekovo „to není pravda“ (I, 9, 2). Příčinou hněvu je domněnka, že mi bylo ublíženo; dej tomu čas (II, 22, 2). Nikdo z nás není bez viny (II, 28). „Maximum remedium irae mora est“ (II, 29, 1; podobně III, 12, 4). Platón, zdvižená ruka a Speusippos (III, 12, 5–7; příběh o bití otroka). Sókratés ztišil hlas (III, 13, 3). Večerní ohlédnutí podle Sextia: tři otázky, soudce sám sobě, „teď ti odpouštím“ (III, 36). Knihy I a II na adresách sen.ira1.shtml a sen.ira2.shtml." }
  - { id: seneca-helvia, druh: pramen, nazev: "Útěcha matce Helvii 2, 6–7, 17 a 19–20", autor: Seneca, dilo: "Ad Helviam matrem de consolatione (The Latin Library)", url: "https://www.thelatinlibrary.com/sen/sen.consolatione3.shtml", overeno: 2026-10-08, poznamka: "Psáno z vyhnanství. Dvacet dní před jeho odsouzením zemřel v matčině náručí jeho syn (2, 5). Ostrov nejmenuje: „tahle skála“, „vyprahlé a trnité skalisko“, kde dřív sídlili Řekové z Fókaie (6, 5; 7, 8–9). Otcova „starodávná přísnost“ nedovolila matce studovat (17, 3–4). Teta ho jako dítě donesla do Říma, ošetřovala ho v dlouhé nemoci a přimluvila se za jeho kvestorský úřad; její muž spravoval šestnáct let Egypt a zemřel na plavbě, jejímž byl Seneca svědkem (19, 2–6). Pobyt v Egyptě text výslovně neuvádí. O sobě: je veselý, zkoumá přírodu (20)." }
  - { id: seneca-marcia, druh: pramen, nazev: "Útěcha Marcii 1, 7, 10, 12, 19 a 25–26", autor: Seneca, dilo: "Ad Marciam de consolatione (The Latin Library)", url: "https://www.thelatinlibrary.com/sen/sen.consolatione2.shtml", overeno: 2026-10-08, poznamka: "Marcia, dcera dějepisce Cremutia Corda, truchlí třetí rok pro syna (1, 7). Stesk po svých je přirozený, pokud je mírný (7, 1); ženy a „barbaři“ truchlí víc (7, 3: do studentského textu ne). Všechno máme půjčené (10, 1–3). Lepší mít dobro, které odejde, než žádné (12, 3). Epikurejský argument ve stoické útěše: smrt není dobro ani zlo, vrací nás do klidu, ve kterém jsme byli před narozením (19, 4–5). Syn mezi blaženými dušemi (25–26). Cordova smrt hladem (26, 3: do studentského textu ne). Podle SEP nejspíš nejstarší dochovaný Senekův spis, tedy ne z vyhnanství." }
  - { id: seneca-polybius, druh: pramen, nazev: "Útěcha Polybiovi 13 a 18", autor: Seneca, dilo: "Ad Polybium de consolatione (The Latin Library)", url: "https://www.thelatinlibrary.com/sen/sen.consolatione1.shtml", overeno: 2026-10-08, poznamka: "Psáno z vyhnanství císařovu propuštěnci. Chvála Claudia a prosba o milost; Claudius se za něj přimluvil u senátu a „život mi nejen daroval, ale i vyprosil“ (13, 2–4). Kolem zní řeč barbarů a latina mu vázne (18, 9). Začátek spisu chybí." }
  - { id: seneca-clementia, druh: pramen, nazev: "O mírnosti I, 1 a 9; II, 1", autor: Seneca, dilo: "De clementia (The Latin Library)", url: "https://www.thelatinlibrary.com/sen/sen.clem.shtml", overeno: 2026-10-08, poznamka: "Věnováno Neronovi: chce mu být „jaksi zrcadlem“ (I, 1, 1). Neronovi právě minulo osmnáct (I, 9, 1). Když měl podepsat rozsudek nad dvěma lupiči, zvolal prý „Kéž bych neuměl psát!“ (II, 1, 2; vypráví Seneca jako svědek)." }
  - { id: seneca-tranquillitate, druh: pramen, nazev: "O duševním klidu 2, 13–15", autor: Seneca, dilo: "De tranquillitate animi (The Latin Library)", url: "https://www.thelatinlibrary.com/sen/sen.tranq.shtml", overeno: 2026-10-08, poznamka: "Lidé střídají místa a zábavy; „jak říká Lucretius: tak každý pořád utíká sám před sebou“ (2, 14; Lucretius III, 1068). Věnováno příteli Annaeu Serenovi." }
  - { id: seneca-beneficiis, druh: pramen, nazev: "O dobrodiních VII, 1", autor: Seneca, dilo: "De beneficiis, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1017/phi013/phi1017.phi013.perseus-lat2.xml", overeno: 2026-10-08, poznamka: "Kynik Démétrios: velký zápasník není ten, kdo zná všechny chvaty, ale kdo jeden nebo dva dobře nacvičil a pozorně čeká na příležitost je použít (VII, 1, 4). Nejbližší místo k výroku o štěstí, přípravě a příležitosti; výrok sám u Seneky není." }
  - { id: seneca-nq, druh: pramen, nazev: "Otázky přírody VI, 1", autor: Seneca, dilo: "Naturales quaestiones (The Latin Library)", url: "https://www.thelatinlibrary.com/sen/sen.qn6.shtml", overeno: 2026-10-08, poznamka: "Luciliovi: zemětřesení 5. února za konzulů Regula a Verginia poškodilo Pompeje a Herculaneum (VI, 1, 1–2); „vyděšeným je třeba hledat útěchu a zbavit je velkého strachu“ (VI, 1, 4)." }
  - { id: seneca-hercules-furens, druh: pramen, nazev: "Zuřící Herkules 437", autor: Seneca, dilo: "Hercules furens, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1017/phi001/phi1017.phi001.perseus-lat2.xml", overeno: 2026-10-08, poznamka: "Megara: „Non est ad astra mollis e terris via.“ Rčení „Per aspera ad astra“ u Seneky není; v Dopise 53, 4 jen „per aspera erepo“ (šplhá po skalách na břeh)." }
  - { id: tacitus-annales-seneca, druh: pramen, nazev: "Letopisy VI, 29; XII, 8; XIII, 2–6, 11–18, 20–21 a 42–43; XIV, 2–3, 7, 10–11, 14, 31, 42–45, 51–57 a 65; XV, 23, 45, 56, 60–65, 67, 70, 71 a 73; XVI, 17", autor: Tacitus, dilo: "Annales, lat. C. D. Fisher (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1351/phi005/phi1351.phi005.perseus-lat1.xml", overeno: 2026-10-08, poznamka: "Tacitus se narodil roku 56 a zemřel kolem roku 120 (Britannica); Letopisy psal ve stáří, tedy asi půl století po Senekově smrti. Agrippina mu vymohla návrat a praeturu, aby vychovával Domitia (XII, 8). Burrus a Seneca brání vraždám a drží mladého císaře „povolenými požitky“; Seneca učí výmluvnosti (XIII, 2). Pohřební řeč na Claudia a nástupní řeč napsal Seneca (XIII, 3–4); řeči o mírnosti (XIII, 11). Britannicus: Seneku Tacitus nejmenuje (XIII, 15–17); po vraždě Nero obdaroval přední přátele a někteří vyčítali „mužům, kteří hlásají vážnost“, že si rozdělili domy a vily (XIII, 18). Fabius Rusticus Senekovi straní, protože za jeho přátelství vzkvétal (XIII, 20). Suillius: „nejspravedlivější vyhnanství“, cizoložník v Germanikově domě, 300 milionů sesterciů za čtyři roky, závěti a lichva; výčitkami nešetří a Senekovi je donesou; sám je pak odsouzen (XIII, 42–43). Po nezdařeném ztroskotání volá Nero Burra a Seneku, „nejisto, zda o věci věděli už dřív“; Seneca se ptá Burra, má-li vraždu provést vojsko (XIV, 7). Dopis senátu: v pověsti byl hůř Seneca, že takovou řečí sepsal přiznání (XIV, 11). Povstání Icenů: Seneku Tacitus mezi příčinami neuvádí (XIV, 31). Čtyři sta otroků Pedania Secunda: Seneku v debatě nejmenuje (XIV, 42–45). Burrova smrt, obvinění, žádost o odchod a Neronova odpověď (stylizované řeči; „čtrnáctý rok, co jsem byl přidán k tvé naději“; XIV, 52–56). Po požáru prý žádal o odchod na venkov a jed prý připravil propuštěnec Cleonicus („ferebatur“, „tradidere quidam“; XV, 45). Natalis ho jmenuje (XV, 56). Nero se ptá, zda se Seneca chystá k „dobrovolné smrti“, a poručí „oznámit smrt“ (XV, 61). Smrt: „caedes“, Nero neměl důkaz; večeře s Paulinou a dvěma přáteli; odkázal přátelům „obraz svého života“; Paulinu dal Nero zachránit; pohřben bez obřadu (XV, 60–64). Pověst, že měl po Pisonovi dostat vládu (XV, 65). Bratr Mela, synovec Lucanus (XVI, 17). Obecný zvyk za Tiberia: kdo o sobě rozhodl sám, toho pohřbili a jeho závěť platila, kdežto odsouzeným propadl majetek a pohřeb jim byl odepřen; „odměna za spěch“ (VI, 29); u Seneky Tacitus ten důvod neuvádí. Roky podle běžné datace konzulů; seznam jsem neověřoval. Způsob smrti (XV, 63–64) do studentského textu nepatří." }
  - { id: suetonius-nero, druh: pramen, nazev: "Nero 7, 35 a 52", autor: Suetonius, dilo: "De vita Caesarum, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1348/abo016/phi1348.abo016.perseus-lat2.xml", overeno: 2026-10-08, poznamka: "Suetonius se narodil roku 69 a zemřel po roce 122 (Britannica); psal tedy asi půl století po Senekově smrti. V jedenácti letech Nero adoptován a svěřen Senekovi, „už tehdy senátorovi“; Seneca prý tu noc snil, že učí Caligulu („ferunt“; 7). Seneku „dohnal k smrti“, ač mu přísahal, že mu neublíží, když žádal o propuštění a nabízel majetek (35). Od filozofie Nerona odvrátila matka: budoucímu vladaři prý škodí; od starých řečníků Seneca, aby ho déle obdivoval (52)." }
  - { id: suetonius-caligula, druh: pramen, nazev: "Caligula 53", autor: Suetonius, dilo: "De vita Caesarum, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1348/abo014/phi1348.abo014.perseus-lat2.xml", overeno: 2026-10-08, poznamka: "Caligula pohrdal uhlazeným slohem: o Senekovi, „tehdy nejoblíbenějším“, říkal, že skládá „commissiones meras“ (pouhé kousky na předvádění) a že je to „písek bez vápna“ (53, 2). Suetonius psal asi 80 let po Caligulově vládě." }
  - { id: cassius-dio-seneca, druh: pramen, nazev: "Římské dějiny 59, 19; 60, 8 a 35; 61, 3–4, 7, 10, 12, 18 a 20; 62, 2 a 24–25", autor: Cassius Dio, dilo: "Historia Romana, angl. překlad z Loeb Classical Library (sv. VIII, 1925), LacusCurtius", url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cassius_Dio/61*.html", overeno: 2026-10-08, poznamka: "Dio se narodil kolem roku 150 a zemřel roku 235 (Britannica); psal tedy nejdřív 130 let po Senekově smrti. Knihy 61 a 62 jsou na LacusCurtius označené jako výtah (Epitome); pozdní knihy se podle Britanniky dochovaly hlavně u Xifilina a Zonara. Čteno jen anglicky. K Senekovi nepřátelský. Caligula ho chtěl dát zabít pro dobrou řeč v senátu a ušetřil ho, když mu řekli, že stejně brzy zemře na souchotiny (59, 19, 7–8). Vyhnán pro cizoložství s Julií, na kterou žárlila Messalina (60, 8, 5). Satira „Apocolocyntosis“ (60, 35, 3). Výčet výčitek: vztah s Agrippinou, učitel tyrana, pochlebná kniha z ostrova, kterou pak ze studu potlačil, 300 milionů, pět set stolků z citronového dřeva (61, 10). Po Britannikově smrti se Seneca a Burrus spokojili s tím, že řídí věci umírněně a zůstanou naživu (61, 7, 5). K vraždě matky Nerona podněcoval i Seneca, „jak tvrdí mnoho důvěryhodných mužů“ (61, 12, 1). Půjčka Britům 40 milionů sesterciů, které nechtěli, a její náhlé vymáhání jako jedna z příčin Boudičina povstání (62, 2, 1; jediný pramen). Smrt: chtěl, aby s ním zemřela i Paulina (62, 25)." }
  - { id: aurelius-victor-caes, druh: pramen, nazev: "O císařích 5", autor: Aurelius Victor, dilo: "Liber de Caesaribus (The Latin Library)", url: "https://www.thelatinlibrary.com/victor.caes.html", overeno: 2026-10-08, poznamka: "Psáno ve 4. století (tak The Latin Library), asi 300 let po Neronovi. Nero byl pět let tak velký, „hlavně rozšiřováním města“, že Trajanus často říkal, že se Neronovu pětiletí žádný císař zdaleka nevyrovná (5, 2). Seneku ani Burra nejmenuje a neříká, kterých pět let myslí." }
  - { id: hieronymus-viri-12, druh: pramen, nazev: "O slavných mužích 12", autor: Hieronymus, dilo: "De viris illustribus, angl. překlad (New Advent)", url: "https://www.newadvent.org/fathers/2708.htm", overeno: 2026-10-08, poznamka: "Konec 4. století. Seneku by mezi svaté neřadil, kdyby ho k tomu nepobízely „mnohými čtené“ listy Pavla Senekovi a Seneky Pavlovi. Nejstarší zmínka o té korespondenci; IEP ji označuje za podvrh. Latinský text jsem nečetl." }
  - { id: quintilianus-x-1, druh: pramen, nazev: "Základy rétoriky X, 1, 125–131", autor: Quintilianus, dilo: "Institutio oratoria (The Latin Library)", url: "https://www.thelatinlibrary.com/quintilian/quintilian.institutio10.shtml", overeno: 2026-10-08, poznamka: "Podle běžného datování asi třicet let po Senekovi (neověřoval jsem). Seneca byl tehdy „skoro jediný v rukou mladých“; měli ho radši, než ho uměli napodobit. Kolují jeho řeči, básně, dopisy a dialogy. „Ve filozofii málo důkladný, zato vynikající kárat neřestí.“ Lepší by bylo, kdyby psal svým nadáním a cizím úsudkem." }
  - { id: skutky-18, druh: pramen, nazev: "Skutky apoštolů 18, 12–17", dilo: "Vulgata (The Latin Library)", url: "https://www.thelatinlibrary.com/bible/acts.shtml", overeno: 2026-10-08, poznamka: "Pavel v Korintu před soudnou stolicí Galliona, prokonzula Achaje, který žalobu odmítne řešit. Gallio je Senekův bratr Novatus (Seneca, Dopisy 104, 1: „můj pán Gallio“ v Achaji; Tacitus, Letopisy XV, 73)." }
  - { id: seneca-starsi-controv, druh: pramen, nazev: "Kontroverze IV, 3 (výtah)", autor: Seneca starší, dilo: "Controversiae (The Latin Library)", url: "https://www.thelatinlibrary.com/seneca.contr4.html", overeno: 2026-10-08, poznamka: "V řečnickém cvičení jen slova „per humanos errores“ (pro lidské chyby). Rčení „Errare humanum est“ tu není." }
  - { id: cicero-philippicae-xii, druh: pramen, nazev: "Filipiky XII, 5", autor: Cicero, dilo: "Philippicae (The Latin Library)", url: "https://www.thelatinlibrary.com/cicero/phil12.shtml", overeno: 2026-10-08, poznamka: "„Cuiusvis hominis est errare, nullius nisi insipientis in errore perseverare“: mýlit se může každý, setrvat v omylu jen hlupák." }
  - { id: popik-luck-2011, druh: data, nazev: "“Luck is what happens when preparation meets opportunity”", autor: "Barry Popik", dilo: "The Big Apple (26. 5. 2011)", url: "https://barrypopik.com/blog/luck_is_what_happens_when_preparation_meets_opportunity", overeno: 2026-10-08, poznamka: "Výrok se Senekovi připisuje až od roku 1999 a bez udání místa; nejstarší nalezená podoba je z časopisu Youth's Companion (1912), ve 20. letech ho používaly reklamy bank. Autor neznámý." }
  - { id: dl-x-22, druh: pramen, nazev: "Životy filozofů X, 15–22 a 118–120", autor: Diogenés Laertios, dilo: "Vitae philosophorum, řecky a angl. R. D. Hicks (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0004/tlg001/tlg0004.tlg001.perseus-grc2.xml", overeno: 2026-10-08, poznamka: "Psáno asi 500 let po Epikúrovi. Zemřel na kámen, který mu zadržel moč, po čtrnácti dnech nemoci (podle Hermarchových dopisů); podle Hermippa vstoupil do bronzové vany s teplou vodou, vypil neředěné víno, vyzval přátele, ať pamatují na jeho učení, a zemřel (15–16). Závěť: zahrada škole, oslava narozenin a dvacátého dne v měsíci na památku jeho a Métrodóra, péče o Métrodórova syna a dceru, propuštění otroků (16–21). Dopis Ídomeneovi psaný při umírání (22). Moudrý bude sténat na mučidlech (118), ani oslepený si život nevezme (119), bude cítit žal a někdy za přítele i zemře (120)." }
  - { id: cicero-de-finibus-ii, druh: pramen, nazev: "O nejvyšším dobru a zlu II, 94–103", autor: Cicero, dilo: "De finibus bonorum et malorum, lat. Th. Schiche (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi048/phi0474.phi048.perseus-lat2.xml", overeno: 2026-10-08, poznamka: "Podle běžného datování z roku 45 př. n. l., asi 225 let po Epikúrově smrti (rok jsem neověřoval); mluví Cicero proti epikurejci Torquatovi. „Velká bolest je krátká, dlouhá lehká“ neplatí: vidí bolesti velké a dlouhé, Filoktétés leží v jeskyni desátý rok (94–95; obsahuje „ať tedy zemře“, do studentského textu ne). Umírající Epikúros píše Hermarchovi („Epicurus Hermarcho salutem“); Cicero dopis přeložil „skoro slovo od slova“ (96, 100). Dopis chválí, ale s učením se podle něj neshoduje: radost z úvah není tělesná a péče o cizí děti ukazuje, že dobré je dobré samo o sobě (98–99). Závěť odporuje větě, že smrt se nás netýká: proč se stará o oslavy po smrti (100–103). Démokrita, „jediného, koho následoval“, nic takového nenapadlo (102)." }
  - { id: cicero-tusculanae-i, druh: pramen, nazev: "Tuskulské hovory I, 82–91", autor: Cicero, dilo: "Tusculanae disputationes, lat. M. Pohlenz (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi049/phi0474.phi049.perseus-lat2.xml", overeno: 2026-10-08, poznamka: "Podle běžného datování rok 45 př. n. l. Námitka ztráty zazní jako cizí hlas: „trápí, nebo spíš mučí odchod od všeho, co je v životě dobré“ (83). Odpověď: smrt odvádí spíš od zlého; „postrádat“ může jen ten, kdo vnímá, mrtvý tedy nic nepostrádá (87–88). Moudrý se stará o potomstvo, i když z něj nic mít nebude (90–91). Zmínka o Hégésiovi (83–84) do studentského textu nepatří." }
  - { id: lucretius-iii-830, druh: pramen, nazev: "O přírodě III, 830–1094", autor: Lucretius, dilo: "De rerum natura, lat. (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0550/phi001/phi0550.phi001.perseus-lat1.xml", overeno: 2026-10-08, poznamka: "Smrt se nás netýká; za punských válek jsme nic necítili, tak ani po smrti (830–842). Kdo se zlobí, co bude s jeho tělem, představuje si sám sebe vedle něj (870–893). Řeč truchlících: už tě nepřivítá dům, žena ani děti, jeden den ti vzal všechno; básník odpovídá, že po tom už nebudeš toužit, a ptá se, proč by měl kdo chřadnout věčným žalem (894–911). Řeč Přírody: proč neodejdeš jako nasycený host; starci ostřeji (931–962); její druhá půlka radí nespokojenému život skončit (940–943: do studentského textu ne). Život je všem jen k užívání (971). Zrcadlo času před narozením (972–977). Podsvětí je tady, v životě (978–1023). Zemřeli i Scipio, Homér, Démokritos, Epikúros (1024–1052; Démokritos dobrovolně, 1039–1041: do studentského textu ne). Každý utíká sám před sebou (1053–1070). Delší život smrt nezkrátí (1087–1094)." }
  - { id: plutarchos-non-posse, druh: pramen, nazev: "Že podle Epikúra nelze žít příjemně 20 a 25–31 (1100e–1101c, 1104a–1107c)", autor: Plútarchos, dilo: "Non posse suaviter vivi secundum Epicurum, řecky a anglicky (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0007/tlg139/tlg0007.tlg139.perseus-grc2.xml", overeno: 2026-10-08, poznamka: "Plútarchos psal kolem roku 100 n. l. (běžné datování, neověřoval jsem), přes 350 let po Epikúrovi. Rozhovor na procházce po přednášce; vypráví Plútarchos, mluví hlavně jeho přátelé Aristodémos a Theón. Aristodémos: epikurejci sami odmítají ty, kdo ruší zármutek, slzy a nářek nad smrtí přátel; bezcitnost je podle nich z horšího zla, ze surovosti; Epikúros to psal i v dopisech otci a bratrovi zemřelého Hégésianakta (1101a–b). Theón: lidé chtějí být, i kdyby jim bylo zle (1104c–e); věta, že rozpadlé nevnímá, strach neodstraní, spíš ho dokazuje (1105a); naděje na shledání s rodiči a ženou; Epikúros řekl, že vzpomínka na mrtvého přítele je sladká (1105c–e); šťastným bere smrt víc než nešťastným (1106b–c); přirozenost se bojí ztráty přítomných dober a to „netýká se nás“ se nás týká už teď v myšlence (1106e); únik před zlem mají za dobro, ale ztrátu dobra za zlo ne (1107b). Řecky čteny kap. 20 a 27–31, ostatní anglicky." }
  - { id: aristoteles-etika-smrt, druh: pramen, nazev: "Etika Nikomachova III, 6 a 9; X, 7", autor: Aristotelés, dilo: "Ethica Nicomachea, řecky I. Bywater (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0086/tlg010/tlg0086.tlg010.perseus-grc2.xml", overeno: 2026-10-08, poznamka: "Čteno řecky. Nejstrašnější je smrt, protože je to hranice (1115a26–27; výklad o statečnosti). Čím je člověk ctnostnější a šťastnější, tím víc ho smrt bolí: ví, že přichází o největší dobra (1117b9–13; o statečném v boji). Nemáme myslet jen na smrtelné, ale nakolik to jde, stávat se nesmrtelnými a žít podle toho nejlepšího v sobě (1177b31–1178a2)." }
  - { id: goranson-2017, druh: monografie, nazev: "Dying Is Unexpectedly Positive", autor: "Amelia Goranson, Ryan S. Ritter, Adam Waytz, Michael I. Norton, Kurt Gray", dilo: "Psychological Science 28 (2017), 988–999", url: "https://doi.org/10.1177/0956797617701186", overeno: 2026-10-08, poznamka: "Čteno v plném textu (PDF na webu jednoho z autorů). Studie 1: 25 blogů lidí s rakovinou (20) a ALS (5), kteří během psaní zemřeli, celkem 2 616 příspěvků; posledních dvanáct týdnů (597 příspěvků) srovnáno s texty 45 lidí, kteří si měli představit, že mají smrtelnou rakovinu a zbývá jim pár měsíců, a napsat příspěvek na blog. Počítačový rozbor slov: nemocní použili méně záporných citových slov (1,70 % proti 2,25 %), v kladných se nelišili. Lidští hodnotitelé: příspěvky nemocných kladnější a méně záporné; vyškolení hodnotitelé potvrdili jen menší zápornost. Kladných slov u nemocných s blížící se smrtí přibývalo, záporných významně ne. Meze podle autorů: málo blogů, pisatelé se vybrali sami, skupiny se nedaly srovnat věkem ani jinak, počítání slov nevidí souvislost; výsledek nemusí platit pro každého a o tom, kdo stojí vedle umírajícího, neříká nic. Studie 2 (poslední slova popravených v Texasu) do studentského textu nepatří." }
  - { id: russac-2007, druh: monografie, nazev: "Death anxiety across the adult years: an examination of age and gender effects", autor: "R. J. Russac, C. Gatliff, M. Reece, D. Spottswood", dilo: "Death Studies 31 (2007), 549–561", url: "https://pubmed.ncbi.nlm.nih.gov/17726829/", overeno: 2026-10-08, poznamka: "Čten jen abstrakt. 304 mužů a žen ve věku 18 až 87 let vyplnilo dotazník strachu ze smrti: úzkost byla nejvyšší u dvacátníků a potom klesala; u žen se znovu zvedla kolem padesátky. Druhá studie se 113 ženami ukázala totéž. Jednorázové srovnání věkových skupin v USA, ne sledování týchž lidí; mladší osmnácti let ve vzorku nebyli." }
  - { id: chopik-2017, druh: monografie, nazev: "Death across the lifespan: Age differences in death-related thoughts and anxiety", autor: "William J. Chopik", dilo: "Death Studies 41 (2017), 69–77", url: "https://pubmed.ncbi.nlm.nih.gov/27573253/", overeno: 2026-10-08, poznamka: "Čten jen abstrakt. Průřezový průzkum 2 363 dospělých: myšlenek na smrt s věkem ubývá. Čtyřleté sledování 9 815 dospělých: úzkost ze smrti s věkem klesala; kdo měl větší oporu v blízkých, měl jí později méně, i po zohlednění zdraví." }
  - { id: bastian-2020, druh: data, nazev: "Why Do Scientists Cite “The Top 5 Regrets of the Dying”?", autor: "Hilda Bastian", dilo: "Absolutely Maybe, PLOS Blogs (5. 3. 2020)", url: "https://absolutelymaybe.plos.org/2020/03/05/why-do-scientists-cite-the-top-5-regrets-of-the-dying/", overeno: 2026-10-08, poznamka: "Četl nástroj WebFetch. „Pět věcí, kterých lidé před smrtí litují“ pochází z blogu a knihy (2011) Bronnie Wareové, která o umírající pečovala bez odborného vzdělání; není to studie: žádný počet pacientů, záznam ani rozbor. Autorka nenašla výzkum, který by běžné lítosti umírajících zjišťoval; jedna studie irských pacientů s rakovinou uvádí, že lítost u většiny nebyla hlavní starostí. Knihu Wareové jsem nečetl." }
  - { id: who-media-2023, druh: data, nazev: "Preventing suicide: a resource for media professionals, update 2023", dilo: "World Health Organization (2023)", url: "https://iris.who.int/handle/10665/372691", overeno: 2026-10-08, poznamka: "Čteno v plném textu (textová verze v repozitáři WHO). Nedělat: sebevraždu jako hlavní zprávu, popis způsobu, místo, jazyk, který sebevraždu dělá senzací, romantizuje ji, bere jako běžnou věc nebo ji podává jako schůdné řešení potíží, zjednodušení příčiny na jednu, podrobnosti z dopisu na rozloučenou. Dělat: příběhy o tom, jak lidé zvládli těžkou chvíli nebo myšlenky na sebevraždu a řekli si o pomoc; přesný údaj, kde hledat pomoc, nejlépe služby dostupné nepřetržitě, a údaje pravidelně kontrolovat." }
  - { id: nudz-media-guide, druh: data, nazev: "Media Guide: Mediální zpracování tématu sebevražd; Jazyk a obrazový materiál (karty)", dilo: "Národní ústav duševního zdraví, sebevrazdy.cz (2025)", url: "https://sebevrazdy.cz/materialy/", overeno: 2026-10-08, poznamka: "Čteny dvě karty. Nepopisovat metody, místa ani další podrobnosti; nezjednodušovat příčiny; psát i o překonání sebevražedných myšlenek a krizí; nezobrazovat sebevraždu jako jediné možné řešení; upozorňovat na pomoc, i pro pozůstalé; u známých osobností se vyhnout idealizaci a heroizaci; u dětí a mladistvých je riziko nápodoby výrazně vyšší. Jazyk: místo „spáchat sebevraždu“ a „sebevrah“ raději „vzít si život“, „zemřít vlastní rukou“, „člověk, který si vzal život“. Obraz: žádné způsoby, žádní truchlící pozůstalí. Vzorový rámeček: tísňová linka 112, Linka první psychické pomoci 116 123, Linka bezpečí 116 111 pro děti a studenty do 26 let. Celý Media Guide (40 stran) a metodické doporučení MŠMT k sebevražednému chování (2023) jsem nečetl." }
  - { id: linka-bezpeci, druh: data, nazev: "Linka bezpečí", dilo: "linkabezpeci.cz", url: "https://www.linkabezpeci.cz/", overeno: 2026-10-08, poznamka: "Úvodní stránka 8. 10. 2026: telefon 116 111, „volej kdykoliv a zdarma“, nonstop; pro děti a studenty do 26 let; anonymně; chat denně 9–13 a 15–19 hodin, e-mail pomoc@linkabezpeci.cz. Rodičovská linka 606 021 021." }
  - { id: linka-116123, druh: data, nazev: "Linka první psychické pomoci", dilo: "linkapsychickepomoci.cz", url: "https://www.linkapsychickepomoci.cz/", overeno: 2026-10-08, poznamka: "Úvodní stránka 8. 10. 2026: telefon 116 123, nonstop, zdarma, anonymně; pro dospělé v krizi a jejich blízké." }
  - { id: poradna-vigvam, druh: data, nazev: "Poradna Vigvam", dilo: "poradna-vigvam.cz", url: "https://poradna-vigvam.cz/", overeno: 2026-10-08, poznamka: "Úvodní stránka 8. 10. 2026: pomáhá pozůstalým dětem a rodinám po ztrátě blízkého; telefon +420 606 160 646 v pracovní dny 8–17 hodin, info@poradna-vigvam.cz; materiály pro školy („Mám ve třídě pozůstalého žáka“)." }
  - { id: smb-sk-391, druh: data, nazev: "Doppelherme des Sokrates und Seneca (SK 391)", dilo: "Antikensammlung, Staatliche Museen zu Berlin", url: "https://smb.museum-digital.de/object/13081", overeno: 2026-10-08, poznamka: "Mramor, 2. čtvrtina 3. století n. l., nalezeno v Římě roku 1813 (rok podle záznamu search.smb.museum/object/obj-698814, který četl nástroj WebFetch). Dvojitá herma se jmény SENECA a řecky Sókratés; předloha Senekovy podobizny vznikla podle muzea po polovině 1. století, snad ještě za jeho života. Fotografie muzea: CC BY-NC-SA 4.0 (jen nekomerčně, s uvedením muzea, úpravy pod stejnou licencí). Soubor nestažen." }
  - { id: met-rubens-pseudo-seneca, druh: data, nazev: "Bust of Pseudo-Seneca (1975.1.843)", autor: "Peter Paul Rubens", dilo: "The Metropolitan Museum of Art, New York, Robert Lehman Collection", url: "https://www.metmuseum.org/art/collection/search/459195", overeno: 2026-10-08, poznamka: "Kresba perem a křídou, 1600–1626, podle antické busty, kterou Rubens vlastnil a kterou tehdy měli za Seneku. Public Domain (Open Access), ověřeno v API muzea (isPublicDomain: true). Tvář Senekovi nepatří. Soubor nestažen." }
  - { id: met-lampa, druh: data, nazev: "Terracotta oil lamp (74.51.2162)", dilo: "The Metropolitan Museum of Art, New York", url: "https://www.metmuseum.org/art/collection/search/241715", overeno: 2026-10-08, poznamka: "Římská hliněná olejová lampa, 1. polovina 1. století n. l. Public Domain (Open Access), ověřeno v API muzea. Kandidát pro krok se Senekovou lampou; snímek jsem neviděl. Soubor nestažen." }
  - { id: met-papyrus-dopis, druh: data, nazev: "Papyrus letter in Greek (25.8)", dilo: "The Metropolitan Museum of Art, New York", url: "https://www.metmuseum.org/art/collection/search/251788", overeno: 2026-10-08, poznamka: "Řecký dopis na papyru, počátek 3. století n. l., tedy asi o 500 let mladší než Epikúros. Public Domain (Open Access), ověřeno v API muzea. Kandidát pro vstup cesty; snímek jsem neviděl. Soubor nestažen." }
  - { id: britannica-dio-cassius, druh: encyklopedie, nazev: "Dio Cassius", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Dio-Cassius", overeno: 2026-10-08, poznamka: "Četl nástroj WebFetch. Narozen kolem roku 150, zemřel 235; dějiny Říma v 80 knihách; knihy 36–60 se dochovaly z velké části, mnoho dalšího u Jana Xifilina a Jana Zonara." }
  - { id: britannica-tacitus, druh: encyklopedie, nazev: "Tacitus", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Tacitus-Roman-historian", overeno: 2026-10-08, poznamka: "Četl nástroj WebFetch. Narozen roku 56, zemřel kolem roku 120. Kdy psal Letopisy, stránka v přečtené části neuvádí." }
  - { id: britannica-suetonius, druh: encyklopedie, nazev: "Suetonius", dilo: Encyclopaedia Britannica, url: "https://www.britannica.com/biography/Suetonius", overeno: 2026-10-08, poznamka: "Četl nástroj WebFetch. Narozen roku 69, zemřel po roce 122." }

citaty:
  - id: obrana-38a
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 38a
    cesky: "Život, který nezkoumáme, nestojí za to, aby ho člověk žil."
    original: "ὁ δὲ ἀνεξέταστος βίος οὐ βιωτὸς ἀνθρώπῳ"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad B. Jowetta („the unexamined life is not worth living“)"
    zdroj: platon-obrana
  - id: obrana-21d
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 21d
    cesky: "Tenhle člověk si myslí, že něco ví, a neví. Já nevím, ale ani si nemyslím, že vím."
    original: "οὗτος μὲν οἴεταί τι εἰδέναι οὐκ εἰδώς, ἐγὼ δέ, ὥσπερ οὖν οὐκ οἶδα, οὐδὲ οἴομαι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad B. Jowetta („he knows nothing, and thinks that he knows; I neither know nor think that I know“)"
    zdroj: platon-obrana

  - id: dl-vi-53-diogenes
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 53
    cesky: "Stůl a pohár vidím, Platóne. Stolovost a pohárovost ale nikde."
    original: "τράπεζαν μὲν καὶ κύαθον ὁρῶ· τραπεζότητα δὲ καὶ κυαθότητα οὐδαμῶς"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („Table and cup I see; but your tablehood and cuphood, Plato, I can nowise see“)"
    zdroj: dl-vi-53
  - id: dl-vi-53-platon
    osoba: platon
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 53
    cesky: "Oči, kterými se vidí stůl a pohár, máš. Rozum, kterým se vidí stolovost a pohárovost, nemáš."
    original: "οἷς μὲν γὰρ κύαθος καὶ τράπεζα θεωρεῖται, ὀφθαλμοὺς ἔχεις· ᾧ δὲ τραπεζότης καὶ κυαθότης βλέπεται, νοῦν οὐκ ἔχεις"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („you have the eyes to see the visible table and cup; but not the understanding by which ideal tablehood and cuphood are discerned“)"
    zdroj: dl-vi-53

  # Celek 1 „Jak poznám, co je pravda?“ (docs/podklady/celek-1-pravda.md). Převody jsou vlastní z řeckého textu.
  - id: obrana-36a
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 36a
    cesky: "Kdyby jen třicet hlasů padlo opačně, byl bych osvobozen."
    original: "εἰ τριάκοντα μόναι μετέπεσον τῶν ψήφων, ἀπεπεφεύγη ἄν"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera („if only thirty votes had been cast the other way, I should have been acquitted“)"
    zdroj: platon-obrana
  - id: obrana-36d
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 36d–e
    cesky: "On vám dává pocit, že jste šťastní. Já vás šťastnými dělám."
    original: "ὁ μὲν γὰρ ὑμᾶς ποιεῖ εὐδαίμονας δοκεῖν εἶναι, ἐγὼ δὲ εἶναι"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera („he makes you seem to be happy, whereas I make you happy in reality“); „on“ je vítěz z Olympie"
    zdroj: platon-obrana
  - id: kriton-49c
    osoba: sokrates
    autor: Platón
    dilo: Kritón
    misto: 49c
    cesky: "Nesmíme oplácet křivdu křivdou ani nikomu ubližovat, ať nám udělal cokoli."
    original: "οὔτε ἄρα ἀνταδικεῖν δεῖ οὔτε κακῶς ποιεῖν οὐδένα ἀνθρώπων, οὐδʼ ἂν ὁτιοῦν πάσχῃ ὑπʼ αὐτῶν"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera („we ought neither to requite wrong with wrong nor to do evil to anyone, no matter what he may have done to us“)"
    zdroj: platon-kriton
  - id: faidon-118a
    osoba: sokrates
    autor: Platón
    dilo: Faidón
    misto: 118a
    cesky: "Kritóne, dlužíme Asklépiovi kohouta. Splaťte ho, nezapomeňte."
    original: "ὦ Κρίτων, τῷ Ἀσκληπιῷ ὀφείλομεν ἀλεκτρυόνα· ἀλλὰ ἀπόδοτε καὶ μὴ ἀμελήσητε"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera („Crito, we owe a cock to Aesculapius. Pay it and do not neglect it“)"
    zdroj: platon-faidon
  - id: theaitetos-152a
    osoba: protagoras
    autor: Platón
    dilo: Theaitétos
    misto: 152a (DK 80 B1)
    cesky: "Člověk je měřítkem všech věcí: těch, které jsou, že jsou, a těch, které nejsou, že nejsou."
    original: "πάντων χρημάτων μέτρον ἄνθρωπον εἶναι, τῶν μὲν ὄντων ὡς ἔστι, τῶν δὲ μὴ ὄντων ὡς οὐκ ἔστιν"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; totéž znění u Diogena Laertia IX, 51"
    zdroj: platon-theaitetos
  - id: dl-ix-51
    osoba: protagoras
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: IX, 51 (DK 80 B4)
    cesky: "O bozích nemohu vědět, ani že jsou, ani že nejsou. Mnoho věcí tomu brání: nejasnost té věci i krátkost lidského života."
    original: "περὶ μὲν θεῶν οὐκ ἔχω εἰδέναι οὔθʼ ὡς εἰσίν, οὔθʼ ὡς οὐκ εἰσίν· πολλὰ γὰρ τὰ κωλύοντα εἰδέναι, ἥ τʼ ἀδηλότης καὶ βραχὺς ὢν ὁ βίος τοῦ ἀνθρώπου"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; delší znění u Eusebia („ani jakou mají podobu“) v atlasu nepoužito"
    zdroj: dl-ix-50
  - id: dl-ix-22-parmenides
    osoba: parmenides
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: IX, 22 (DK 28 B7, 3–5)
    cesky: "Ať tě zvyk nenutí jít touto cestou a řídit se slepým okem, hučícím uchem a jazykem. Rozhodni rozumem."
    original: "μηδέ σʼ ἔθος πολύπειρον ὁδὸν κατὰ τήνδε βιάσθω νωμᾶν ἄσκοπον ὄμμα καὶ ἠχήεσσαν ἀκουὴν καὶ γλῶσσαν, κρῖναι δὲ λόγῳ πολύδηριν ἔλεγχον"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; zkráceno (vynecháno „zkušený v mnohém“ a „spornou zkoušku“)"
    zdroj: dl-ix-22
  - id: metafyzika-1011b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Metafyzika
    misto: IV, 7, 1011b26–27
    cesky: "Říct o tom, co je, že není, nebo o tom, co není, že je, je nepravda. Říct o tom, co je, že je, a o tom, co není, že není, je pravda."
    original: "τὸ μὲν γὰρ λέγειν τὸ ὂν μὴ εἶναι ἢ τὸ μὴ ὂν εἶναι ψεῦδος, τὸ δὲ τὸ ὂν εἶναι καὶ τὸ μὴ ὂν μὴ εἶναι ἀληθές"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Tredennicka"
    zdroj: aristoteles-metafyzika
  - id: menon-98a
    osoba: sokrates
    autor: Platón
    dilo: Menón
    misto: 98a
    cesky: "Pravdivé názory nemají velkou cenu, dokud je člověk nepřiváže úvahou o důvodu. Pak se stanou věděním."
    original: "οὐ πολλοῦ ἄξιαί εἰσιν, ἕως ἄν τις αὐτὰς δήσῃ αἰτίας λογισμῷ … ἐπειδὰν δὲ δεθῶσιν, πρῶτον μὲν ἐπιστῆμαι γίγνονται"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad W. R. M. Lamba; zkráceno"
    zdroj: platon-menon

  # Celek 2 „Jak mám žít?“ (docs/podklady/celek-2-jak-zit.md). Převody jsou vlastní z řeckého a latinského textu.
  - id: dl-x-11-syr
    osoba: epikuros
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: X, 11
    cesky: "Pošli mi hrnek sýra, ať si můžu dopřát hostinu, kdykoli budu chtít."
    original: "πέμψον μοι τυροῦ κυθριδίου, ἵνʼ ὅταν βούλωμαι πολυτελεύσασθαι δύνωμαι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („Send me a little pot of cheese, that, when I like, I may fare sumptuously“); úryvek z Epikúrova dopisu"
    zdroj: dl-x-1
  - id: menoikeus-130
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 130 (Diogenés Laertios X, 130)
    cesky: "Soběstačnost je velké dobro. Ne proto, abychom vždycky žili s málem, ale abychom si s málem vystačili, když víc nemáme. Přepych si nejvíc užijí ti, kdo ho nejméně potřebují."
    original: "τὴν αὐτάρκειαν δὲ ἀγαθὸν μέγα νομίζομεν, οὐχ ἵνα πάντως τοῖς ὀλίγοις χρώμεθα, ἀλλʼ ὅπως ἐὰν μὴ ἔχωμεν τὰ πολλά, τοῖς ὀλίγοις ἀρκώμεθα, πεπεισμένοι γνησίως ὅτι ἥδιστα πολυτελείας ἀπολαύουσιν οἱ ἥκιστα ταύτης δεόμενοι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; rozděleno do tří vět, vynecháno „upřímně přesvědčeni“"
    zdroj: dl-x-122
  - id: menoikeus-131-maza
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 131 (Diogenés Laertios X, 131)
    cesky: "Ječná placka a voda dají tu nejvyšší slast, když je jí ten, kdo je potřebuje."
    original: "μᾶζα καὶ ὕδωρ τὴν ἀκροτάτην ἀποδίδωσιν ἡδονήν, ἐπειδὰν ἐνδέων τις αὐτὰ προσενέγκηται"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („bread and water“); μᾶζα je ječná placka, ne pšeničný chléb"
    zdroj: dl-x-122
  - id: menoikeus-131-slast
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 131 (Diogenés Laertios X, 131)
    cesky: "Když říkáme, že cílem je slast, nemyslíme slasti prostopášníků ani ty, které spočívají v požitku, jak si někteří myslí z nevědomosti, z nesouhlasu nebo ze zlé vůle. Myslíme tím nemít bolest v těle a zmatek v duši."
    original: "ὅταν οὖν λέγωμεν ἡδονὴν τέλος ὑπάρχειν, οὐ τὰς τῶν ἀσώτων ἡδονὰς καὶ τὰς ἐν ἀπολαύσει κειμένας λέγομεν, ὥς τινες ἀγνοοῦντες καὶ οὐχ ὁμολογοῦντες ἢ κακῶς ἐκδεχόμενοι νομίζουσιν, ἀλλὰ τὸ μήτε ἀλγεῖν κατὰ σῶμα μήτε ταράττεσθαι κατὰ ψυχήν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse"
    zdroj: dl-x-122
  - id: menoikeus-132
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 132 (Diogenés Laertios X, 132)
    cesky: "Nedá se žít příjemně, aniž by člověk žil rozumně, čestně a spravedlivě. A nedá se žít rozumně, čestně a spravedlivě, aniž by žil příjemně."
    original: "οὐκ ἔστιν ἡδέως ζῆν ἄνευ τοῦ φρονίμως καὶ καλῶς καὶ δικαίως, οὐδὲ φρονίμως καὶ καλῶς καὶ δικαίως ἄνευ τοῦ ἡδέως"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; καλῶς = krásně, čestně; totéž říká Hlavní myšlenka 5"
    zdroj: dl-x-122
  - id: kd-15
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 15 (Diogenés Laertios X, 144)
    cesky: "Bohatství, které žádá příroda, má své meze a snadno se získá. Bohatství, které žádají prázdné představy, se ztrácí do nekonečna."
    original: "ὁ τῆς φύσεως πλοῦτος καὶ ὥρισται καὶ εὐπόριστός ἐστιν· ὁ δὲ τῶν κενῶν δοξῶν εἰς ἄπειρον ἐκπίπτει"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („Nature's wealth at once has its bounds and is easy to procure; but the wealth of vain fancies recedes to an infinite distance“)"
    zdroj: dl-x-139
  - id: kd-27
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 27 (Diogenés Laertios X, 148)
    cesky: "Ze všeho, co moudrost chystá pro šťastný celý život, je zdaleka nejdůležitější získat přátele."
    original: "ὧν ἡ σοφία παρασκευάζεται εἰς τὴν τοῦ ὅλου βίου μακαριότητα, πολὺ μέγιστόν ἐστιν ἡ τῆς φιλίας κτῆσις"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse"
    zdroj: dl-x-139
  - id: vs-52
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "52"
    cesky: "Přátelství tančí kolem celého světa a všem nám ohlašuje: probuďte se ke štěstí!"
    original: "ἡ φιλία περιχορεύει τὴν οἰκουμένην κηρύττουσα δὴ πᾶσιν ἡμῖν ἐγείρεσθαι ἐπὶ τὸν μακαρισμόν"
    preklad:
      druh: vlastni
      podle: "řecký text (P. von der Mühll) a anglický překlad v SEP „Epicurus“ („Friendship goes dancing round the world, announcing to all of us to wake up to happiness“)"
    zdroj: gnomologium-vaticanum
  - id: vs-33
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "33"
    cesky: "Tělo volá: nehladovět, nežíznit, nemrznout. Kdo to má a doufá, že to mít bude, mohl by se o štěstí přít i se samotným Diem."
    original: "σαρκὸς φωνὴ τὸ μὴ πεινῆν, τὸ μὴ διψῆν, τὸ μὴ ῥιγοῦν· ταῦτα γὰρ ἔχων τις καὶ ἐλπίζων ἕξειν κἂν 〈Διὶ〉 ὑπὲρ εὐδαιμονίας μαχέσαιτο"
    preklad:
      druh: vlastni
      podle: "řecký text (P. von der Mühll); jméno Dia je doplněk vydavatelů, rukopis má mezeru"
    zdroj: gnomologium-vaticanum
  - id: vs-68
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "68"
    cesky: "Komu je málo to, co stačí, tomu nestačí nic."
    original: "οὐδὲν ἱκανὸν ᾧ ὀλίγον τὸ ἱκανόν"
    preklad:
      druh: vlastni
      podle: "řecký text (P. von der Mühll); doslova „nic není dost tomu, komu je dost málo“"
    zdroj: gnomologium-vaticanum
  - id: dl-x-119
    osoba: epikuros
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: X, 119
    cesky: "Moudrý nebude žít jako kynik ani žebrat."
    original: "οὐδὲ κυνιεῖν, ὡς ἐν τῇ δευτέρᾳ Περὶ βίων· οὐδὲ πτωχεύσειν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („nor will he turn Cynic … nor will he be a mendicant“); nepřímá řeč podle 2. knihy Epikúrova spisu O způsobech života, zkráceno"
    zdroj: dl-x-117
  - id: seneca-ep-21-10
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 21, 10
    cesky: "Hoste, tady ti bude dobře, tady je nejvyšším dobrem slast."
    original: "Hospes, hic bene manebis, hic summum bonum voluptas est."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); nápis na Epikúrových zahradách, jak ho uvádí Seneca"
    zdroj: seneca-epistulae
  - id: seneca-ep-18-9
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 18, 9
    cesky: "Epikúros, ten učitel slasti, měl určité dny, kdy hlad jen skrovně tišil. Chtěl vidět, jestli mu něco chybí do plné a dokonalé slasti."
    original: "Certos habebat dies ille magister voluptatis Epicurus, quibus maligne famem extingueret, visurus, an aliquid deesset ex plena et consummata voluptate"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); zkráceno"
    zdroj: seneca-epistulae
  - id: vita-beata-13
    osoba: seneca
    autor: Seneca
    dilo: O blaženém životě
    misto: 13, 1
    cesky: "Myslím si, že Epikúros učí věci svaté a správné, a když se k nim přiblížíš, dokonce přísné."
    original: "in ea quidem ipse sententia sum … sancta Epicurum et recta praecipere et si propius accesseris tristia"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); tristia = vážné, přísné; vynecháno „řeknu to proti vůli našich“"
    zdroj: seneca-vita-beata
  - id: vita-beata-26
    osoba: seneca
    autor: Seneca
    dilo: O blaženém životě
    misto: 26, 1
    cesky: "U moudrého slouží bohatství jemu, u hlupáka bohatství vládne."
    original: "diuitiae enim apud sapientem uirum in seruitute sunt, apud stultum in imperio"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); doslova „u moudrého muže je bohatství v otroctví, u hlupáka u vlády“"
    zdroj: seneca-vita-beata
  - id: dl-vi-37
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 37
    cesky: "Dítě mě porazilo ve skromnosti."
    original: "παιδίον με νενίκηκεν εὐτελείᾳ"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („A child has beaten me in plainness of living“)"
    zdroj: dl-vi-20
  - id: dl-vi-44
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 44
    cesky: "Bohové dali lidem snadný život. Lidé ho ale nevidí, protože hledají medové koláčky, vonné masti a podobné věci."
    original: "τὸν τῶν ἀνθρώπων βίον ῥᾴδιον ὑπὸ τῶν θεῶν δεδόσθαι, ἀποκεκρύφθαι δʼ αὐτῶν ζητούντων μελίπηκτα καὶ μύρα καὶ τὰ παραπλήσια"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; v originále nepřímá řeč („často volal, že…“)"
    zdroj: dl-vi-41
  - id: dl-vi-104
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 104
    cesky: "Bohům je vlastní nic nepotřebovat. Těm, kdo se bohům podobají, potřebovat málo."
    original: "θεῶν μὲν ἴδιον εἶναι μηδενὸς δεῖσθαι, τῶν δὲ θεοῖς ὁμοίων τὸ ὀλίγων χρῄζειν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; v přehledu kynické nauky jako Diogenova slova, nepřímá řeč"
    zdroj: dl-vi-104
  - id: dl-vi-71
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 71
    cesky: "Samo pohrdání slastí je nejslastnější, když se v něm člověk vycvičí."
    original: "αὐτὴ τῆς ἡδονῆς ἡ καταφρόνησις ἡδυτάτη προμελετηθεῖσα"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; z oddílu VI, 70–73, který je podle Hickse vložkou z jiného pramene"
    zdroj: dl-vi-69
  - id: dl-vi-41
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 41
    cesky: "Hledám člověka."
    original: "ἄνθρωπον ζητῶ"
    preklad:
      druh: vlastni
      podle: "řecký text; za bílého dne s rozsvícenou lampou; „poctivého člověka“ v řečtině není"
    zdroj: dl-vi-41
  - id: dl-vi-63
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 63
    cesky: "Jsem občan světa."
    original: "κοσμοπολίτης"
    preklad:
      druh: vlastni
      podle: "řecký text; odpověď na otázku, odkud je, řecky jediné slovo"
    zdroj: dl-vi-41
  - id: plutarchos-alexandr-14
    osoba: diogenes
    autor: Plútarchos
    dilo: Alexandr
    misto: "14"
    cesky: "Ustup mi trochu ze slunce."
    original: "μικρὸν … ἀπὸ τοῦ ἡλίου μετάστηθι"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad B. Perrin („stand a little out of my sun“); Diogenés Laertios VI, 38 má „nestíněj mi“"
    zdroj: plutarchos-alexandr
  - id: etika-1098a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: I, 7, 1098a18–20
    cesky: "Jedna vlaštovka jaro nedělá, ani jeden den. A tak ani jeden den nebo krátký čas neudělá člověka blaženým a šťastným."
    original: "μία γὰρ χελιδὼν ἔαρ οὐ ποιεῖ, οὐδὲ μία ἡμέρα· οὕτω δὲ οὐδὲ μακάριον καὶ εὐδαίμονα μία ἡμέρα οὐδʼ ὀλίγος χρόνος"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika
  - id: etika-1155a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VIII, 1, 1155a5–6
    cesky: "Bez přátel by nikdo nechtěl žít, i kdyby měl všechna ostatní dobra."
    original: "ἄνευ γὰρ φίλων οὐδεὶς ἕλοιτʼ ἂν ζῆν, ἔχων τὰ λοιπὰ ἀγαθὰ πάντα"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika
  - id: dl-vi-40
    osoba: diogenes
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: VI, 40
    cesky: "Tohle je Platónův člověk."
    original: "οὗτός ἐστιν ὁ Πλάτωνος ἄνθρωπος"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse („Here is Plato's man“); Diogenés přinesl oškubaného kohouta do Platónovy školy"
    zdroj: dl-vi-41

