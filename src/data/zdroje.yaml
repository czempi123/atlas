  # Primární texty
  - { id: platon-obrana, druh: pramen, nazev: "Obrana Sókratova", autor: Platón, dilo: "Apology, angl. B. Jowett (Project Gutenberg 1656)", url: "https://www.gutenberg.org/files/1656/1656-h/1656-h.htm", overeno: 2026-10-01, poznamka: "20e–23b věštba a zkoušení moudrých (21a Chairefón, 21d politik), 23c mladí ho napodobují, 24b–c obžaloba, 28e Potidaia, Amfipolis, Délion, 33d Kritón, 36a třicet hlasů, 36b–37a prytaneum, 37c–38a proč ne vyhnanství, 38a nezkoumaný život, 38b třicet min a ručitelé. 1. 10. 2026 ověřeno i v řeckém textu (Burnet) a překladu H. N. Fowlera (PerseusDL, tlg0059.tlg002)." }
  - { id: platon-kriton, druh: pramen, nazev: "Kritón", autor: Platón, dilo: "Crito, angl. B. Jowett (Project Gutenberg 1657)", url: "https://www.gutenberg.org/files/1657/1657-h/1657-h.htm", overeno: 2026-10-01, poznamka: "Kritón u spícího Sókrata (43a–b); přemlouvá k útěku (44b–46a); neoplácet křivdu křivdou (49a–e); řeč Zákonů (50a–54d); z Athén vycházel jen do války a jednou na Isthmus (52b); u soudu mohl navrhnout vyhnanství (52c); sedmdesát let (52e). 1. 10. 2026 ověřeno i v řeckém textu a překladu H. N. Fowlera (PerseusDL, tlg0059.tlg003)." }
  - { id: platon-faidon, druh: pramen, nazev: "Faidón", autor: Platón, dilo: "Phaedo, angl. B. Jowett (Project Gutenberg 1658)", url: "https://www.gutenberg.org/files/1658/1658-h/1658-h.htm", overeno: 2026-10-01, poznamka: "Loď na Délos (58a–c); Platón byl nemocný (59b); Xanthippa (60a); rozloučení, žalářník (116b–d); poslední den a smrt (116e–118a), kohout pro Asklépia (118a); Kritón je přítomen. 1. 10. 2026 ověřeno i v řeckém textu a překladu H. N. Fowlera (PerseusDL, tlg0059.tlg004)." }
