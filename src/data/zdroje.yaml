  - { id: lukianos-nevzdelanec, druh: pramen, nazev: "Proti nevzdělanci, který kupuje mnoho knih 13", autor: Lúkianos, dilo: "Adversus indoctum, řecky a angl. A. M. Harmon (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0062/tlg028/tlg0062.tlg028.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Kdosi „za našich časů“ koupil hliněnou lampu stoika Epiktéta za tři tisíce drachem." }
  - { id: suetonius-domitianus, druh: pramen, nazev: "Domitianus 10", autor: Suetonius, dilo: "De vita Caesarum, lat. M. Ihm (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1348/abo022/phi1348.abo022.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Při procesu s Juniem Rustikem vykázal Domitianus všechny filozofy z Města a z Itálie (10, 3); rok neuvádí." }
  - { id: tacitus-agricola, druh: pramen, nazev: "Agricola 2 a 44–45", autor: Tacitus, dilo: "De vita Iulii Agricolae, lat. H. Furneaux (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1351/phi001/phi1351.phi001.perseus-lat1.xml", overeno: 2026-10-02, poznamka: "Vyhnání učitelů moudrosti (2); Agricola zemřel 23. srpna za konzulů Collegy a Priscina a popravy Helvidia, Rustika a Senekióna už neviděl (44–45). Rok 93 podle běžné datace konzulů, seznam jsem neověřoval." }
  - { id: plinius-epistulae, druh: pramen, nazev: "Dopisy III, 11", autor: Plinius mladší, dilo: "Epistulae (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1318/phi001/phi1318.phi001.perseus-lat1.xml", overeno: 2026-10-02, poznamka: "Když byli filozofové vykázáni z Města, byl Plinius praetorem; Senekió, Rusticus a Helvidius popraveni." }
