  # Celek 3 „Co mám ve svých rukou?“ (docs/podklady/celek-3-co-mam-v-rukou.md): řecké a latinské texty z PerseusDL a First1KGreek.
  - { id: epiktetos-rozpravy, druh: pramen, nazev: "Rozpravy", autor: Epiktétos, dilo: "Dissertationes ab Arriano digestae, řecky H. Schenkl (Teubner 1916), angl. G. Long (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0557/tlg001/tlg0557.tlg001.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Arriánův úvodní dopis (zapisoval, co slyšel, jako poznámky pro sebe); co je v naší moci, vítr, „nohu mi spoutáš“ (I, 1); Helvidius Priscus, vousy (I, 2); Musonius (I, 7, 32; I, 9, 29–30); chromý stařec (I, 16, 20); lampa (I, 18, 15–16; I, 29, 21); Epafroditos a švec (I, 19, 19–22; I, 26, 11–12); hra s míčem (II, 5); Níkopolis a zemětřesení (II, 6, 20); role (II, 10); ne jako socha (III, 2, 4); cvičení od svítání (III, 3, 14–16); škola jako ordinace (III, 23, 30); o svobodě (IV, 1). 8. 10. 2026 (celek 6): člověk jako divák a vykladač; „k čemu jste se narodili“ (I, 6, 19–25)." }
  - { id: epiktetos-rukojet, druh: pramen, nazev: "Rukojeť", autor: Epiktétos, dilo: "Encheiridion, řecky H. Schenkl (Teubner 1916), angl. G. Long (PerseusDL)", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0557/tlg002/tlg0557.tlg002.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Co je a není v naší moci, cvičení s dojmem (1); touha a odpor (2); věci a soudy (5); kulhání je překážkou nohy, ne vůle (9); kdo chce být svobodný (14); herec (17); urážka (20); povinnosti a vztahy (30); dvě ucha (43)." }
  - { id: marcus-hovory, druh: pramen, nazev: "Hovory k sobě", autor: Marcus Aurelius, dilo: "Ad se ipsum, řecky J. H. Leopold (Teubner 1908), PerseusDL", url: "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0562/tlg001/tlg0562.tlg001.perseus-grc2.xml", overeno: 2026-10-02, poznamka: "Rusticus a Epiktétovy zápisky (I, 7); místní údaje „u Kvádů na Granui“ (konec knihy I) a „v Carnuntu“ (konec knihy II); ráno (II, 1; V, 1); Epiktétos jmenován (IV, 41; VII, 19; XI, 34 a 36), opsaná místa XI, 33–38; soudy (IV, 3; IV, 7; VIII, 47); pevnost (VIII, 48); pohled shora (VII, 48; IX, 30; XII, 24); VI, 6; VI, 30; VI, 41; VI, 44; VII, 7; VIII, 59; IX, 5; IX, 7; X, 16. 8. 10. 2026 (celek 6): II, 11; nikdo neztrácí jiný život než ten, který žije (II, 14); II, 17; nežij, jako bys měl žít deset tisíc let (IV, 17); VII, 56; IX, 3; tři dějství jsou celá hra (XII, 36)." }
  - { id: origenes-kelsos, druh: pramen, nazev: "Proti Kelsovi VII, 53–54", autor: Órigenés, dilo: "Contra Celsum, řecky P. Koetschau (1899), First1KGreek", url: "https://github.com/OpenGreekAndLatin/First1KGreek/blob/master/data/tlg2042/tlg001/tlg2042.tlg001.perseus-grc1.xml", overeno: 2026-10-02, poznamka: "Kelsos: pán kroutil Epiktétovi nohou, ten s pousmáním řekl „zlomíš ji“ a potom „neříkal jsem, že ji zlomíš?“; pán není jmenován. Tradovaný příběh: Kelsos psal asi roku 178, Órigenés asi 248." }
  - { id: gellius-epiktetos, druh: pramen, nazev: "Attické noci I, 2; II, 18; XV, 11; XVII, 19; XIX, 1", autor: Aulus Gellius, dilo: "Noctes Atticae, lat. a angl. J. C. Rolfe (PerseusDL)", url: "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi1254/phi001/phi1254.phi001.perseus-lat2.xml", overeno: 2026-10-02, poznamka: "Héródés Attikos: Epiktétos, největší ze stoiků (I, 2, 6); Epiktétos byl otrok (II, 18, 10); za Domitiana byli filozofové usnesením senátu vyhnáni z Říma a Itálie a Epiktétos odešel do Níkopole (XV, 11, 3–5, bez roku); „snášej a zdrž se“ podle Favorina (XVII, 19, 5–6); z páté knihy Rozprav: dojmy nejsou v naší moci, souhlas ano, i moudrý zbledne (XIX, 1, 14–21)." }
