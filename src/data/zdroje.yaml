    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 1, 1103a32–b2
    cesky: "Co máme dělat, až se to naučíme, to se učíme tím, že to děláme: stavěním se lidé stávají staviteli a hrou na kitharu kitharisty. Stejně tak se spravedlivým jednáním stáváme spravedlivými, uměřeným uměřenými a statečným statečnými."
    original: "ἃ γὰρ δεῖ μαθόντας ποιεῖν, ταῦτα ποιοῦντες μανθάνομεν, οἷον οἰκοδομοῦντες οἰκοδόμοι γίνονται καὶ κιθαρίζοντες κιθαρισταί· οὕτω δὴ καὶ τὰ μὲν δίκαια πράττοντες δίκαιοι γινόμεθα, τὰ δὲ σώφρονα σώφρονες, τὰ δʼ ἀνδρεῖα ἀνδρεῖοι"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („men become builders by building houses, harpers by playing on the harp“)"
    zdroj: aristoteles-etika-ii
  - id: etika-1103b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 2, 1103b27–29
    cesky: "Nezkoumáme proto, abychom věděli, co je ctnost, ale abychom se stali dobrými. Jinak by to zkoumání nebylo k ničemu."
    original: "οὐ γὰρ ἵνα εἰδῶμεν τί ἐστιν ἡ ἀρετὴ σκεπτόμεθα, ἀλλʼ ἵνʼ ἀγαθοὶ γενώμεθα, ἐπεὶ οὐδὲν ἂν ἦν ὄφελος αὐτῆς"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-ii
  - id: etika-1105b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 4, 1105b12–16
    cesky: "Většina lidí to ale nedělá. Utíkají se k řečem a myslí si, že filozofují a že se tak stanou dobrými. Dělají totéž co nemocní, kteří lékaře pozorně poslouchají, ale nedělají nic z toho, co jim nařídil."
    original: "ἀλλʼ οἱ πολλοὶ ταῦτα μὲν οὐ πράττουσιν, ἐπὶ δὲ τὸν λόγον καταφεύγοντες οἴονται φιλοσοφεῖν καὶ οὕτως ἔσεσθαι σπουδαῖοι, ὅμοιόν τι ποιοῦντες τοῖς κάμνουσιν, οἳ τῶν ἰατρῶν ἀκούουσι μὲν ἐπιμελῶς, ποιοῦσι δʼ οὐδὲν τῶν προσταττομένων"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („like invalids who listen carefully to what the doctor says, but entirely neglect to carry out his prescriptions“)"
    zdroj: aristoteles-etika-ii
  - id: etika-1106a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 6, 1106a17–19
    cesky: "Ctnost oka dělá dobrým oko i jeho práci: díky ctnosti oka dobře vidíme."
    original: "ἡ τοῦ ὀφθαλμοῦ ἀρετὴ τόν τε ὀφθαλμὸν σπουδαῖον ποιεῖ καὶ τὸ ἔργον αὐτοῦ· τῇ γὰρ τοῦ ὀφθαλμοῦ ἀρετῇ εὖ ὁρῶμεν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama, který tu ἀρετή překládá „excellence“; hned potom má Aristotelés ctnost koně: dobře běží, nese jezdce a obstojí před nepřítelem"
    zdroj: aristoteles-etika-ii
  - id: etika-1106b-milon
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 6, 1106b1–5
    cesky: "Je-li pro někoho deset min jídla mnoho a dvě málo, trenér mu proto ještě nepředepíše šest. I to je pro toho, kdo je má dostat, možná mnoho, nebo málo: pro Milóna málo, pro toho, kdo s cvičením začíná, mnoho. Stejně je to s během a se zápasem."
    original: "οὐ γὰρ εἴ τῳ δέκα μναῖ φαγεῖν πολὺ δύο δὲ ὀλίγον, ὁ ἀλείπτης ἓξ μνᾶς προστάξει· ἔστι γὰρ ἴσως καὶ τοῦτο πολὺ τῷ ληψομένῳ ἢ ὀλίγον· Μίλωνι μὲν γὰρ ὀλίγον, τῷ δὲ ἀρχομένῳ τῶν γυμνασίων πολύ. ὁμοίως ἐπὶ δρόμου καὶ πάλης"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; příklad je o dávce jídla, ve studentském textu ho raději vyprávět na běhu a zápase (podkladový list, Koho může řeč o návyku zranit)"
    zdroj: aristoteles-etika-ii
  - id: etika-1106b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 6, 1106b21–23
    cesky: "Ale tehdy, kdy se má, nad čím se má, vůči komu se má, kvůli čemu se má a jak se má: to je střed a to nejlepší, a právě to je vlastní ctnosti."
    original: "τὸ δʼ ὅτε δεῖ καὶ ἐφʼ οἷς καὶ πρὸς οὓς καὶ οὗ ἕνεκα καὶ ὡς δεῖ, μέσον τε καὶ ἄριστον, ὅπερ ἐστὶ τῆς ἀρετῆς"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; řeč je o tom, kdy se bát, odvážit, toužit, hněvat se a litovat (1106b18–21), věta před citátem to musí říct"
    zdroj: aristoteles-etika-ii
  - id: etika-1107a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 6, 1106b36–1107a2
    cesky: "Ctnost je tedy ustálený stav, ze kterého člověk volí. Spočívá ve středu vzhledem k nám, a ten určuje rozum, a to tak, jak by ho určil rozumný člověk."
    original: "ἔστιν ἄρα ἡ ἀρετὴ ἕξις προαιρετική, ἐν μεσότητι οὖσα τῇ πρὸς ἡμᾶς, ὡρισμένῃ λόγῳ καὶ ᾧ ἂν ὁ φρόνιμος ὁρίσειεν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („a settled disposition of the mind determining the choice of actions and emotions, consisting essentially in the observance of the mean relative to us“)"
    zdroj: aristoteles-etika-ii
  - id: etika-1109a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 9, 1109a26–29
    cesky: "Rozhněvat se dokáže každý a je to snadné, stejně jako dát nebo utratit peníze. Ale komu, kolik, kdy, kvůli čemu a jak: to už nedokáže každý a snadné to není."
    original: "τὸ μὲν ὀργισθῆναι παντὸς καὶ ῥᾴδιον, καὶ τὸ δοῦναι ἀργύριον καὶ δαπανῆσαι· τὸ δʼ ᾧ καὶ ὅσον καὶ ὅτε καὶ οὗ ἕνεκα καὶ ὥς, οὐκέτι παντὸς οὐδὲ ῥᾴδιον"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-ii
  - id: etika-1109b-drevo
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 9, 1109b4–7
    cesky: "Musíme se táhnout na opačnou stranu. Když se od chyby hodně vzdálíme, dojdeme ke středu, jako to dělají ti, kdo rovnají pokřivené dřevo."
    original: "εἰς τοὐναντίον δʼ ἑαυτοὺς ἀφέλκειν δεῖ· πολὺ γὰρ ἀπάγοντες τοῦ ἁμαρτάνειν εἰς τὸ μέσον ἥξομεν, ὅπερ οἱ τὰ διεστραμμένα τῶν ξύλων ὀρθοῦντες ποιοῦσιν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; předchází rada všimnout si, k čemu má člověk sám sklon (1109b1–4)"
    zdroj: aristoteles-etika-ii
  - id: etika-1109b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: II, 9, 1109b20–23
    cesky: "Po jakou mez a jak moc se člověk smí odchýlit, než si zaslouží výtku, není snadné vymezit slovy. Takové věci záleží na jednotlivých případech a rozhoduje o nich vnímání."
    original: "ὁ δὲ μέχρι τίνος καὶ ἐπὶ πόσον ψεκτὸς οὐ ῥᾴδιον τῷ λόγῳ ἀφορίσαι … τὰ δὲ τοιαῦτα ἐν τοῖς καθʼ ἕκαστα, καὶ ἐν τῇ αἰσθήσει ἡ κρίσις"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („the decision lies with perception“); vypuštěna vsuvka, že totéž platí o všem, co se vnímá"
    zdroj: aristoteles-etika-ii
  - id: etika-1095a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: I, 3, 1095a2–8
    cesky: "Mladý člověk proto není vhodný posluchač výkladů o obci: nemá zkušenost s tím, co se v životě dělá. Nezáleží ale na tom, jestli je někdo mladý věkem, nebo nezralý povahou. Nechybí mu čas, chyba je v tom, že žije podle vášně."
    original: "διὸ τῆς πολιτικῆς οὐκ ἔστιν οἰκεῖος ἀκροατὴς ὁ νέος· ἄπειρος γὰρ τῶν κατὰ τὸν βίον πράξεων … διαφέρει δʼ οὐδὲν νέος τὴν ἡλικίαν ἢ τὸ ἦθος νεαρός· οὐ γὰρ παρὰ τὸν χρόνον ἡ ἔλλειψις, ἀλλὰ διὰ τὸ κατὰ πάθος ζῆν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; zkráceno o větu, že takovému posluchači je vědění k ničemu, protože cílem není poznání, ale jednání (1095a4–6)"
    zdroj: aristoteles-etika-ii
  - id: etika-1179b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: X, 9, 1179b2–3
    cesky: "Ani u ctnosti tedy nestačí vědět. Musíme se snažit ji mít a užívat."
    original: "οὐδὲ δὴ περὶ ἀρετῆς ἱκανὸν τὸ εἰδέναι, ἀλλʼ ἔχειν καὶ χρῆσθαι πειρατέον"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („to know what virtue is is not enough“)"
    zdroj: aristoteles-etika-ii
  - id: etika-1179b-reci
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: X, 9, 1179b4–6
    cesky: "Kdyby řeči samy stačily na to, aby z lidí udělaly slušné lidi, právem by vynášely mnoho velkých odměn."
    original: "εἰ μὲν οὖν ἦσαν οἱ λόγοι αὐτάρκεις πρὸς τὸ ποιῆσαι ἐπιεικεῖς, πολλοὺς ἂν μισθοὺς καὶ μεγάλους δικαίως ἔφερον"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; vypuštěno „jak říká Theognis“"
    zdroj: aristoteles-etika-ii
  - id: etika-1179b-puda
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: X, 9, 1179b23–26
    cesky: "Řeč a poučení nejspíš nemají sílu u každého. Duši posluchače je třeba napřed zvyky připravit, aby se správně radovala a správně nenáviděla, jako půdu, která má živit semeno."
    original: "ὁ δὲ λόγος καὶ ἡ διδαχὴ μή ποτʼ οὐκ ἐν ἅπασιν ἰσχύει, ἀλλὰ δεῖ προδιειργάσθαι τοῖς ἔθεσι τὴν τοῦ ἀκροατοῦ ψυχὴν πρὸς τὸ καλῶς χαίρειν καὶ μισεῖν, ὥσπερ γῆν τὴν θρέψουσαν τὸ σπέρμα"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-ii
  - id: etika-1145b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 2, 1145b23–28
    cesky: "Bylo by přece podivné, myslel si Sókratés, kdyby v člověku bylo vědění a vládlo mu něco jiného a vláčelo vědění sem a tam jako otroka. Sókratés proti té představě bojoval vůbec, jako by neovládnutí nebylo: nikdo prý nejedná proti tomu, co má za nejlepší, leda z nevědomosti. Tenhle výklad je ale ve zjevném rozporu s tím, co vidíme."
    original: "δεινὸν γὰρ ἐπιστήμης ἐνούσης, ὡς ᾤετο Σωκράτης, ἄλλο τι κρατεῖν καὶ περιέλκειν αὐτὴν ὥσπερ ἀνδράποδον. Σωκράτης μὲν γὰρ ὅλως ἐμάχετο πρὸς τὸν λόγον ὡς οὐκ οὔσης ἀκρασίας· οὐθένα γὰρ ὑπολαμβάνοντα πράττειν παρὰ τὸ βέλτιστον, ἀλλὰ διʼ ἄγνοιαν. οὗτος μὲν οὖν ὁ λόγος ἀμφισβητεῖ τοῖς φαινομένοις ἐναργῶς"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („this theory is manifestly at variance with plain facts“); τὰ φαινόμενα lze číst i jako „to, co se obecně soudí“. Věta pokračuje: je třeba zkoumat, o jaký druh nevědomosti jde (1145b28–29)"
    zdroj: aristoteles-etika-vii
  - id: etika-1147a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 3, 1147a21–22
    cesky: "Ti, kdo se něco právě naučili, umějí řadit slova za sebe, ale ještě to nevědí. Musí to s nimi srůst, a to chce čas."
    original: "οἱ πρῶτον μαθόντες συνείρουσι μὲν τοὺς λόγους, ἴσασι δʼ οὔπω· δεῖ γὰρ συμφυῆναι, τοῦτο δὲ χρόνου δεῖται"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („knowledge has to become part of the tissue of the mind, and this takes time“)"
    zdroj: aristoteles-etika-vii
  - id: etika-1147b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 3, 1147b14–17
    cesky: "A zdá se, že vychází to, oč šlo Sókratovi: ten stav nenastává, když je přítomno to, co se pokládá za vědění v pravém smyslu, a takové vědění vášeň sem a tam nevláčí. Vláčí jen to, které stojí na vnímání."
    original: "καὶ ἔοικεν ὃ ἐζήτει Σωκράτης συμβαίνειν· οὐ γὰρ τῆς κυρίως ἐπιστήμης εἶναι δοκούσης παρούσης γίνεται τὸ πάθος, οὐδʼ αὕτη περιέλκεται διὰ τὸ πάθος, ἀλλὰ τῆς αἰσθητικῆς"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („we do seem to be led to the conclusion which Socrates sought to establish“)"
    zdroj: aristoteles-etika-vii
  - id: etika-1149a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 6, 1149a25–29
    cesky: "Hněv, zdá se, rozum trochu poslouchá, ale přeslechne ho. Je jako ukvapení sluhové, kteří vyběhnou, než vyslechnou všechno, co se jim říká, a příkaz pak spletou. A jako psi, kteří se rozštěkají, sotva se něco ozve, dřív než se podívají, jestli to není přítel."
    original: "ἔοικε γὰρ ὁ θυμὸς ἀκούειν μέν τι τοῦ λόγου, παρακούειν δέ, καθάπερ οἱ ταχεῖς τῶν διακόνων, οἳ πρὶν ἀκοῦσαι πᾶν τὸ λεγόμενον ἐκθέουσιν, εἶτα ἁμαρτάνουσι τῆς προστάξεως, καὶ οἱ κύνες, πρὶν σκέψασθαι εἰ φίλος, ἂν μόνον ψοφήσῃ, ὑλακτοῦσιν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama („watch-dogs bark at a mere knock at the door, without waiting to see if it is a friend“)"
    zdroj: aristoteles-etika-vii
  - id: etika-1152a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 10, 1152a20–21
    cesky: "Člověk, který se neovládne, se podobá obci, která odhlasuje všechno, co má, a má dobré zákony, ale žádným se neřídí."
    original: "ἔοικε δὴ ὁ ἀκρατὴς πόλει ἣ ψηφίζεται μὲν ἅπαντα τὰ δέοντα καὶ νόμους ἔχει σπουδαίους, χρῆται δὲ οὐδέν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama; špatný člověk je naopak obec, která se zákony řídí, ale má je špatné (1152a24)"
    zdroj: aristoteles-etika-vii
  - id: protagoras-352b
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 352b–c
    cesky: "Myslí si o vědění zkrátka totéž co o otrokovi: že ho všechno ostatní vláčí sem a tam."
    original: "ἀτεχνῶς διανοούμενοι περὶ τῆς ἐπιστήμης ὥσπερ περὶ ἀνδραπόδου, περιελκομένης ὑπὸ τῶν ἄλλων ἁπάντων"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba („just what they have about a slave, that it may be dragged about by any other force“); Sókratés tak líčí mínění většiny, se kterým nesouhlasí"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-352c
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 352c
    cesky: "Nebo je vědění něco krásného, co dokáže člověku vládnout? A kdo pozná, co je dobré a co zlé, toho už nic nepřemůže, aby dělal něco jiného, než mu vědění velí?"
    original: "ἢ καλόν τε εἶναι ἡ ἐπιστήμη καὶ οἷον ἄρχειν τοῦ ἀνθρώπου, καὶ ἐάνπερ γιγνώσκῃ τις τἀγαθὰ καὶ τὰ κακά, μὴ ἂν κρατηθῆναι ὑπὸ μηδενὸς ὥστε ἄλλʼ ἄττα πράττειν ἢ ἃν ἐπιστήμη κελεύῃ"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; Sókratova otázka Prótagorovi, který přitaká (352c–d)"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-352d
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 352d
    cesky: "Většina lidí mně ani tobě nevěří. Říkají, že mnozí vědí, co je nejlepší, a nechtějí to dělat, ačkoli by mohli, a dělají něco jiného."
    original: "οἱ πολλοὶ τῶν ἀνθρώπων ἐμοί τε καὶ σοὶ οὐ πείθονται, ἀλλὰ πολλούς φασι γιγνώσκοντας τὰ βέλτιστα οὐκ ἐθέλειν πράττειν, ἐξὸν αὐτοῖς, ἀλλὰ ἄλλα πράττειν"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; Sókratés mluví k Prótagorovi"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-356c
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 356c
    cesky: "Nezdají se vám tytéž velikosti zblízka větší a zdálky menší?"
    original: "φαίνεται ὑμῖν τῇ ὄψει τὰ αὐτὰ μεγέθη ἐγγύθεν μὲν μείζω, πόρρωθεν δὲ ἐλάττω· ἢ οὔ;"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; otázka, kterou Sókratés klade domnělé většině"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-358c
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 358c
    cesky: "Podléhat sám sobě není nic jiného než nevědomost a vládnout sám sobě nic jiného než moudrost."
    original: "οὐδὲ τὸ ἥττω εἶναι αὑτοῦ ἄλλο τι τοῦτʼ ἐστὶν ἢ ἀμαθία, οὐδὲ κρείττω ἑαυτοῦ ἄλλο τι ἢ σοφία"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; závěr je vyvozen z předpokladu „je-li příjemné dobrem“ (358b), se kterým sofisté souhlasili"
    zdroj: platon-protagoras-vedeni
  - id: protagoras-358d
    osoba: sokrates
    autor: Platón
    dilo: Prótagorás
    misto: 358c–d
    cesky: "Nikdo nejde dobrovolně za zlem, ani za tím, co za zlé pokládá. Není to, jak se zdá, v lidské přirozenosti."
    original: "ἐπί γε τὰ κακὰ οὐδεὶς ἑκὼν ἔρχεται οὐδὲ ἐπὶ ἃ οἴεται κακὰ εἶναι, οὐδʼ ἔστι τοῦτο, ὡς ἔοικεν, ἐν ἀνθρώπου φύσει"
    preklad:
      druh: vlastni
      podle: "řecký text (J. Burnet) a anglický překlad W. R. M. Lamba; v řečtině otázka („není tomu tak, že…?“), se kterou všichni přítomní souhlasí"
    zdroj: platon-protagoras-vedeni
  - id: metafyzika-981a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Metafyzika
    misto: I, 1, 981a18–20
    cesky: "Kdo léčí, neuzdravuje člověka, leda mimochodem, ale Kalliu nebo Sókrata nebo někoho dalšího, kdo má takhle jméno a kdo je také člověk."
    original: "οὐ γὰρ ἄνθρωπον ὑγιάζει ὁ ἰατρεύων ἀλλʼ ἢ κατὰ συμβεβηκός, ἀλλὰ Καλλίαν ἢ Σωκράτην ἢ τῶν ἄλλων τινὰ τῶν οὕτω λεγομένων ᾧ συμβέβηκεν ἀνθρώπῳ εἶναι"
    preklad:
      druh: vlastni
      podle: "řecký text (Ross) a anglický překlad H. Tredennicka; hned potom Aristotelés dodává, že moudřejší je přesto ten, kdo zná příčinu (981a24–30)"
    zdroj: aristoteles-metafyzika-ideje
  - id: casti-zivocichu-i-5
    osoba: aristoteles
    autor: Aristotelés
    dilo: O částech živočichů
    misto: I, 5
    cesky: "Nemáme se proto dětinsky štítit zkoumání méně vznešených živočichů. Ve všem přírodním je totiž něco podivuhodného."
    original: "διὸ δεῖ μὴ δυσχεραίνειν παιδικῶς τὴν περὶ τῶν ἀτιμοτέρων ζῴων ἐπίσκεψιν. ἐν πᾶσι γὰρ τοῖς φυσικοῖς ἔνεστί τι θαυμαστόν"
    preklad:
      druh: vlastni
      podle: "řecký text (B. Langkavel) a anglická věta citovaná v SEP („we should not be childishly disgusted at the examination of the less valuable animals“); běžně se cituje jako 645a15–17, ve vydání číslování není"
    zdroj: aristoteles-casti-zivocichu
  - id: zivocichove-vi-3
    osoba: aristoteles
    autor: Aristotelés
    dilo: Zkoumání živočichů
    misto: VI, 3
    cesky: "Srdce je vidět v bílku jako krvavá tečka. Ta tečka poskakuje a hýbe se, jako by byla živá."
    original: "ὅσον στιγμὴ αἱματίνη ἐν τῷ λευκῷ ἡ καρδία. τοῦτο δὲ τὸ σημεῖον πηδᾷ καὶ κινεῖται ὥσπερ ἔμψυχον"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bekker, vydání 1837), bez srovnání s publikovaným překladem; řeč je o slepičím vejci po třech dnech a nocích; Bekkerovo číslování ve vydání není"
    zdroj: aristoteles-zivocichove
  - id: zivocichove-viii-2
    osoba: aristoteles
    autor: Aristotelés
    dilo: Zkoumání živočichů
    misto: VIII, 2
    cesky: "Žádného z nich není snadné zařadit jen mezi vodní živočichy, ani jen mezi suchozemské."
    original: "οὐ γὰρ ῥᾴδιον οὔτʼ ἔνυδρον θεῖναι μόνον τούτων ἕκαστον οὔτε πεζόν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bekker, vydání 1837), bez srovnání s publikovaným překladem; řeč je o delfínovi a ostatních kytovcích; Bekkerovo číslování ve vydání není"
    zdroj: aristoteles-zivocichove
  - id: fyzika-ii-3-proc
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: II, 3
    cesky: "Myslíme si, že věc známe, teprve když u ní pochopíme, proč je."
    original: "εἰδέναι δὲ οὐ πρότερον οἰόμεθα ἕκαστον πρὶν ἂν λάβωμεν τὸ διὰ τί περὶ ἕκαστον"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; běžně se cituje jako 194b18–20, ve vydání číslování není"
    zdroj: aristoteles-fyzika
  - id: fyzika-ii-3-prochazka
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: II, 3
    cesky: "Proč se prochází? Řekneme: ‚Aby byl zdravý.‘ A když to řekneme, myslíme si, že jsme udali příčinu."
    original: "διὰ τί γὰρ περιπατεῖ; φαμέν “ἵνα ὑγιαίνῃ”, καὶ εἰπόντες οὕτως οἰόμεθα ἀποδεδωκέναι τὸ αἴτιον"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; běžně se cituje jako 194b33–35, ve vydání číslování není"
    zdroj: aristoteles-fyzika
  - id: fyzika-ii-8
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: II, 8
    cesky: "Co brání tomu, aby příroda nedělala nic kvůli něčemu ani proto, že je to tak lepší? Aby to bylo, jako když Zeus prší: ne proto, aby rostlo obilí, ale z nutnosti."
    original: "τί κωλύει τὴν φύσιν μὴ ἕνεκά του ποιεῖν μηδʼ ὅτι βέλτιον, ἀλλʼ ὥσπερ ὕει ὁ Ζεὺς οὐχ ὅπως τὸν σῖτον αὐξήσῃ, ἀλλʼ ἐξ ἀνάγκης"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; Aristotelés tu formuluje námitku, kterou vzápětí odmítá; běžně se cituje jako 198b16–19, ve vydání číslování není"
    zdroj: aristoteles-fyzika
  - id: fyzika-ii-8-prezilo
    osoba: aristoteles
    autor: Aristotelés
    dilo: Fyzika
    misto: II, 8
    cesky: "Kde se všechno sešlo tak, jako by to vzniklo kvůli něčemu, tam to přežilo, protože se to samo od sebe složilo vhodně. Co se tak nesložilo, zahynulo a hyne."
    original: "ὅπου μὲν οὖν ἅπαντα συνέβη ὥσπερ κἂν εἰ ἕνεκά του ἐγίγνετο, ταῦτα μὲν ἐσώθη ἀπὸ τοῦ αὐτομάτου συστάντα ἐπιτηδείως· ὅσα δὲ μὴ οὕτως, ἀπώλετο καὶ ἀπόλλυται"
    preklad:
      druh: vlastni
      podle: "řecký text (W. D. Ross), bez srovnání s publikovaným překladem; pokračování téže námitky s odkazem na Empedoklea; Aristotelés ji odmítá („takhle to být nemůže“); běžně se cituje jako 198b29–32"
    zdroj: aristoteles-fyzika
  - id: analytiky-i-1
    osoba: aristoteles
    autor: Aristotelés
    dilo: První analytiky
    misto: I, 1
    cesky: "Úsudek je řeč, ve které se něco stanoví a z toho, že to platí, nutně vyplyne něco jiného."
    original: "συλλογισμὸς δέ ἐστι λόγος ἐν ᾧ τεθέντων τινῶν ἕτερόν τι τῶν κειμένων ἐξ ἀνάγκης συμβαίνει τῷ ταῦτα εἶναι"
