    dilo: Dopisy Luciliovi
    misto: 8, 3
    cesky: "Správnou cestu, kterou jsem poznal pozdě a unavený blouděním, ukazuji druhým."
    original: "Rectum iter, quod sero cognovi et lassus errando, aliis monstro."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-8-2
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 8, 2
    cesky: "Pracuji pro ty, kdo přijdou po nás. Pro ně zapisuji, co by jim mohlo být k užitku."
    original: "posterorum negotium ago; illis aliqua, quae possint prodesse, conscribo"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-75-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 75, 1
    cesky: "Chci, aby mé dopisy byly takové, jaká by byla má řeč, kdybychom spolu seděli nebo se procházeli: nenucené a lehké."
    original: "Qualis sermo meus esset, si una sederemus aut ambularemus, inlaboratus et facilis, tales esse epistulas meas volo"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); zkráceno"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-12-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 12, 1
    cesky: "Kam se otočím, vidím důkazy svého stáří."
    original: "Quocumque me verti, argumenta senectutis meae video."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-78-2
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 78, 2
    cesky: "Poručil jsem si tedy žít. Někdy je totiž statečné i žít."
    original: "Itaque imperavi mihi, ut viverem. Aliquando enim et vivere fortiter facere est."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); o nemoci v mládí, kdy ho při životě držel ohled na starého otce"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-47-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 47, 1
    cesky: "‚Jsou to otroci.‘ Ne, lidé. ‚Jsou to otroci.‘ Ne, ti, kdo s tebou bydlí pod jednou střechou. ‚Jsou to otroci.‘ Ne, přátelé v nízkém postavení. ‚Jsou to otroci.‘ Ne, otroci stejně jako ty, když si uvědomíš, že osud má nad vámi oběma stejnou moc."
    original: "Servi sunt. Immo homines. Servi sunt. Immo contubernales. Servi sunt. Immo humiles amici. Servi sunt. Immo conservi, si cogitaveris tantundem in utrosque licere fortunae."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); contubernales = kdo sdílejí stan nebo dům, conservi = spoluotroci"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-47-10
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 47, 10
    cesky: "Pomysli, že ten, komu říkáš svůj otrok, vzešel ze stejných semen jako ty, má nad sebou stejné nebe, stejně dýchá, stejně žije a stejně umírá."
    original: "Vis tu cogitare istum, quem servum tuum vocas, ex isdem seminibus ortum eodem frui caelo, aeque spirare, aeque vivere, aeque mori!"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-47-11
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 47, 11
    cesky: "Žij s tím, kdo je níž než ty, tak, jak bys chtěl, aby s tebou žil ten, kdo je výš."
    original: "sic cum inferiore vivas, quemadmodum tecum superiorem velis vivere"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ira-ii-29
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: II, 29, 1
    cesky: "Největší lék na hněv je odklad."
    original: "Maximum remedium irae mora est."
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); podobně III, 12, 4: „maximum remedium irae dilatio est“"
    zdroj: seneca-de-ira
  - id: seneca-ira-iii-36
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: III, 36, 3
    cesky: "Když odnesou světlo a žena, která můj zvyk už zná, zmlkne, projdu celý svůj den a znovu přeměřím, co jsem udělal a řekl. Nic před sebou neskrývám, nic nepřecházím."
    original: "Cum sublatum e conspectu lumen est et conticuit uxor moris iam mei conscia, totum diem meum scrutor factaque ac dicta mea remetior; nihil mihi ipse abscondo, nihil transeo."
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library)"
    zdroj: seneca-de-ira
  - id: seneca-ira-iii-36-otazky
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: III, 36, 1
    cesky: "Kterou svou chybu jsi dnes vyléčil? Které špatnosti ses postavil? V čem jsi lepší?"
    original: "quod hodie malum tuum sanasti? Cui vitio obstitisti? Qua parte melior es?"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); otázky, které si podle Seneky večer kladl filozof Sextius; věta před citátem to musí říct"
    zdroj: seneca-de-ira
  - id: seneca-ira-iii-36-odpoustim
    osoba: seneca
    autor: Seneca
    dilo: O hněvu
    misto: III, 36, 3
    cesky: "Hleď, ať to už neuděláš. Teď ti odpouštím."
    original: "vide ne istud amplius facias, nunc tibi ignosco"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); tak Seneca večer mluví sám k sobě"
    zdroj: seneca-de-ira
  - id: seneca-ep-28-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 28, 1
    cesky: "Musíš změnit mysl, ne oblohu."
    original: "Animum debes mutare, non caelum."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-ep-7-3
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 7, 3
    cesky: "Vracím se lakotnější, ctižádostivější, rozmařilejší, ba i krutější a nelidštější, protože jsem byl mezi lidmi."
    original: "Avarior redeo, ambitiosior, luxuriosior, immo vero crudelior et inhumanior, quia inter homines fui."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-zivot
  - id: seneca-clem-i-1
    osoba: seneca
    autor: Seneca
    dilo: O mírnosti
    misto: I, 1, 1
    cesky: "Rozhodl jsem se psát o mírnosti, císaři Nerone, abych ti byl jaksi zrcadlem a ukázal ti tebe samého."
    original: "Scribere de clementia, Nero Caesar, institui, ut quodam modo speculi vice fungerer et te tibi ostenderem"
    preklad:
      druh: vlastni
      podle: "latinský text (The Latin Library); zkráceno"
    zdroj: seneca-clementia
  # Cesta 8: Epikúros
  - id: dl-x-22-den
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Ídomeneovi
    misto: Diogenés Laertios X, 22
    cesky: "Píšu vám tohle ve šťastný a zároveň poslední den svého života."
    original: "Τὴν μακαρίαν ἄγοντες καὶ ἅμα τελευταίαν ἡμέραν τοῦ βίου ἐγράφομεν ὑμῖν ταυτί."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); μακαρία = blažený; Cicero (O nejvyšším dobru a zlu II, 96) uvádí týž dopis s adresátem Hermarchem"
    zdroj: dl-x-22
  - id: dl-x-22-radost
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Ídomeneovi
    misto: Diogenés Laertios X, 22
    cesky: "Proti tomu všemu se ale stavěla radost v duši ze vzpomínky na úvahy, které jsme spolu vedli."
    original: "ἀντιπαρετάττετο δὲ πᾶσι τούτοις τὸ κατὰ ψυχὴν χαῖρον ἐπὶ τῇ τῶν γεγονότων ἡμῖν διαλογισμῶν μνήμῃ"
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); διαλογισμοί jsou úvahy i rozhovory: Hicks má „past conversations“, Cicero „rationum inventorumque nostrorum“ (naše úvahy a objevy)"
    zdroj: dl-x-22
  - id: dl-x-22-deti
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Ídomeneovi
    misto: Diogenés Laertios X, 22
    cesky: "A ty se postarej o Métrodórovy děti, jak se sluší na to, jak jsi od mládí stál při mně i při filozofii."
    original: "σὺ δʼ ἀξίως τῆς ἐκ μειρακίου παραστάσεως πρὸς ἐμὲ καὶ φιλοσοφίαν ἐπιμελοῦ τῶν παίδων Μητροδώρου."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-22
  - id: menoikeus-124
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 124 (Diogenés Laertios X, 124)
    cesky: "Zvykej si na myšlenku, že smrt se nás netýká. Všechno dobré i zlé je totiž ve vnímání, a smrt je ztráta vnímání."
    original: "Συνέθιζε δὲ ἐν τῷ νομίζειν μηδὲν πρὸς ἡμᾶς εἶναι τὸν θάνατον· ἐπεὶ πᾶν ἀγαθὸν καὶ κακὸν ἐν αἰσθήσει· στέρησις δέ ἐστιν αἰσθήσεως ὁ θάνατος."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); συνέθιζε = zvykej si: Epikúros žádá cvik, ne jen souhlas"
    zdroj: dl-x-122
  - id: menoikeus-124-touha
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 124 (Diogenés Laertios X, 124)
    cesky: "Kdo správně pochopí, že smrt se nás netýká, tomu je smrtelný život k radosti: nepřidá mu to nekonečný čas, ale zbaví ho to touhy po nesmrtelnosti."
    original: "ὅθεν γνῶσις ὀρθὴ τοῦ μηθὲν εἶναι πρὸς ἡμᾶς τὸν θάνατον ἀπολαυστὸν ποιεῖ τὸ τῆς ζωῆς θνητόν, οὐκ ἄπειρον προστιθεῖσα χρόνον ἀλλὰ τὸν τῆς ἀθανασίας ἀφελομένη πόθον."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); volněji"
    zdroj: dl-x-122
  - id: menoikeus-125
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 125 (Diogenés Laertios X, 125)
    cesky: "Smrt, to nejděsivější ze všeho zlého, se nás tedy netýká: dokud jsme tu my, smrt tu není, a když je tu smrt, nejsme tu už my."
    original: "τὸ φρικωδέστατον οὖν τῶν κακῶν ὁ θάνατος οὐθὲν πρὸς ἡμᾶς, ἐπειδή περ ὅταν μὲν ἡμεῖς ὦμεν, ὁ θάνατος οὐ πάρεστιν· ὅταν δʼ ὁ θάνατος παρῇ, τόθʼ ἡμεῖς οὐκ ἐσμέν."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-122
  - id: menoikeus-125-cekani
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 125 (Diogenés Laertios X, 125)
    cesky: "Co netrápí, když je to tady, trápí naprázdno, když se na to čeká."
    original: "ὃ γὰρ παρὸν οὐκ ἐνοχλεῖ, προσδοκώμενον κενῶς λυπεῖ."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-122
  - id: menoikeus-126
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 126 (Diogenés Laertios X, 126)
    cesky: "Jako si z jídla nevybírá za každou cenu to nejvíc, ale to nejlepší, tak ani z času nesklízí ten nejdelší, ale ten nejpříjemnější."
    original: "ὥσπερ δὲ τὸ σιτίον οὐ τὸ πλεῖον πάντως ἀλλὰ τὸ ἥδιστον αἱρεῖται, οὕτω καὶ χρόνον οὐ τὸν μήκιστον ἀλλὰ τὸν ἥδιστον καρπίζεται."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks); podmětem je moudrý člověk"
    zdroj: dl-x-122
  - id: kd-2
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 2 (Diogenés Laertios X, 139)
    cesky: "Smrt se nás netýká. Co se rozpadlo, nevnímá, a co nevnímá, se nás netýká."
    original: "Ὁ θάνατος οὐδὲν πρὸς ἡμᾶς· τὸ γὰρ διαλυθὲν ἀναισθητεῖ· τὸ δʼ ἀναισθητοῦν οὐδὲν πρὸς ἡμᾶς."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-139
  - id: kd-19
    osoba: epikuros
    autor: Epikúros
    dilo: Hlavní myšlenky
    misto: 19 (Diogenés Laertios X, 145)
    cesky: "Nekonečný čas v sobě má stejně slasti jako čas omezený, když člověk její meze změří rozumem."
    original: "Ὁ ἄπειρος χρόνος ἴσην ἔχει τὴν ἡδονὴν καὶ ὁ πεπερασμένος, ἐάν τις αὐτῆς τὰ πέρατα καταμετρήσῃ τῷ λογισμῷ."
    preklad:
      druh: vlastni
      podle: "řecký text (Hicks)"
    zdroj: dl-x-139
  - id: vs-31
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "31"
    cesky: "Proti všemu ostatnímu si lze opatřit bezpečí. Kvůli smrti ale my lidé všichni bydlíme ve městě bez hradeb."
    original: "Πρὸς μὲν τἆλλα δυνατὸν ἀσφάλειαν πορίσασθαι, χάριν δὲ θανάτου πάντες ἄνθρωποι πόλιν ἀτείχιστον οἰκοῦμεν."
    preklad:
      druh: vlastni
      podle: "řecký text (von der Mühll); sbírka výroků Epikúrovy školy, u jednotlivých vět není autorství jisté"
    zdroj: gnomologium-vaticanum
  - id: vs-66
    osoba: epikuros
    autor: Epikúros
    dilo: Vatikánské výroky
    misto: "66"
    cesky: "Soucit s přáteli neprojevujme nářkem, ale tím, že se o ně staráme."
    original: "Συμπαθῶμεν τοῖς φίλοις οὐ θρηνοῦντες ἀλλὰ φροντίζοντες."
    preklad:
      druh: vlastni
      podle: "řecký text (von der Mühll)"
    zdroj: gnomologium-vaticanum
  # Cesta 8: Lucretius
  - id: lucretius-iii-832
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 832–841
    cesky: "Jako jsme v čase, který minul, necítili nic zlého, když se ze všech stran valili do boje Punové … tak až nebudeme … nebude se nám, kteří tu tehdy nebudeme, moci stát vůbec nic a nic námi nepohne."
    original: "et vel ut ante acto nihil tempore sensimus aegri, ad confligendum venientibus undique Poenis … sic, ubi non erimus … scilicet haud nobis quicquam, qui non erimus tum, accidere omnino poterit sensumque movere"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); zkráceno, próza místo veršů"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-972
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 972–977
    cesky: "Ohlédni se, jak nic pro nás neznamenal ten odvěký čas, který uplynul, než jsme se narodili. V něm nám příroda nastavuje zrcadlo času, který přijde po naší smrti. Je tam vidět něco hrozného? Zdá se tam něco smutné? Není to klidnější než každý spánek?"
    original: "respice item quam nil ad nos ante acta vetustas temporis aeterni fuerit, quam nascimur ante. hoc igitur speculum nobis natura futuri temporis exponit post mortem denique nostram. numquid ibi horribile apparet, num triste videtur quicquam, non omni somno securius exstat?"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); próza místo veršů"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-894
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 894–899
    cesky: "„Už tě nepřivítá veselý dům ani nejlepší z žen, už ti nepoběží naproti milé děti, aby ti ukradly první polibek, a nedotknou se tvého srdce tichou něhou. … Ubohému ti jediný nepřátelský den,“ říkají, „vzal všechny dary života.“"
    original: "'Iam iam non domus accipiet te laeta neque uxor optima, nec dulces occurrent oscula nati praeripere et tacita pectus dulcedine tangent. … misero misere' aiunt 'omnia ademit una dies infesta tibi tot praemia vitae.'"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); slova truchlících, která básník uvádí a pak odmítá; věta před citátem to musí říct"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-900
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 900–901
    cesky: "Nedodají k tomu: „A po ničem z toho se ti už nestýská.“"
    original: "illud in his rebus non addunt 'nec tibi earum iam desiderium rerum super insidet una.'"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL)"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-938
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 938
    cesky: "Proč neodejdeš jako host, který se života nasytil?"
    original: "cur non ut plenus vitae conviva recedis"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL); otázku klade zosobněná Příroda člověku, kterému byl život milý; verš 939 ho oslovuje „blázne“"
    zdroj: lucretius-iii-830
  - id: lucretius-iii-971
    osoba: lucretius
    autor: Lucretius
    dilo: O přírodě
    misto: III, 971
    cesky: "Život nedostává nikdo do vlastnictví, všichni jen do užívání."
    original: "vitaque mancipio nulli datur, omnibus usu"
    preklad:
      druh: vlastni
      podle: "latinský text (PerseusDL)"
    zdroj: lucretius-iii-830
  # Cesta 8: Seneca
  - id: seneca-ep-54-3
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 54, 3
    cesky: "Ani když jsem se dusil, nepřestal jsem hledat úlevu v radostných a statečných myšlenkách."
    original: "Ego vero et in ipsa suffocatione non desii cogitationibus laetis ac fortibus adquiescere."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-54-4
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 54, 4
    cesky: "Smrt je nebýt. Jaké to je, už vím: po mně bude to, co bylo přede mnou."
    original: "Mors est non esse; id quale sit, iam scio. Hoc erit post me, quod ante me fuit."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-54-5
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 54, 5
    cesky: "Neřekl bys, že je vrchol hlouposti myslet si, že lampě je hůř, když zhasla, než předtím, než ji rozsvítili? I nás zhášejí a rozsvěcují. V čase mezi tím něco zakoušíme; z obou stran je hluboký klid."
    original: "Rogo, non stultissimum dicas, si quis existimet lucernae peius esse, cum extincta est, quam antequam accenditur? Nos quoque et extinguimur et accendimur; medio illo tempore aliquid patimur, utrimque vero alta securitas est."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-24-18
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 24, 18
    cesky: "Smrt nás buď stráví, nebo svlékne. Jestli nás propustí, zbývá nám to lepší a břemeno je pryč. Jestli nás stráví, nezbývá nic: dobré i zlé je odklizeno stejně."
    original: "Mors nos aut consumit aut exuit. Emissis meliora restant onere detracto, consumptis nihil restat, bona pariter malaque submota sunt."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-24-20
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 24, 20
    cesky: "Umíráme každý den. Každý den nám totiž ubývá kus života, a i když rosteme, život se krátí."
    original: "Cotidie morimur; cotidie enim demitur aliqua pars vitae, et tunc quoque, cum crescimus, vita decrescit."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); Seneca tu Luciliovi připomíná jeho vlastní úvahu (24, 19)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-24-20-hodiny
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 24, 20
    cesky: "Vodní hodiny nevyprázdní poslední kapka, ale všechno, co odteklo před ní. Stejně tak poslední hodina, ve které přestáváme být, smrt nedělá sama; jen ji dokončuje."
    original: "Quemadmodum clepsydram non extremum stillicidium exhaurit, sed quicquid ante defluxit, sic ultima hora, qua esse desinimus, non sola mortem facit, sed sola consummat"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-26-6
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 26, 6
    cesky: "Řeč je totiž odvážná i u těch nejbojácnějších."
    original: "Est enim oratio etiam timidissimis audax."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); o sobě: jestli svá statečná slova myslí vážně, ukáže až konec"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-30-7
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 30, 7
    cesky: "Vím, že se to říkalo často a často se to ještě říkat bude. Nepomáhalo mi to ale tolik, když jsem to četl, ani když jsem to slyšel od lidí, kteří tvrdili, že se není čeho bát, a sami byli od toho, čeho se bát nemáme, daleko."
    original: "Haec ego scio et saepe dicta et saepe dicenda, sed neque cum legerem, aeque mihi profuerunt, neque cum audirem iis dicentibus, qui negabant timenda, a quorum metu aberant"
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); o argumentu, že co nebudeme cítit, se nemáme bát"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-30-17
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 30, 17
    cesky: "Nebojíme se smrti, ale myšlenky na smrt."
    original: "Non mortem timemus, sed cogitationem mortis."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-61-4
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 61, 4
    cesky: "O tom, jestli jsme žili dost, nerozhodují roky ani dny, ale mysl."
    original: "Ut satis vixerimus, nec anni nec dies faciunt, sed animus."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-63-1
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 63, 1
    cesky: "Když ztratíme přítele, ať oči nejsou suché, ale ať ani nepřetékají."
    original: "Nec sicci sint oculi amisso amico nec fluant."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-63-7
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 63, 7
    cesky: "Měl jsem je, jako bych je měl ztratit; ztratil jsem je, jako bych je pořád měl."
    original: "Habui enim illos tamquam amissurus, amisi tamquam habeam."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); o zemřelých přátelích"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-63-14
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 63, 14
    cesky: "Tohle ti píšu já, který jsem svého drahého Annaea Serena oplakával tak bez míry, že patřím, ač o to nejméně stojím, k příkladům lidí, které bolest přemohla."
    original: "Haec tibi scribo is, qui Annaeum Serenum, carissimum mihi, tam inmodice flevi, ut, quod minime velim, inter exempla sim eorum, quos dolor vicit."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-99-4
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 99, 4
    cesky: "Čas, který minul, je náš, a nic není na bezpečnějším místě než to, co bylo."
    original: "Nostrum est, quod praeteriit, tempus nec quicquam est loco tutiore quam quod fuit."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere)"
    zdroj: seneca-epistulae-smrt
  - id: seneca-ep-99-15
    osoba: seneca
    autor: Seneca
    dilo: Dopisy Luciliovi
    misto: 99, 15
    cesky: "To není ctnost, to je nelidskost: dívat se na pohřeb svých blízkých stejnýma očima jako na ně samé a nepohnout se, když nám je berou."
    original: "Inhumanitas est ista, non virtus, funera suorum isdem oculis, quibus ipsos, videre nec commoveri ad primam familiarium divulsionem."
    preklad:
      druh: vlastni
      podle: "latinský text (Gummere); pořadí vět obráceno; dopis jinak otce, kterému zemřel malý syn, tvrdě kárá"
    zdroj: seneca-epistulae-smrt
  # Cesta 8: Cicero, Sókratés, Platón, Aristotelés
  - id: cicero-fin-ii-94
    osoba: cicero
    autor: Cicero
    dilo: O nejvyšším dobru a zlu
    misto: II, 94
    cesky: "Vidím přece bolesti velké a přitom pořádně dlouhé."
    original: "video enim et magnos et eosdem bene longinquos dolores"
    preklad:
      druh: vlastni
      podle: "latinský text (Schiche); proti Epikúrově větě, že velká bolest je krátká a dlouhá lehká"
    zdroj: cicero-de-finibus-ii
  - id: cicero-fin-ii-98
    osoba: cicero
    autor: Cicero
    dilo: O nejvyšším dobru a zlu
    misto: II, 98
    cesky: "Slyším hlas filozofa, Epikúre, ale zapomněl jsi, co bys měl říkat."
    original: "Audio equidem philosophi vocem, Epicure, sed quid tibi dicendum sit oblitus es."
    preklad:
      druh: vlastni
      podle: "latinský text (Schiche); o Epikúrově dopise z posledního dne"
    zdroj: cicero-de-finibus-ii
  - id: obrana-29a
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 29a
    cesky: "Bát se smrti, mužové, není nic jiného než zdát se moudrým a nebýt: je to zdát se, že vím, co nevím."
    original: "τὸ γάρ τοι θάνατον δεδιέναι, ὦ ἄνδρες, οὐδὲν ἄλλο ἐστὶν ἢ δοκεῖν σοφὸν εἶναι μὴ ὄντα· δοκεῖν γὰρ εἰδέναι ἐστὶν ἃ οὐκ οἶδεν."
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera"
    zdroj: platon-obrana
  - id: obrana-40c
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 40c
    cesky: "Být mrtvý je jedno z dvojího: buď je to, jako by mrtvý nebyl nic a nic nevnímal, nebo je to, jak se vypráví, jakási změna a přestěhování duše odsud na jiné místo."
    original: "δυοῖν γὰρ θάτερόν ἐστιν τὸ τεθνάναι· ἢ γὰρ οἷον μηδὲν εἶναι μηδὲ αἴσθησιν μηδεμίαν μηδενὸς ἔχειν τὸν τεθνεῶτα, ἢ κατὰ τὰ λεγόμενα μεταβολή τις τυγχάνει οὖσα καὶ μετοίκησις τῇ ψυχῇ τοῦ τόπου τοῦ ἐνθένδε εἰς ἄλλον τόπον."
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; Sókratés mluví k soudcům, kteří hlasovali pro něj"
    zdroj: platon-obrana
  - id: obrana-41d
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 41d
    cesky: "Dobrému člověku se nemůže stát nic zlého, ani když žije, ani když zemře."
    original: "οὐκ ἔστιν ἀνδρὶ ἀγαθῷ κακὸν οὐδὲν οὔτε ζῶντι οὔτε τελευτήσαντι"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera"
    zdroj: platon-obrana
  - id: obrana-42a
    osoba: sokrates
    autor: Platón
    dilo: Obrana Sókratova
    misto: 42a
    cesky: "Ale už je čas jít: já půjdu zemřít, vy žít. Kdo z nás jde za lepším, neví nikdo kromě boha."
    original: "ἀλλὰ γὰρ ἤδη ὥρα ἀπιέναι, ἐμοὶ μὲν ἀποθανουμένῳ, ὑμῖν δὲ βιωσομένοις· ὁπότεροι δὲ ἡμῶν ἔρχονται ἐπὶ ἄμεινον πρᾶγμα, ἄδηλον παντὶ πλὴν ἢ τῷ θεῷ."
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; poslední věta Obrany"
    zdroj: platon-obrana
  - id: faidon-107c
    osoba: platon
    autor: Platón
    dilo: Faidón
    misto: 107c
    cesky: "Je-li duše nesmrtelná, potřebuje péči nejen pro ten čas, kterému říkáme život, ale pro čas všechen."
    original: "εἴπερ ἡ ψυχὴ ἀθάνατος, ἐπιμελείας δὴ δεῖται οὐχ ὑπὲρ τοῦ χρόνου τούτου μόνον ἐν ᾧ καλοῦμεν τὸ ζῆν, ἀλλ’ ὑπὲρ τοῦ παντός"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Sókratés v posledním dni života"
    zdroj: platon-faidon-perseus
  - id: faidon-114d
    osoba: platon
    autor: Platón
    dilo: Faidón
    misto: 114d
    cesky: "Tvrdit, že je to přesně tak, jak jsem to vylíčil, se na rozumného člověka nesluší. Že je to ale s našimi dušemi takhle nebo nějak podobně, když se přece duše ukazuje jako nesmrtelná, tomu se podle mě sluší věřit a stojí za to se toho odvážit. Je to krásné riziko."
    original: "τὸ μὲν οὖν ταῦτα διισχυρίσασθαι οὕτως ἔχειν ὡς ἐγὼ διελήλυθα, οὐ πρέπει νοῦν ἔχοντι ἀνδρί· ὅτι μέντοι ἢ ταῦτ᾽ ἐστὶν ἢ τοιαῦτ’ ἄττα περὶ τὰς ψυχὰς ἡμῶν καὶ τὰς οἰκήσεις, ἐπείπερ ἀθάνατόν γε ἡ ψυχὴ φαίνεται οὖσα, τοῦτο καὶ πρέπειν μοι δοκεῖ καὶ ἄξιον κινδυνεῦσαι οἰομένῳ οὕτως ἔχειν — καλὸς γὰρ ὁ κίνδυνος"
    preklad:
      druh: vlastni
      podle: "řecký text (Burnet) a anglický překlad H. N. Fowlera; mluví Sókratés po vyprávění o osudu duší; „a jejich příbytky“ vynecháno"
    zdroj: platon-faidon-perseus
  - id: etika-1115a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: III, 6, 1115a26–27
    cesky: "Nejstrašnější je smrt. Je to totiž hranice a zdá se, že pro mrtvého už není nic dobré ani zlé."
    original: "φοβερώτατον δʼ ὁ θάνατος· πέρας γάρ, καὶ οὐδὲν ἔτι τῷ τεθνεῶτι δοκεῖ οὔτʼ ἀγαθὸν οὔτε κακὸν εἶναι."
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater); z výkladu o statečnosti"
    zdroj: aristoteles-etika-smrt
  - id: etika-1117b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: III, 9, 1117b10–13
    cesky: "Čím úplnější je jeho ctnost a čím je šťastnější, tím víc ho smrt bude bolet. Takovému člověku totiž nejvíc stojí za to žít, a on ví, že přichází o největší dobra."
    original: "ὅσῳ ἂν μᾶλλον τὴν ἀρετὴν ἔχῃ πᾶσαν καὶ εὐδαιμονέστερος ᾖ, μᾶλλον ἐπὶ τῷ θανάτῳ λυπήσεται· τῷ τοιούτῳ γὰρ μάλιστα ζῆν ἄξιον, καὶ οὗτος μεγίστων ἀγαθῶν ἀποστερεῖται εἰδώς"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater); řeč je o statečném člověku v boji"
    zdroj: aristoteles-etika-smrt
  - id: etika-1177b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: X, 7, 1177b31–34
    cesky: "Nemáme poslouchat ty, kdo radí, ať člověk myslí na lidské věci a smrtelník na smrtelné. Máme se, nakolik to jde, stávat nesmrtelnými a dělat všechno pro to, abychom žili podle toho nejlepšího, co v nás je."
    original: "οὐ χρὴ δὲ κατὰ τοὺς παραινοῦντας ἀνθρώπινα φρονεῖν ἄνθρωπον ὄντα οὐδὲ θνητὰ τὸν θνητόν, ἀλλʼ ἐφʼ ὅσον ἐνδέχεται ἀθανατίζειν καὶ πάντα ποιεῖν πρὸς τὸ ζῆν κατὰ τὸ κράτιστον τῶν ἐν αὑτῷ"
    preklad:
      druh: vlastni
      podle: "řecký text (Bywater)"
    zdroj: aristoteles-etika-smrt
  # Velká otázka 3: Epiktétos a Marcus Aurelius
  - id: rozpravy-i-6-19
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 6, 19 a 22
    cesky: "Člověka ale bůh uvedl na svět jako diváka sebe i svých děl, a nejen jako diváka, ale i jako jejich vykladače. … Hleďte tedy, ať nezemřete, aniž jste to viděli."
    original: "τὸν δʼ ἄνθρωπον θεατὴν εἰσήγαγεν αὐτοῦ τε καὶ τῶν ἔργων τῶν αὐτοῦ, καὶ οὐ μόνον θεατήν, ἀλλὰ καὶ ἐξηγητὴν αὐτῶν. … ὁρᾶτε οὖν, μὴ ἀθέατοι τούτων ἀποθάνητε."
    preklad:
      druh: vlastni
      podle: "řecký text (Schenkl) a anglický překlad z PerseusDL; podmět „bůh“ doplněn ze souvislosti"
    zdroj: epiktetos-rozpravy
  - id: hovory-iv-17
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: IV, 17
    cesky: "Nežij, jako bys měl žít deset tisíc let. Nevyhnutelné nad tebou visí. Dokud žiješ, dokud to jde, staň se dobrým."
    original: "Μὴ ὡς μύρια μέλλων ἔτη ζῆν. τὸ χρεὼν ἐπήρτηται· ἕως ζῇς, ἕως ἔξεστιν, ἀγαθὸς γενοῦ."
    preklad:
      druh: vlastni
      podle: "řecký text (Leopold)"
    zdroj: marcus-hovory
  - id: hovory-ii-14
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: II, 14
    cesky: "Nikdo neztrácí jiný život než ten, který právě žije, a nežije jiný než ten, který ztrácí."
    original: "οὐδεὶς ἄλλον ἀποβάλλει βίον ἢ τοῦτον ὃν ζῇ, οὐδὲ ἄλλον ζῇ ἢ ὃν ἀποβάλλει"
    preklad:
      druh: vlastni
      podle: "řecký text (Leopold)"
    zdroj: marcus-hovory
  - id: hovory-xii-36
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: XII, 36
    cesky: "V životě jsou ale i tři dějství celá hra. … Odejdi tedy smířený: i ten, kdo tě propouští, je smířený."
    original: "ἐν μέντοι τῷ βίῳ τὰ τρία ὅλον τὸ δρᾶμά ἐστι. … ἄπιθι οὖν ἵλεως· καὶ γὰρ ὁ ἀπολύων ἵλεως."
    preklad:
      druh: vlastni
      podle: "řecký text (Leopold); poslední zápis Hovorů: herec namítá, že neodehrál pět dějství, jen tři"
    zdroj: marcus-hovory

