    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: V, 16
    cesky: "Ať mě pohřbí kdekoli, tam ať přenesou a uloží i kosti Pýthiady, jak sama nařídila."
    original: "ὅπου δʼ ἂν ποιῶνται τὴν ταφήν, ἐνταῦθα καὶ τὰ Πυθιάδος ὀστᾶ ἀνελόντας θεῖναι, ὥσπερ αὐτὴ προσέταξεν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse; ze závěti, jak ji uvádí Diogenés Laertios"
    zdroj: dl-v
  - id: dl-v-18
    osoba: aristoteles
    autor: Diogenés Laertios
    dilo: Životy filozofů
    misto: V, 18
    cesky: "Kořeny vzdělání jsou hořké, ale ovoce sladké."
    original: "τῆς παιδείας ἔφη τὰς μὲν ῥίζας εἶναι πικράς, τὸν δὲ καρπὸν γλυκύν"
