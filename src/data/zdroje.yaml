  # Celek 3 „Co mám ve svých rukou?“ (docs/podklady/celek-3-co-mam-v-rukou.md). Vlastní převody z řeckého a latinského textu.
  # προαίρεσις převádím jako „vůle“, φαντασία jako „dojem“, τὰ ἐφʼ ἡμῖν jako „co je v naší moci“.
  - id: origenes-vii-53
    osoba: epiktetos
    autor: Órigenés
    dilo: Proti Kelsovi
    misto: VII, 53
    cesky: "Neříkal jsem, že ji zlomíš?"
    original: "οὐκ ἔλεγον … ὅτι κατάσσεις;"
    preklad:
      druh: vlastni
      podle: "řecký text (P. Koetschau); tradovaný výrok, který Epiktétovi připisuje Kelsos; řecky přítomný čas („lámeš ji“)"
    zdroj: origenes-kelsos
  - id: rukojet-1
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "1"
    cesky: "Některé věci jsou v naší moci a jiné ne. V naší moci je úsudek, podnět k činu, touha a odpor: jedním slovem všechno, co je naše dílo. V naší moci není tělo, majetek, pověst a úřady: jedním slovem všechno, co naše dílo není."
    original: "τῶν ὄντων τὰ μέν ἐστιν ἐφʼ ἡμῖν, τὰ δὲ οὐκ ἐφʼ ἡμῖν. ἐφʼ ἡμῖν μὲν ὑπόληψις, ὁρμή, ὄρεξις, ἔκκλισις καὶ ἑνὶ λόγῳ ὅσα ἡμέτερα ἔργα· οὐκ ἐφʼ ἡμῖν δὲ τὸ σῶμα, ἡ κτῆσις, δόξαι, ἀρχαὶ καὶ ἑνὶ λόγῳ ὅσα οὐχ ἡμέτερα ἔργα."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-1-5
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "1"
    cesky: "Jsi dojem, a vůbec ne to, čím se zdáš být."
    original: "φαντασία εἶ καὶ οὐ πάντως τὸ φαινόμενον"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa („You are an appearance, and in no manner what you appear to be“)"
    zdroj: epiktetos-rukojet
  - id: rukojet-5
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "5"
    cesky: "Lidi neznepokojují věci, ale jejich soudy o věcech."
    original: "ταράσσει τοὺς ἀνθρώπους οὐ τὰ πράγματα, ἀλλὰ τὰ περὶ τῶν πραγμάτων δόγματα"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-9
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "9"
    cesky: "Nemoc je překážkou těla, ne vůle, pokud to vůle sama nechce. Kulhání je překážkou nohy, ne vůle."
    original: "νόσος σώματός ἐστιν ἐμπόδιον, προαιρέσεως δὲ οὔ, ἐὰν μὴ αὐτὴ θέλῃ. χώλανσις σκέλους ἐστὶν ἐμπόδιον, προαιρέσεως δὲ οὔ."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-14
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "14"
    cesky: "Kdo chce být svobodný, ať nechce nic a ničemu se nevyhýbá z toho, co je v moci druhých. Jinak z něj nutně bude otrok."
    original: "ὅστις οὖν ἐλεύθερος εἶναι βούλεται, μήτε θελέτω τι μήτε φευγέτω τι τῶν ἐπʼ ἄλλοις· εἰ δὲ μή, δουλεύειν ἀνάγκη."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-17
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "17"
    cesky: "Pamatuj, že jsi herec ve hře, jakou chce ten, kdo ji uvádí. Tvým úkolem je dobře zahrát roli, kterou jsi dostal. Vybrat ji náleží jinému."
    original: "μέμνησο, ὅτι ὑποκριτὴς εἶ δράματος, οἵου ἂν θέλῃ ὁ διδάσκαλος … σὸν γὰρ τοῦτʼ ἔστι, τὸ δοθὲν ὑποκρίνασθαι πρόσωπον καλῶς· ἐκλέξασθαι δʼ αὐτὸ ἄλλου."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa; zkráceno (vynechán výčet rolí)"
    zdroj: epiktetos-rukojet
  - id: rukojet-20
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "20"
    cesky: "Neuráží tě ten, kdo ti nadává nebo tě bije, ale tvůj soud, že tě tím uráží."
    original: "οὐχ ὁ λοιδορῶν ἢ ὁ τύπτων ὑβρίζει, ἀλλὰ τὸ δόγμα τὸ περὶ τούτων ὡς ὑβριζόντων"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rukojet-43
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rukojeť
    misto: "43"
    cesky: "Každá věc má dvě ucha: za jedno se unést dá, za druhé ne."
    original: "πᾶν πρᾶγμα δύο ἔχει λαβάς, τὴν μὲν φορητήν, τὴν δὲ ἀφόρητον"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rukojet
  - id: rozpravy-i-1-23
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 1, 23
    cesky: "Nohu mi spoutáš. Mou vůli nepřemůže ani Zeus."
    original: "τὸ σκέλος μου δήσεις, τὴν προαίρεσιν δὲ οὐδʼ ὁ Ζεὺς νικῆσαι δύναται"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rozpravy
  # Slova senátora Helvidia Priska císaři Vespasianovi, jak je vypráví Epiktétos; věta před citátem to musí říct.
  - id: rozpravy-i-2-21
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 2, 21
    cesky: "Ty udělej své a já udělám své. Tvoje je zabít, moje zemřít a netřást se."
    original: "καὶ σὺ τὸ σὸν ποιήσεις κἀγὼ τὸ ἐμόν. σόν ἐστιν ἀποκτεῖναι, ἐμὸν ἀποθανεῖν μὴ τρέμοντα"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa; slova Helvidia Priska v Epiktétově vyprávění"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-i-16-20
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 16, 20
    cesky: "Co jiného mohu já, chromý stařec, než zpívat chválu bohu?"
    original: "τί γὰρ ἄλλο δύναμαι γέρων χωλὸς εἰ μὴ ὑμνεῖν τὸν θεόν;"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-i-18-15
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: I, 18, 15–16
    cesky: "Zítra najdeš hliněnou. Člověk totiž ztrácí jen to, co má."
    original: "αὔριον, φημί, ὀστράκινον εὑρήσεις. ἐκεῖνα γὰρ ἀπολλύει, ἃ ἔχει."
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa („To-morrow, I said, you will find an earthen lamp“)"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-ii-5-1
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: II, 5, 1
    cesky: "Věci jsou lhostejné. To, jak s nimi zacházíme, lhostejné není."
    original: "αἱ ὗλαι ἀδιάφοροι, ἡ δὲ χρῆσις αὐτῶν οὐκ ἀδιάφορος"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl); SEP: „The materials of action are indifferent, but the use we make of them is not indifferent“"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-iii-2-4
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: III, 2, 4
    cesky: "Nemám být bez citu jako socha."
    original: "οὐ δεῖ γάρ με εἶναι ἀπαθῆ ὡς ἀνδριάντα"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl); SEP: „unfeeling like a statue“"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-iii-3-16
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: III, 3, 16
    cesky: "Kdybychom to dělali a cvičili se v tom každý den od rána do noci, něco by z toho bylo."
    original: "καὶ τοῦτο εἰ ἐποιοῦμεν καὶ πρὸς τοῦτο ἠσκούμεθα καθʼ ἡμέραν ἐξ ὄρθρου μέχρι νυκτός, ἐγίνετο ἄν τι, νὴ τοὺς θεούς"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa; vynecháno „při bozích“"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-iii-23-30
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: III, 23, 30
    cesky: "Filozofova škola je ordinace. Nemáte z ní odcházet potěšeni, ale s bolestí."
    original: "ἰατρεῖόν ἐστιν, ἄνδρες, τὸ τοῦ φιλοσόφου σχολεῖον· οὐ δεῖ ἡσθέντας ἐξελθεῖν, ἀλλʼ ἀλγήσαντας"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rozpravy
  - id: rozpravy-iv-1-1
    osoba: epiktetos
    autor: Epiktétos
    dilo: Rozpravy
    misto: IV, 1, 1
    cesky: "Svobodný je ten, kdo žije, jak chce: koho nelze donutit, zastavit ani zlomit násilím."
    original: "ἐλεύθερός ἐστιν ὁ ζῶν ὡς βούλεται, ὃν οὔτʼ ἀναγκάσαι ἔστιν οὔτε κωλῦσαι οὔτε βιάσασθαι"
    preklad:
      druh: vlastni
      podle: "řecký text (H. Schenkl) a anglický překlad G. Longa"
    zdroj: epiktetos-rozpravy
  - id: hovory-i-7
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: I, 7
    cesky: "Od Rustika: že jsem se dostal k Epiktétovým zápiskům, o které se se mnou podělil ze své knihovny."
    original: "Παρὰ Ῥουστίκου … τὸ ἐντυχεῖν τοῖς Ἐπικτητείοις ὑπομνήμασιν, ὧν οἴκοθεν μετέδωκεν"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold); zkráceno, řecky „z domu“"
    zdroj: marcus-hovory
  - id: hovory-ii-1
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: II, 1
    cesky: "Hned ráno si řekni: potkám člověka všetečného, nevděčného, zpupného, lstivého, závistivého, sobeckého."
    original: "Ἕωθεν προλέγειν ἑαυτῷ· συντεύξομαι περιέργῳ, ἀχαρίστῳ, ὑβριστῇ, δολερῷ, βασκάνῳ, ἀκοινωνήτῳ"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-iv-3
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: IV, 3
    cesky: "Svět je změna, život je to, co si o něm myslíme."
    original: "ὁ κόσμος ἀλλοίωσις, ὁ βίος ὑπόληψις"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold); doslova „život je mínění“"
    zdroj: marcus-hovory
  - id: hovory-iv-41
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: IV, 41
    cesky: "Jsi dušička, která nosí mrtvolu, jak říkával Epiktétos."
    original: "Ψυχάριον εἶ βαστάζον νεκρόν, ὡς Ἐπίκτητος ἔλεγεν"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-v-1
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: V, 1
    cesky: "Když se ti za svítání nechce vstávat, měj po ruce: vstávám k práci člověka."
    original: "Ὄρθρου, ὅταν δυσόκνως ἐξεγείρῃ, πρόχειρον ἔστω ὅτι ἐπὶ ἀνθρώπου ἔργον ἐγείρομαι"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-vi-6
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: VI, 6
    cesky: "Nejlepší obrana je nestat se stejným."
    original: "Ἄριστος τρόπος τοῦ ἀμύνεσθαι τὸ μὴ ἐξομοιοῦσθαι"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-vi-30
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: VI, 30
    cesky: "Dej pozor, ať nezcísařštíš, ať tou barvou nenasákneš. To se totiž stává."
    original: "Ὅρα μὴ ἀποκαισαρωθῇς, μὴ βαφῇς· γίνεται γάρ"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-vi-44
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: VI, 44
    cesky: "Jako Antoninus mám za obec a vlast Řím, jako člověk svět."
    original: "Πόλις καὶ πατρὶς ὡς μὲν Ἀντωνίνῳ μοι ἡ Ῥώμη, ὡς δὲ ἀνθρώπῳ ὁ κόσμος"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-vii-7
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: VII, 7
    cesky: "Nestyď se, když ti pomáhají. Máš splnit svůj úkol jako voják, který dobývá hradbu. Co když kulháš a sám na cimbuří nevylezeš, ale s druhým to jde?"
    original: "Μὴ αἰσχύνου βοηθούμενος· πρόκειται γάρ σοι ἐνεργεῖν τὸ ἐπιβάλλον ὡς στρατιώτῃ ἐν τειχομαχίᾳ. τί οὖν, ἐὰν σὺ μὲν χωλαίνων ἐπὶ τὴν ἔπαλξιν ἀναβῆναι μόνος μὴ δύνῃ, σὺν ἄλλῳ δὲ δυνατὸν ᾖ τοῦτο;"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-viii-47
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: VIII, 47
    cesky: "Trápí-li tě něco vnějšího, netrápí tě ta věc, ale tvůj soud o ní. A ten můžeš smazat hned."
    original: "Εἰ μὲν διά τι τῶν ἐκτὸς λυπῇ, οὐκ ἐκεῖνό σοι ἐνοχλεῖ, ἀλλὰ τὸ σὸν περὶ αὐτοῦ κρῖμα, τοῦτο δὲ ἤδη ἐξαλεῖψαι ἐπὶ σοί ἐστιν"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-viii-48
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: VIII, 48
    cesky: "Mysl, kterou neovládají vášně, je hrad. Člověk nemá nic pevnějšího, kam by se uchýlil."
    original: "ἀκρόπολίς ἐστιν ἡ ἐλευθέρα παθῶν διάνοια· οὐδὲν γὰρ ὀχυρώτερον ἔχει ἄνθρωπος, ἐφʼ ὃ καταφυγὼν ἀνάλωτος λοιπὸν ἂν εἴη"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold); zkráceno o „a byl by pak nedobytný“"
    zdroj: marcus-hovory
  - id: hovory-viii-59
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: VIII, 59
    cesky: "Lidé jsou tu jeden pro druhého. Tak je pouč, nebo je snášej."
    original: "Οἱ ἄνθρωποι γεγόνασιν ἀλλήλων ἕνεκεν· ἢ δίδασκε οὖν ἢ φέρε"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-ix-5
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: IX, 5
    cesky: "Křivdí často i ten, kdo něco nedělá, nejen ten, kdo něco dělá."
    original: "Ἀδικεῖ πολλάκις ὁ μὴ ποιῶν τι, οὐ μόνον ὁ ποιῶν τι"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: hovory-ix-30
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: IX, 30
    cesky: "Dívej se shora: nespočetná stáda, nespočetné obřady, lodě v bouři i za bezvětří."
    original: "Ἄνωθεν ἐπιθεωρεῖν ἀγέλας μυρίας καὶ τελετὰς μυρίας καὶ πλοῦν παντοῖον ἐν χειμῶσι καὶ γαλήναις"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold); zkráceno"
    zdroj: marcus-hovory
  - id: hovory-x-16
    osoba: marcus-aurelius
    autor: Marcus Aurelius
    dilo: Hovory k sobě
    misto: X, 16
    cesky: "Už vůbec nerozprávěj o tom, jaký má být dobrý člověk. Buď takový."
    original: "Μηκέθʼ ὅλως περὶ τοῦ οἷόν τινα εἶναι τὸν ἀγαθὸν ἄνδρα διαλέγεσθαι, ἀλλὰ εἶναι τοιοῦτον"
    preklad:
      druh: vlastni
      podle: "řecký text (J. H. Leopold)"
    zdroj: marcus-hovory
  - id: etika-1099a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: I, 8, 1099a31–33
    cesky: "Blaženost zjevně potřebuje i vnější dobra. Je totiž nemožné, nebo aspoň ne snadné, konat krásné činy bez prostředků."
    original: "φαίνεται δʼ ὅμως καὶ τῶν ἐκτὸς ἀγαθῶν προσδεομένη … ἀδύνατον γὰρ ἢ οὐ ῥᾴδιον τὰ καλὰ πράττειν ἀχορήγητον ὄντα"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-stesti
  - id: etika-1100b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: I, 10, 1100b30–33
    cesky: "I v neštěstí prosvítá krása, když člověk nese mnohé a velké rány klidně: ne proto, že nic necítí, ale protože je ušlechtilý a velkodušný."
    original: "ὅμως δὲ καὶ ἐν τούτοις διαλάμπει τὸ καλόν, ἐπειδὰν φέρῃ τις εὐκόλως πολλὰς καὶ μεγάλας ἀτυχίας, μὴ διʼ ἀναλγησίαν, ἀλλὰ γεννάδας ὢν καὶ μεγαλόψυχος"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-stesti
  - id: etika-1153b
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: VII, 13, 1153b19–21
    cesky: "Kdo tvrdí, že člověk lámaný kolem a stižený velkým neštěstím je šťastný, jen když je dobrý, mluví naprázdno, ať chce, nebo nechce."
    original: "οἱ δὲ τὸν τροχιζόμενον καὶ τὸν δυστυχίαις μεγάλαις περιπίπτοντα εὐδαίμονα φάσκοντες εἶναι, ἐὰν ᾖ ἀγαθός, ἢ ἑκόντες ἢ ἄκοντες οὐδὲν λέγουσιν"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-stesti
  - id: etika-1126a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: IV, 5, 1126a7–8
    cesky: "Snášet urážky a přehlížet, když urážejí naše blízké, je otrocké."
    original: "τὸ δὲ προπηλακιζόμενον ἀνέχεσθαι καὶ τοὺς οἰκείους περιορᾶν ἀνδραποδῶδες"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-stesti
  - id: etika-1114a
    osoba: aristoteles
    autor: Aristotelés
    dilo: Etika Nikomachova
    misto: III, 5, 1114a17–19
    cesky: "Kdo hodil kámen, už ho zpátky nevezme. A přece bylo na něm, jestli ho hodí: počátek byl v něm."
    original: "ὥσπερ οὐδʼ ἀφέντι λίθον ἔτʼ αὐτὸν δυνατὸν ἀναλαβεῖν· ἀλλʼ ὅμως ἐπʼ αὐτῷ τὸ βαλεῖν καὶ ῥῖψαι· ἡ γὰρ ἀρχὴ ἐν αὐτῷ"
    preklad:
      druh: vlastni
      podle: "řecký text (I. Bywater) a anglický překlad H. Rackhama"
    zdroj: aristoteles-etika-iii
  - id: menoikeus-134
    osoba: epikuros
    autor: Epikúros
    dilo: Dopis Menoikeovi
    misto: 134 (Diogenés Laertios X, 134)
    cesky: "Bylo by lepší věřit bájím o bozích než otročit osudu přírodních filozofů."
    original: "κρεῖττον ἦν τῷ περὶ θεῶν μύθῳ κατακολουθεῖν ἢ τῇ τῶν φυσικῶν εἱμαρμένῃ δουλεύειν"
    preklad:
      druh: vlastni
      podle: "řecký text a anglický překlad R. D. Hickse (Diogenés Laertios X, 134)"
    zdroj: dl-x-122
  - id: de-fato-43
    osoba: chrysippos
    autor: Cicero
    dilo: O osudu
    misto: "43"
    cesky: "Kdo strčil do válce, dal mu počátek pohybu, ale schopnost valit se mu nedal."
    original: "qui protrusit cylindrum, dedit ei principium motionis, volubilitatem autem non dedit"
    preklad:
      druh: vlastni
      podle: "latinský text (C. F. W. Müller); Cicero větu uvádí jako Chrýsippova slova"
    zdroj: cicero-de-fato-perseus

