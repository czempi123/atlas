# Vztahy mezi lidmi. Typ: ucitel (od = učitel, k = žák), znali-se, vliv-textem (od působil na k), polemika (od polemizoval s k).
# tradovany: true = vztah, který podává antická tradice a odborné prameny ho neberou jako jistý.
