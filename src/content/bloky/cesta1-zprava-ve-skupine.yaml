# Změň jednu věc · cesta 1, krok 5: nový případ z dneška („Představ si…“), bez historických tvrzení.
druh: zmena
obdobi: 1
nadtitulek: Nový případ
scena: >-
  Představ si, že ti večer ve třídní skupině přijde zpráva: „Zítra odpadá první hodina, učitelka je nemocná.“
  Napsal ji spolužák, kterého skoro neznáš.
otazka: Přijdeš zítra později?
moznosti:
  - { id: pozdeji, text: Přijdu později. }
  - { id: normalne, text: Přijdu normálně. }
  - { id: overim, text: Nejdřív si to ověřím. }
podminky:
  - id: deset-lidi
    prepinac: Potvrdí to deset lidí
    zmena: >-
      Teď si představ, že pod zprávou je deset palců nahoru a pět lidí píše „jo, platí“. Nikdo z nich ale neříká, odkud to ví.
    posun: >-
      Posunul ses, protože souhlasí víc lidí. Jenže deset lidí může opakovat jednu zprávu. Ví někdo z nich víc než ten první?
    stejne: >-
      Souhlas deseti lidí tvé rozhodnutí nezměnil. Co by ho změnilo?
  - id: web-skoly
    prepinac: Je to snímek ze školního webu
    zmena: >-
      Teď si představ, že spolužák místo zprávy pošle snímek obrazovky ze školního webu se suplováním.
    posun: >-
      Změnil se zdroj, ne počet lidí, a ty ses posunul. Proč má školní web větší váhu než celá skupina? A dá se snímek obrazovky podvrhnout?
    stejne: >-
      Ani lepší zdroj tvé rozhodnutí nezměnil. Čemu bys musel věřit, aby ano?
  - id: vtipalek
    prepinac: Píše to ten, kdo rád vtipkuje
    zmena: >-
      Teď si představ, že zprávu poslal spolužák, který minulý týden rozeslal vymyšlenou zprávu o zrušeném testu.
    posun: >-
      Posunul ses kvůli tomu, kdo zprávu píše. Je to dobrý důvod, nebo předsudek? Co když tentokrát mluví pravdu?
    stejne: >-
      Kdo zprávu píše, pro tebe nerozhoduje. Na čem tedy tvoje důvěra stojí?
