# Spor · Platón × Diogenés: co je skutečnější, to, co vidím, nebo to, co pochopím?
# Podklady: docs/podklady/spor-platon-diogenes.md (Diogenés Laertios VI, 53; Platón, Ústava VII).
druh: spor
obdobi: 1
nadtitulek: Spor
scena: >-
  Vypráví se, že Platón jednou vykládal o idejích a mluvil o „stolovosti“ a „pohárovosti“:
  o tom, co dělá každý stůl stolem a každý pohár pohárem. Diogenés ho poslouchal a pak se ozval.
otazka: Co je skutečnější, to, co vidíš, nebo to, co pochopíš?
strany:
  - osoba: platon
    postoj: To, co pochopím.
    argumenty:
      - >-
        Stůl se jednou rozpadne a pohár se rozbije. Za proměnlivým světem, který vidíme, stojí neměnné ideje.
        Kdo je nepochopí, je jako vězeň v jeskyni, který celý život hledí na stíny na zdi a má je za skutečnost.
      - >-
        Na Diogenovu námitku prý Platón odpověděl: „Oči, kterými se vidí stůl a pohár, máš.
        Rozum, kterým se vidí stolovost a pohárovost, nemáš.“
  - osoba: diogenes
    postoj: To, co vidím.
    argumenty:
      - >-
        „Stůl a pohár vidím, Platóne. Stolovost a pohárovost ale nikde.“
      - >-
        Diogenés se vysmíval tomu, čemu ostatní slepě věřili. Na vlastním životě ukazoval, že ke šťastnému životu
        stačí velmi málo. Co nejde ukázat ani vyzkoušet, o to nemá cenu se přít.
zdroje: [dl-vi-53, platon-ustava, sep-plato, iep-diogenes]
