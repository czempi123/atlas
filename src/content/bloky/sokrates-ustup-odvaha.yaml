# Volba s důvodem · Sókratův portrét, kapitola 03 „Ústup od Délia“.
# Podklad: Platón, Lachés 181a–b, 190e, 191a–c; Symposion 221a–c (docs/podklady/celek-1-pravda.md).
druh: volba
obdobi: 1
nadtitulek: Tvůj soud
scena: >-
  Lachés tvrdil, že odvážný je ten, kdo zůstane v řadě a neuteče.
  U Délia ale Sókratés ustupoval s ostatními. A Lachés, který šel vedle něj, ho za to chválil.
otazka: Byl Sókratův ústup od Délia odvážný?
moznosti:
  - text: Ne. Odešel z bitvy, i když klidně.
    tah: držet se Lachétovy definice
    zpetna: >-
      Jsi důsledný: definici bereš vážně a nedáváš jí výjimky. Pak ale nebyli stateční ani Sparťané u Platají,
      kteří ustoupili, obrátili se a vyhráli. Vydrží ta definice takový případ?
  - text: Ano. Odvaha není v tom, kam jdeš, ale jak jdeš.
    tah: hledat odvahu v tom, jak člověk jedná
    zpetna: >-
      Děláš totéž co Sókratés v rozhovoru s Lachétem: hledáš, co mají odvážné činy společného, ne jak vypadají zvenku.
      Zkus to dotáhnout. Co přesně bylo na Sókratově chůzi odvážné?
  - text: Ano, ale jen proto, že to dobře dopadlo.
    tah: soudit podle výsledku
    zpetna: >-
      Kdyby ho u Délia zabili, byl by jeho klid méně odvážný? Když soudíš čin podle výsledku, rozhoduje za tebe náhoda.
      Je odvaha v tom, co člověk udělá, nebo v tom, co se mu stane?
  - text: Nevím. Nejdřív bych musel vědět, co odvaha je.
    tah: nejdřív se ptát, co odvaha je
    zpetna: >-
      To je sokratovská odpověď: bez definice nemůžeš poctivě rozhodnout. Jenže Lachés ani Sókratés definici nenašli.
      Dá se o odvaze soudit i bez ní? Podle čeho jsi poznal, že Lachés mluví o odvaze, a ne o něčem jiném?
zdroje: [platon-laches, platon-symposion]
